<text class="h2" x="640.0" y="592.0" text-anchor="start">Bases du calcul</text>
<text class="n" x="640.0" y="614.0" text-anchor="start">Neige de Baie-Comeau : 4,3 kPa au sol + 0,4 kPa de pluie. Sur le</text>
<text class="n" x="654.0" y="632.5" text-anchor="start">toit : 0,55 × 4,3 + 0,4 = 2,8 kPa ; toutes les pièces sont lues</text>
<text class="n" x="654.0" y="651.0" text-anchor="start">dans la colonne 3,0 kPa des tableaux de portées.</text>
<text class="n" x="640.0" y="672.5" text-anchor="start">Bois : épinette-pin-sapin n° 2 ou mieux, sec. Traité sous pression</text>
<text class="n" x="654.0" y="691.0" text-anchor="start">partout où il touche le béton.</text>
<text class="n" x="640.0" y="712.5" text-anchor="start">Chevrons 2 × 6 aux 16" : portée permise 10'-1", portée ici</text>
<text class="n" x="654.0" y="731.0" text-anchor="start">5'-11¾".</text>
<text class="n" x="640.0" y="752.5" text-anchor="start">Solives de plafond 2 × 6 aux 16" : permis 14'-7", ici 12'-1".</text>
<text class="n" x="640.0" y="774.0" text-anchor="start">Linteau de la porte, 2 − 2 × 8 dans le mur pignon (il ne porte que</text>
<text class="n" x="654.0" y="792.5" text-anchor="start">le débord du toit) : permis 12'-0", ici 8'-3".</text>
<text class="n" x="640.0" y="814.0" text-anchor="start">Colombages 2 × 4 aux 16", un chevron et une solive au-dessus de</text>
<text class="n" x="654.0" y="832.5" text-anchor="start">chacun.</text>
<text class="h2" x="640.0" y="862.0" text-anchor="start">Reste à valider</text>
<text class="n" x="640.0" y="884.0" text-anchor="start">La dalle : épaisseurs et armature typiques, non calculées. Le sol,</text>
<text class="n" x="654.0" y="902.5" text-anchor="start">le drainage et le gel se jugent sur place.</text>
<text class="n" x="640.0" y="924.0" text-anchor="start">Le permis, et la distance de 1 m à la piscine (remise, pas</text>
<text class="n" x="654.0" y="942.5" text-anchor="start">garage).</text>
<text class="h2" x="1130.0" y="592.0" text-anchor="start">Écarts avec la fiche</text>
<text class="n" x="1130.0" y="614.0" text-anchor="start">1. Le hors tout fini reste à 13'-0" × 17'-0" : c'est lui qui</text>
<text class="n" x="1144.0" y="632.5" text-anchor="start">tient les marges de la piscine et des lignes de lot.</text>
<text class="n" x="1144.0" y="651.0" text-anchor="start">L'ossature est donc à 12'-8" × 16'-8", et l'intérieur fini à</text>
<text class="n" x="1144.0" y="669.5" text-anchor="start">12'-0" × 16'-0" (fiche : 12'-2" × 16'-2").</text>
<text class="n" x="1130.0" y="691.0" text-anchor="start">2. Mur de 6" et non 5" : OSB et fourrures sous les planches.</text>
<text class="n" x="1144.0" y="709.5" text-anchor="start">Sans OSB le mur n'est pas contreventé ; sans fourrure la</text>
<text class="n" x="1144.0" y="728.0" text-anchor="start">planche verticale n'a rien où se clouer.</text>
<text class="n" x="1130.0" y="749.5" text-anchor="start">3. Bordure de béton de 6" sous les murs : le bois ne trempe ni</text>
<text class="n" x="1144.0" y="768.0" text-anchor="start">dans le gazon ni dans la neige. La dalle reste au ras du gazon</text>
<text class="n" x="1144.0" y="786.5" text-anchor="start">et le mur garde 8'-0".</text>
<text class="n" x="1130.0" y="808.0" text-anchor="start">4. Dalle au nu de l'ossature, sans le débord de 2" : un rebord</text>
<text class="n" x="1144.0" y="826.5" text-anchor="start">de béton ramasse l'eau et l'envoie sous la lisse.</text>
<text class="n" x="1130.0" y="848.0" text-anchor="start">5. Plafond fini à 7'-11½" (fiche : 7'-10"). Faîte à 12'-2⅛" du</text>
<text class="n" x="1144.0" y="866.5" text-anchor="start">sol (fiche : 12'-4" ; la Ville permet 13'-11").</text>
<text class="n" x="1130.0" y="888.0" text-anchor="start">6. Rack de bacs de 141" : il entre dans 144", avec 1½" de jeu</text>
<text class="n" x="1144.0" y="906.5" text-anchor="start">de chaque côté.</text>
</svg>
