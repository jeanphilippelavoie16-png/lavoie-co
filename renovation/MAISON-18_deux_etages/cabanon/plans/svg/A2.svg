<text class="n" x="830.0" y="886.5" text-anchor="start">Bordure coulée avec la dalle, coffrée au nu extérieur. Elle s'arrête de chaque côté de l'ouverture de 8'-3".</text>
<text class="n" x="830.0" y="908.0" text-anchor="start">18 boulons ½" × 8" : 5 par mur de côté, 4 au fond, 2 par bout du mur avant. Ils tombent entre les</text>
