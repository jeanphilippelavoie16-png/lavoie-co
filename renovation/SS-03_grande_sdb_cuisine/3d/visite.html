function porcelaine() {               // dalles 24 x 48 po gris pâle, joints fins (procédural)
  const c = document.createElement("canvas"); c.width = c.height = 1024; const g = c.getContext("2d");

  const d = g.getImageData(0, 0, 1024, 1024);

  g.putImageData(d, 0, 0);
  g.strokeStyle = "#c4c0b8"; g.lineWidth = 3;
  g.strokeRect(1, 1, 1022, 510); g.strokeRect(1, 513, 1022, 510);
  g.beginPath(); g.moveTo(512, 0); g.lineTo(512, 512); g.stroke();

  return t;
}

// boîte avec coordonnées de texture en mètres (les matériaux gardent la même échelle partout)
function boite(b, groupe) {
  const w = (b.x1 - b.x0) * K, h = (b.z1 - b.z0) * K, d = (b.y1 - b.y0) * K;
  if (w <= 0 || h <= 0 || d <= 0) return;
  const g = new THREE.BoxGeometry(w, h, d);
  const mat = MAT[b.mat] || MAT.gypse, e = ECHELLE[b.mat] || 1;
  const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
  const cx = (b.x0 + b.x1) / 2 * K, cy = (b.z0 + b.z1) / 2 * K, cz = -(b.y0 + b.y1) / 2 * K;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) + cx, y = pos.getY(i) + cy, z = pos.getZ(i) + cz;
    const nx = Math.abs(nor.getX(i)), ny = Math.abs(nor.getY(i));
    if (nx > .5) uv.setXY(i, z / e, y / e); else if (ny > .5) uv.setXY(i, x / e, z / e); else uv.setXY(i, x / e, y / e);
  }
  const m = new THREE.Mesh(g, mat); m.position.set(cx, cy, cz); groupe.add(m);
  return m;
}
function cylindre(c, groupe) {
  const g = new THREE.CylinderGeometry(c.r * K, c.r * K, (c.z1 - c.z0) * K, 32);
  const m = new THREE.Mesh(g, MAT[c.mat] || MAT.blanc); m.position.copy(P(c.x, c.y, (c.z0 + c.z1) / 2)); groupe.add(m);
}

// ---------- caméra : visite (première personne) ou maquette (orbite)
let mode = "visite";
const joueur = { x: S.depart.x, y: S.depart.y, cap: S.depart.cap * Math.PI / 180, tangage: -0.05 };
const orbite = { az: -0.6, el: 0.95, dist: 17, cx: (bx0 + bx1) / 2, cy: (by0 + by1) / 2 };
const OEIL = 63;           // 5'-3"
function placerCamera() {
  if (mode === "visite") {
    camera.position.copy(P(joueur.x, joueur.y, OEIL));
    const dx = Math.cos(joueur.cap) * Math.cos(joueur.tangage), dy = Math.sin(joueur.cap) * Math.cos(joueur.tangage), dz = Math.sin(joueur.tangage);
    camera.lookAt(P(joueur.x + dx * 100, joueur.y + dy * 100, OEIL + dz * 100));
  } else {
    const c = new THREE.Vector3(orbite.cx * K, 0, -orbite.cy * K);
    camera.position.set(c.x + orbite.dist * Math.cos(orbite.el) * Math.sin(orbite.az), orbite.dist * Math.sin(orbite.el),
                        c.z + orbite.dist * Math.cos(orbite.el) * Math.cos(orbite.az));
    camera.lookAt(c);
  }
}
function libre(x, y) {
  const r = 10;   // rayon du visiteur (po)
  for (const b of obstacles) if (x > b.x0 - r && x < b.x1 + r && y > b.y0 - r && y < b.y1 + r) return false;
  return x > bx0 && x < bx1 && y > by0 - 60 && y < by1 + 80;
}
function marcher(av, lat, dt) {
  const v = 55 * dt;   // po/s
  const dx = (Math.cos(joueur.cap) * av + Math.cos(joueur.cap - Math.PI / 2) * lat) * v;
  const dy = (Math.sin(joueur.cap) * av + Math.sin(joueur.cap - Math.PI / 2) * lat) * v;
  if (libre(joueur.x + dx, joueur.y)) joueur.x += dx;
  if (libre(joueur.x, joueur.y + dy)) joueur.y += dy;
}

const touches = new Set();
addEventListener("keydown", (e) => { touches.add(e.key.toLowerCase()); });
addEventListener("keyup", (e) => { touches.delete(e.key.toLowerCase()); });
// souris / doigt : regarder (visite) ou tourner (maquette)
const cnv = renderer.domElement;
let glisse = null;
cnv.addEventListener("pointerdown", (e) => {
  if (mode === "visite" && !tactile && document.pointerLockElement !== cnv) {
    try { const r = cnv.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (_) {}
  }
  glisse = { x: e.clientX, y: e.clientY, id: e.pointerId }; cnv.setPointerCapture(e.pointerId);
});
cnv.addEventListener("pointermove", (e) => {
  if (document.pointerLockElement === cnv) { tourner(e.movementX, e.movementY); return; }
  if (!glisse || glisse.id !== e.pointerId) return;
  tourner(e.clientX - glisse.x, e.clientY - glisse.y); glisse.x = e.clientX; glisse.y = e.clientY;
});
cnv.addEventListener("pointerup", () => (glisse = null));
cnv.addEventListener("wheel", (e) => { if (mode === "maquette") { orbite.dist = Math.min(40, Math.max(5, orbite.dist * (e.deltaY > 0 ? 1.1 : 0.9))); e.preventDefault(); } }, { passive: false });
function tourner(dx, dy) {
  if (mode === "visite") {
    joueur.cap -= dx * 0.0035; joueur.tangage = Math.max(-1.2, Math.min(1.2, joueur.tangage - dy * 0.0035));
  } else {
    orbite.az -= dx * 0.006; orbite.el = Math.max(0.25, Math.min(1.5, orbite.el + dy * 0.005));
  }
}
// joystick tactile
const joy = document.getElementById("joy"), bouton = joy.querySelector("span");
let jv = { x: 0, y: 0 };
if (tactile) { joy.hidden = false; document.getElementById("aide").textContent = "Joystick : marcher. Glissez ailleurs pour regarder."; }
joy.addEventListener("pointerdown", (e) => { joy.setPointerCapture(e.pointerId); bougerJoy(e); });
joy.addEventListener("pointermove", (e) => { if (e.buttons || e.pressure) bougerJoy(e); });
joy.addEventListener("pointerup", () => { jv = { x: 0, y: 0 }; bouton.style.transform = ""; });
function bougerJoy(e) {
  const r = joy.getBoundingClientRect(); let x = (e.clientX - r.left - 60) / 50, y = (e.clientY - r.top - 60) / 50;
  const n = Math.hypot(x, y); if (n > 1) { x /= n; y /= n; }
  jv = { x, y }; bouton.style.transform = `translate(${x * 40}px, ${y * 40}px)`;
}

// ---------- interface
function choisirMode(m) {
  mode = m; gPlafond.visible = m === "visite";
  document.getElementById("m-visite").setAttribute("aria-pressed", String(m === "visite"));
  document.getElementById("m-maquette").setAttribute("aria-pressed", String(m === "maquette"));
  document.getElementById("viseur").hidden = m !== "visite" || tactile;
  joy.hidden = !(tactile && m === "visite");
  if (m === "maquette" && document.pointerLockElement) document.exitPointerLock();
}
document.getElementById("m-visite").onclick = () => choisirMode("visite");
document.getElementById("m-maquette").onclick = () => choisirMode("maquette");
const zone = document.getElementById("pieces");
for (const v of S.visites) {
  const b = document.createElement("button"); b.textContent = v.nom;
  b.onclick = () => { joueur.x = v.x; joueur.y = v.y; joueur.cap = v.cap * Math.PI / 180; joueur.tangage = -0.05; choisirMode("visite"); };
  zone.appendChild(b);
}
document.getElementById("t-mob").onclick = (e) => { gMob.visible = !gMob.visible; e.currentTarget.setAttribute("aria-pressed", String(gMob.visible)); };
document.getElementById("t-pal").onclick = (e) => {
  const p = document.getElementById("palette"); p.hidden = !p.hidden; e.currentTarget.setAttribute("aria-pressed", String(!p.hidden));
};
for (const [nom, desc, coul] of S.palette) {
  const li = document.createElement("li"); const i = document.createElement("i"); i.style.background = coul;
  const t = document.createElement("span"); const b = document.createElement("b"); b.textContent = nom; t.append(b, desc);
  li.append(i, t); document.getElementById("pal").append(li);
}
choisirMode("visite");

// ---------- boucle
function taille() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", taille); taille();
let t0 = performance.now();
function boucle(t) {
  const dt = Math.min(0.05, (t - t0) / 1000); t0 = t;
  if (mode === "visite") {
    let av = 0, lat = 0;
    if (touches.has("w") || touches.has("arrowup") || touches.has("z")) av += 1;
    if (touches.has("s") || touches.has("arrowdown")) av -= 1;
    if (touches.has("a") || touches.has("q")) lat -= 1;
    if (touches.has("d")) lat += 1;
    if (touches.has("arrowleft")) joueur.cap += 1.8 * dt;
    if (touches.has("arrowright")) joueur.cap -= 1.8 * dt;
    av -= jv.y; lat += jv.x;
    if (av || lat) marcher(av, lat, dt);
  }
  placerCamera(); renderer.render(scene, camera); requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);
</script>
