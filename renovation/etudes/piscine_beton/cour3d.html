.titre h1 { font: 700 1.15rem/1.15 "Space Grotesk", system-ui, sans-serif; margin: 0; text-wrap: balance; }
.titre p { margin: 3px 0 0; font-size: .78rem; color: var(--doux); }
.vues { margin-left: auto; display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; }
button { font: 600 .82rem Inter, system-ui, sans-serif; color: var(--encre); background: var(--carte); border: 0; border-radius: 999px; padding: 9px 13px; cursor: pointer; backdrop-filter: blur(8px); }

.pied { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));

.pied span { background: var(--carte); border-radius: 999px; padding: 6px 11px; font-size: .76rem; backdrop-filter: blur(8px); font-variant-numeric: tabular-nums; }
.pied b { font-weight: 600; }
@media (max-width: 520px) { .pied span.long { display: none; } }
