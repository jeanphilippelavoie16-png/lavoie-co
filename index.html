<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lavoie &amp; Co</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F3F3ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<!-- iOS : installation plein écran + icône d'accueil -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lavoie & Co">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* ================================================================
     LAVOIE & CO — v4.8.4 « La Carte »
     Refonte : l'esthétique d'une carte de restaurant contemporain.
     Porcelaine + encre + vert bouteille. Plus d'écusson : la marque
     est un mot-symbole en capitales espacées (Marcellus, repli Georgia
     hors ligne). Deux couleurs, deux sens : l'ENCRE agit (boutons,
     navigation), le VERT constate (coché, sélectionné, progression).
     ================================================================ */
  :root{
    --paper:#F3F3ED; --card:#FFFFFF;
    --ink:#141613; --ink2:#3F443E; --mut:#8F928A;
    --line:#E2E2DA; --line2:#EBEBE4;
    /* LE vert de l'app : céladon (celui de la carte du jour). Le pur
       pour remplir (pastilles, coches, accents), le foncé — même
       teinte — pour écrire sur fond clair (contraste 5,4:1). */
    --pine:#9DC3AC; --pine-deep:#4E7360; --pine-ghost:#EAF1EC; --pine-line:#C9DCD0;
    --brass:#4E7360; --brass-2:#9DC3AC; --brass-ghost:#EAF1EC;
    --danger:#A9452F; --danger-ghost:#F6E7E1;
    --side:#FFFFFF; --side-2:#F1F1EB; --side-text:#3F443E; --side-mut:#8F928A; --side-on:#141613;
    --serif:'Marcellus',ui-serif,'New York',Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --r-lg:20px; --r:15px; --r-sm:11px;
    --sh-1:0 1px 2px rgba(20,22,19,.05),0 8px 20px rgba(20,22,19,.05);
    --sh-2:0 10px 28px rgba(20,22,19,.08);
    --sh-pop:0 22px 52px rgba(20,22,19,.16);
    --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
    --nav-w:264px;
    --navbar-h:calc(86px + var(--safe-b));
  }
  /* Le mot-symbole : capitales espacées, & en vert. Le padding-left
     compense l'espacement de la dernière lettre pour centrer à l'œil. */
  .wordmark{font-family:var(--serif);font-weight:400;letter-spacing:.32em;text-transform:uppercase;
    color:var(--ink);white-space:nowrap}
  .wordmark .et{color:var(--pine)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.42;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:var(--pine-ghost)}
  :focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:6px}
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}

  /* ---------- SPLASH : le mot-symbole et son filet qui se trace ---------- */
  #splash{position:fixed;inset:0;z-index:200;background:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    transition:opacity .45s ease,visibility .45s}
  #splash.gone{opacity:0;visibility:hidden}
  .sp-word{font-family:var(--serif);font-size:29px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--ink);padding-left:.32em}
  .sp-word .et{color:var(--pine)}
  /* Révélation lettre par lettre : chaque lettre monte et se défloute.
     Les états de base sont les états FINAUX — si les animations sont
     coupées (réduction des mouvements), tout reste visible. */
  .sp-word span{display:inline-block;animation:spLetter .65s cubic-bezier(.22,1,.36,1) both}
  @keyframes spLetter{from{opacity:0;transform:translateY(18px);filter:blur(7px)}}
  .sp-word span:nth-child(1){animation-delay:.05s}
  .sp-word span:nth-child(2){animation-delay:.11s}
  .sp-word span:nth-child(3){animation-delay:.17s}
  .sp-word span:nth-child(4){animation-delay:.23s}
  .sp-word span:nth-child(5){animation-delay:.29s}
  .sp-word span:nth-child(6){animation-delay:.35s}
  .sp-word span:nth-child(7){animation-delay:.44s}
  .sp-word span:nth-child(8){animation-delay:.53s}
  .sp-word span:nth-child(9){animation-delay:.59s}
  /* La branche d'olivier : un trait céladon qui se dessine (dashoffset
     1 → 0, pathLength normalisé). États de base = trait complet, pour
     rester visible quand les animations sont coupées. */
  .sp-dessin{width:170px;height:56px;overflow:visible;margin:-4px 0}
  .sp-dessin path{fill:none;stroke:#9DC3AC;stroke-width:1.6;stroke-linecap:round;
    stroke-dasharray:1;stroke-dashoffset:0}
  .sp-dessin .tige{animation:spTrace 1.1s .85s cubic-bezier(.45,0,.2,1) both}
  .sp-dessin .f1{animation:spTrace .5s 1.55s ease-out both}
  .sp-dessin .f2{animation:spTrace .5s 1.72s ease-out both}
  .sp-dessin .f3{animation:spTrace .5s 1.89s ease-out both}
  .sp-dessin .f4{animation:spTrace .5s 2.06s ease-out both}
  .sp-dessin .f5{animation:spTrace .5s 2.23s ease-out both}
  @keyframes spTrace{from{stroke-dashoffset:1}}
  .sp-tag{font-size:9.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);
    padding-left:.3em;animation:spRise .9s 2.35s cubic-bezier(.22,1,.36,1) both}
  .sp-bar{width:132px;height:2px;background:var(--line);overflow:hidden;animation:spRise .9s 2.5s both}
  .sp-bar i{display:block;height:100%;width:40%;background:var(--ink);animation:spLoad 1.4s ease-in-out infinite}
  .sp-ver{font-size:10px;color:var(--mut);letter-spacing:.12em;animation:spRise .9s 2.65s both}
  @keyframes spRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spLoad{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}

  /* ---------- Barre latérale (bureau) : panneau clair, filet à droite ---------- */
  .sidebar{display:none}
  .side-logo{padding:6px 4px 2px}
  .side-tag{font-size:9px;color:var(--side-mut);text-transform:uppercase;letter-spacing:.24em;padding:6px 5px 22px;font-weight:600}
  .side-new{margin:0 0 20px;width:100%;background:var(--ink);color:#fff;border-radius:13px;padding:12px;
    font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:7px;
    transition:filter .15s,transform .1s}
  .side-new:active{transform:scale(.98)}
  .side-nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .side-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:var(--side-text);
    font-weight:500;font-size:14.5px;cursor:pointer;transition:background .14s,color .14s}
  .side-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;flex-shrink:0}
  .side-item.on{background:var(--side-on);color:#fff}
  .side-foot{display:flex;align-items:center;gap:8px;padding:12px 8px 4px;border-top:1px solid var(--line);
    font-size:12px;color:var(--side-mut);font-weight:500}
  .side-foot .sver{margin-left:auto;font-size:10.5px;letter-spacing:.04em;opacity:.8}

  /* ---------- Pastille de sync ---------- */
  .sync{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:30px;padding:5px 11px 5px 9px;font-size:11px;font-weight:600;color:var(--ink2);
    letter-spacing:.02em;box-shadow:var(--sh-1);white-space:nowrap}
  .sdot{width:7px;height:7px;border-radius:50%;background:#9DC3AC;transition:background .2s;flex-shrink:0}
  .sdot.busy{background:var(--brass);animation:pulse 1s infinite}
  .sdot.off{background:#C9803F;animation:none}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- Contenu ---------- */
  .content{min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(243,243,237,.92);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    padding:calc(11px + var(--safe-t)) 16px 10px;border-bottom:1px solid transparent;
    transition:border-color .25s,box-shadow .25s;
    display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .logo{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:-.01em}
  .brand .logo .amp{color:var(--brass);font-weight:500;font-style:italic}
  .pagetitle{display:none;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em}
  /* Le cœur : collé à la marque, il s'emplit de céladon quand l'autre
     a laissé quelque chose, et bat doucement jusqu'au « vu ».
     Boîte FIXE centrée : le battement (scale sur le svg, bloc) se fait
     à l'intérieur sans bouger la ligne ni les voisins. */
  #goNous{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0}
  #goNous svg{display:block;transform-origin:center}
  #goNous.new svg path{fill:#9DC3AC}
  #goNous.new svg{animation:coeurbat 2.2s ease-in-out infinite}
  @keyframes coeurbat{0%,100%{transform:scale(1)}8%{transform:scale(1.16)}16%{transform:scale(1)}}

  main{padding:18px 14px 0;max-width:600px;margin:0 auto;padding-bottom:calc(var(--navbar-h) + 24px)}
  .ph{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;line-height:1.1}
  .psub{color:var(--mut);font-size:13px;margin:0 0 18px;letter-spacing:.01em}

  .panes{display:block}
  .recgrid{display:grid;grid-template-columns:1fr;gap:8px}

  /* Les bulles : arrondi uniforme et généreux — doux, propre, moderne. */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 15px;
    margin-bottom:9px;box-shadow:var(--sh-1)}
  .card.tap{transition:transform .12s,box-shadow .16s,border-color .16s}
  .card.tap:active{transform:scale(.988)}
  .card.tracked{background:var(--pine-ghost);border-color:var(--pine-line)}
  .row{display:flex;align-items:center;gap:11px} .grow{flex:1;min-width:0}
  .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .muted{color:var(--mut)} .small{font-size:12.5px}

  /* La date en exergue : chiffre en caractère de titre, comme sur une
     carte — pas de boîte, le contraste fait le travail. */
  .datechip{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0}
  .datechip .d{font-family:var(--serif);font-size:24px;color:var(--ink);line-height:1}
  .datechip.empty .d{color:#C9CCC5}
  .datechip .m{font-size:8px;color:var(--mut);text-transform:uppercase;letter-spacing:.22em;margin-top:3px;font-weight:600;padding-left:.22em}
  .datechip.empty .m{color:#C9CCC5}
  .mealname{font-size:15px;font-weight:600}
  .cook{font-size:11.5px;color:var(--mut);margin-top:1px}
  /* étapes visuelles de l'import Instagram */
  .impsteps{margin:18px 2px 6px;display:none}
  .impsteps.show{display:block}
  .impstep{display:flex;align-items:flex-start;gap:12px;position:relative;padding-bottom:20px}
  .impstep:last-child{padding-bottom:0}
  .impstep::before{content:'';position:absolute;left:13px;top:32px;bottom:4px;width:2px;background:var(--line);border-radius:2px}
  .impstep:last-child::before{display:none}
  .impstep.ok::before{background:linear-gradient(180deg,var(--brass-2),var(--brass))}
  .impstep .num{position:relative;width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--line);
    color:var(--mut);font-family:var(--serif);font-size:13.5px;font-weight:700;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;transition:background .25s,border-color .25s,color .25s}
  .impstep .num svg{width:14px;height:14px}
  .impstep .lbl{font-size:14px;font-weight:600;color:var(--mut);padding-top:3px;transition:color .25s}
  .impstep .sub{font-size:11.5px;color:var(--mut);margin-top:1px;font-weight:400;line-height:1.45}
  .impstep.on .num{border-color:var(--pine);color:var(--pine-deep);background:var(--pine-ghost)}
  .impstep.on .num::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid transparent;
    border-top-color:var(--brass);animation:impspin .9s linear infinite}
  .impstep.on .lbl{color:var(--ink)}
  .impstep.ok .num{background:linear-gradient(135deg,var(--brass-2),var(--brass));border-color:transparent;color:#fff;
    box-shadow:0 1px 4px rgba(180,134,62,.45)}
  .impstep.ok .lbl{color:var(--ink)}
  .impstep.err .num{background:var(--danger-ghost);border-color:var(--danger);color:var(--danger)}
  .impstep.err .lbl{color:var(--danger)}
  .impstep.err .sub{color:var(--danger)}
  @keyframes impspin{to{transform:rotate(360deg)}}
  .ig-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .ig-thumb{position:relative;width:58px;height:58px;border-radius:11px;overflow:hidden;
    border:1px solid var(--line);box-shadow:var(--sh-1);flex-shrink:0}
  .ig-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ig-thumb .rmv{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
    background:rgba(27,36,30,.72);color:#fff;font-size:13px;line-height:18px;text-align:center;cursor:pointer}

  /* créneaux dîner/souper dans une carte de jour */
  .slotrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-radius:9px}
  .slotrow + .slotrow{border-top:1px solid var(--line2)}
  .slotlbl{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brass);
    width:48px;flex-shrink:0}
  .slotempty{color:var(--mut);font-size:13px;font-weight:500}
  .slotrow.dragover{background:var(--pine-ghost);box-shadow:0 0 0 3px var(--pine-ghost)}

  /* La carte du jour : aujourd'hui s'inverse — l'encre devient le fond.
     C'est le punch de la page, et c'est de l'information : le jour qui
     compte se lit avant tous les autres. */
  .card.today{background:var(--ink);border-color:var(--ink);color:#FBFBF9;
    box-shadow:0 14px 30px rgba(20,22,19,.22)}
  .card.today .datechip .d{color:#fff}
  .card.today .datechip .m{color:rgba(255,255,255,.55)}
  .card.today .slotlbl{color:#9DC3AC}
  .card.today .slotempty{color:rgba(255,255,255,.42)}
  .card.today .mealname{color:#FBFBF9}
  .card.today .cook{color:rgba(255,255,255,.55)}
  .card.today .slotrow + .slotrow{border-top-color:rgba(255,255,255,.14)}
  .card.today .chev,.card.today .xdel,.card.today .dragh{color:rgba(255,255,255,.4)}
  .card.today .xdel:active{color:#FF8A70}
  .card.today .slotrow.dragover{background:rgba(255,255,255,.14);box-shadow:none}

  /* Entrée orchestrée : les cartes montent en cascade au changement
     d'onglet — et seulement là, jamais à chaque coche. */
  @keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .anim .pane-a > *{animation:cardIn .45s cubic-bezier(.22,1,.36,1) both}
  .anim .pane-a > *:nth-child(2){animation-delay:.04s}
  .anim .pane-a > *:nth-child(3){animation-delay:.08s}
  .anim .pane-a > *:nth-child(4){animation-delay:.12s}
  .anim .pane-a > *:nth-child(5){animation-delay:.16s}
  .anim .pane-a > *:nth-child(6){animation-delay:.2s}
  .anim .pane-a > *:nth-child(7){animation-delay:.24s}
  .anim .pane-a > *:nth-child(8){animation-delay:.28s}
  .anim .pane-a > *:nth-child(n+9){animation-delay:.32s}
  .anim .recgrid > .card,.anim .inggrid > .card{animation:cardIn .4s cubic-bezier(.22,1,.36,1) both}

  /* Bulles d'épicerie : la teinte du rayon tant que c'est à acheter,
     retour au neutre une fois coché (le !important bat la teinte en
     ligne, posée par rayBlock). Le point de couleur signe l'en-tête. */
  .epi-card.done{background:var(--card)!important;border-color:var(--line)!important}
  .epi-card .chk{background:rgba(255,255,255,.75)}
  .raydot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

  /* Rayon d'épicerie complété : l'en-tête se raye, le compte devient ✓ */
  .rayhd.done > span:first-child{color:var(--brass);text-decoration:line-through;
    text-decoration-thickness:1px;text-decoration-color:var(--brass-2)}
  .rayhd.done .ct{color:var(--brass);font-weight:700}

  /* ---------- Accordéons (listes rapides, rayons) ---------- */
  /* Pliage moderne : grid 1fr → 0fr, le contenu glisse sans mesurer sa hauteur. */
  .fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s cubic-bezier(.22,1,.36,1)}
  .fold.closed{grid-template-rows:0fr}
  .fold > div{overflow:hidden;min-width:0}
  .foldchev{color:#C2C5BD;font-size:17px;display:inline-block;padding:0 2px;
    transform:rotate(0);transition:transform .25s cubic-bezier(.22,1,.36,1)}
  .foldchev.open{transform:rotate(90deg)}
  .ctchip{font-size:10.5px;font-weight:700;color:var(--ink2);background:var(--line2);
    border-radius:20px;padding:3px 9px;letter-spacing:.03em;white-space:nowrap}

  /* Épicerie : deux modes — Préparer / Magasiner. Le sélecteur en
     pilule ne vit qu'au téléphone ; le bureau garde ses deux volets. */
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;
    margin:0 0 16px;box-shadow:var(--sh-1)}
  .seg .sg{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;
    border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink2);cursor:pointer;
    transition:background .18s,color .18s}
  .seg .sg.on{background:var(--ink);color:#fff}
  .seg .sg.on .ctchip{background:rgba(255,255,255,.18);color:#fff}
  .shopsum{display:flex;align-items:center;gap:14px;padding:14px 17px}
  .shopsum .n{font-family:var(--serif);font-size:36px;line-height:1;color:var(--ink)}
  /* Bande d'humeurs (Julie & JP) : visages au trait, l'actif en céladon */
  .humband{display:flex;justify-content:space-between;gap:4px;background:var(--paper);
    border-radius:999px;padding:6px 8px;margin-bottom:12px}
  .hum{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--mut);transition:background .18s,color .18s,transform .12s}
  .hum:active{transform:scale(.9)}
  .hum.on{background:var(--pine);color:var(--ink)}
  @media(max-width:899px){
    .mode-shop .pane-a{display:none}
    .mode-prep .pane-b{display:none}
  }
  @media(min-width:900px){ .seg-epi{display:none} }

  /* ---------- Calendrier familial ---------- */
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
  .calhd7{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
    text-align:center;padding:4px 0}
  .calc{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:12px;font-size:14px;color:var(--ink2);background:var(--card);
    border:1px solid var(--line);cursor:pointer;position:relative;gap:2px}
  .calc.vide{background:transparent;border-color:transparent;cursor:default}
  .calc.auj{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .calc .evdot{display:flex;gap:3px;height:5px}
  .calc .evdot i{width:5px;height:5px;border-radius:50%;background:var(--pine)}
  .calc.auj .evdot i{background:#9DC3AC}
  .calc .mdot{position:absolute;top:5px;right:7px;width:4px;height:4px;border-radius:50%;background:var(--brass-2)}

  /* ---------- Le menu de chasse imprimable (aperçu + PDF) ----------
     Pensé pour tenir sur UNE page : boissons en deux colonnes, puis
     les huit jours en grille 2 × 4. Plats en Cormorant Garamond
     italique — l'écriture des cartes de grands restaurants. */
  #chassePrint{position:fixed;inset:0;z-index:90;background:var(--paper);overflow-y:auto;
    -webkit-overflow-scrolling:touch}
  .chm{max-width:560px;margin:0 auto;padding:26px 22px 44px;text-align:center;
    font-family:'Cormorant Garamond',Georgia,serif}
  .chm .chm-titre{font-family:var(--serif);font-size:30px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink);margin:8px 0 2px;padding-left:.16em}
  .chm .chm-sous{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
    color:var(--pine-deep);padding-left:.3em;margin-bottom:4px}
  .chm .chm-filet{width:110px;height:1px;background:var(--ink);margin:14px auto}
  .chm-2col{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;align-items:start}
  .chm-sec{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
    color:var(--pine-deep);margin:8px 0 5px;padding-left:.26em}
  .chm-item{font-size:17px;font-style:italic;font-weight:500;color:var(--ink2);line-height:1.5}
  .chm .chm-jour{margin:13px 0 1px;display:flex;align-items:center;gap:10px}
  .chm .chm-jour .ln{flex:1;height:1px;background:var(--line)}
  .chm .chm-jour .t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--pine-deep)}
  .chm .chm-plat{font-size:17px;font-weight:500;font-style:italic;color:var(--ink);margin:4px 0 0;line-height:1.3}
  .chm .chm-plat .quoi{font-size:8px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    color:var(--mut);display:block;margin-bottom:0;font-family:var(--sans);font-style:normal}
  .chm .chm-libre{color:#C2C5BD;font-size:15px}
  .chm-bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;
    padding:14px;background:rgba(243,243,237,.94);backdrop-filter:blur(8px)}
  @media print{
    body > *{display:none!important}
    body > #chassePrint{display:block!important;position:static;overflow:visible;background:#fff}
    .chm-bar{display:none!important}
    .chm{max-width:none;padding:8px 10px}
  }

  /* En-têtes de rayon collants : en magasin, le rayon reste lisible
     pendant qu'on défile ses items. */
  .rayhd{position:sticky;top:calc(44px + var(--safe-t));z-index:5;background:var(--paper);
    cursor:pointer;padding:7px 5px;margin:12px 0 4px}

  /* Badge de navigation : ce qu'il reste à acheter, visible de partout. */
  .mobilenav .nv{position:relative}
  .navbadge{position:absolute;top:0;right:2px;min-width:16px;height:16px;border-radius:9px;
    background:var(--pine);color:var(--ink);font-size:9px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 4px}
  .side-item .navbadge{position:static;margin-left:auto}

  /* Voile de la barre du haut : le filet n'apparaît qu'au défilement. */
  body.scrolled .topbar{border-bottom-color:var(--line);box-shadow:0 8px 24px rgba(20,22,19,.05)}

  /* Barre de défilement discrète (bureau) */
  ::-webkit-scrollbar{width:11px}
  ::-webkit-scrollbar-thumb{background:#DADAD3;border-radius:8px;border:3px solid var(--paper)}
  ::-webkit-scrollbar-track{background:transparent}
  .lastcook{color:var(--brass);font-weight:600}
  .tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .ttag{font-size:10px;padding:2.5px 8px;border-radius:20px;background:var(--pine-ghost);color:var(--pine-deep);font-weight:600}
  .trackchip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--brass);background:var(--brass-ghost);border:1px solid var(--brass-2);
    border-radius:20px;padding:3px 9px;white-space:nowrap}
  .trackchip svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:3}
  .xdel{color:#C6CCC6;font-size:20px;padding:2px 6px;line-height:1;cursor:pointer;transition:color .15s}
  .xdel:active{color:var(--danger)}
  .chev{color:#C6CCC6;font-size:19px}

  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:15px}
  .btn{background:var(--ink);color:#fff;border-radius:999px;padding:13px 20px;font-weight:600;width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;
    transition:filter .15s,transform .1s,background .15s}
  .btn:active{transform:scale(.985);background:#000}
  .btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-1)}
  .btn.ghost{background:var(--pine-ghost);color:var(--pine-deep)}
  .btn.danger{background:var(--card);color:var(--danger);border:1px solid var(--line)}
  .btn.sm{padding:9px 15px;font-size:13.5px;width:auto;border-radius:999px}
  .btn[disabled]{opacity:.5;pointer-events:none}

  .fab{position:fixed;bottom:calc(var(--navbar-h) + 14px);right:16px;z-index:40;width:56px;height:56px;
    border-radius:50%;background:var(--ink);color:#fff;font-size:28px;font-weight:300;
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(20,22,19,.24);
    transition:transform .12s}
  .fab:active{transform:scale(.93)}

  label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin:0 0 5px}
  input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 13px;border:1px solid var(--line);
    border-radius:12px;background:var(--card);color:var(--ink);transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-ghost)}
  input::placeholder,textarea::placeholder{color:#B4BBB4}
  .field{margin-bottom:13px}

  /* Cases à cocher : des cercles fins, comme un rond de serviette —
     et le crochet SE DESSINE d'un trait, même geste que la branche
     d'olivier du splash. */
  .chk{width:25px;height:25px;border-radius:50%;border:1.5px solid #CBCBC1;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;background:var(--card);
    transition:border-color .18s,background .18s,box-shadow .18s;
    box-shadow:inset 0 1px 3px rgba(20,22,19,.05)}
  .chk.on{background:var(--pine);border-color:var(--pine);color:var(--ink);animation:chkpop .22s ease;box-shadow:none}
  .chk svg{width:12px;height:12px}
  .chk.on svg path{stroke-dasharray:1;stroke-dashoffset:0;animation:chkdraw .35s .04s cubic-bezier(.4,0,.2,1) both}
  @keyframes chkdraw{from{stroke-dashoffset:1}}
  @keyframes chkpop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  .done .mealname,.done .itxt{text-decoration:line-through;color:var(--mut);text-decoration-color:#CCD2CD}

  /* En-têtes de rayon : filet de laiton qui se remplit à mesure qu'on coche */
  .rayhd{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;color:var(--pine-deep);
    text-transform:uppercase;letter-spacing:.11em;margin:20px 5px 8px}
  .rayhd:first-child{margin-top:4px}
  .rayprog{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
  .rayprog i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-2),var(--brass));
    border-radius:3px;transition:width .3s ease}
  .rayhd .ct{color:var(--mut);font-weight:600;letter-spacing:0;font-size:11px}

  .grphd{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;color:var(--pine-deep);
    text-transform:uppercase;letter-spacing:.11em;margin:20px 5px 8px}
  .grphd:first-child{margin-top:4px}
  .grphd .ln{flex:1;height:1px;background:var(--line)}
  .grphd .ct{color:var(--mut);font-weight:600;letter-spacing:0}

  /* épicerie compacte */
  .epi-card{padding:8px 11px}
  .epi-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
  .epi-qty{font-size:14px;color:var(--ink2);font-weight:700;white-space:nowrap;cursor:pointer;
    padding:4px 8px;border-radius:9px;border:1px solid transparent;transition:border-color .15s,background .15s}
  .epi-qty .u{font-weight:500;color:var(--mut);margin-left:2px}
  .epi-qty .qtyin{width:52px;padding:4px 6px;font-size:14px;font-weight:700;text-align:right;
    border:1px solid var(--pine);border-radius:8px}
  .src{font-size:10.5px;color:var(--mut);margin-top:1px}

  /* ---------- Nav mobile flottante ---------- */
  .mobilenav{position:fixed;bottom:calc(10px + var(--safe-b));left:10px;right:10px;z-index:30;
    background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh-2);
    display:flex;justify-content:space-around;align-items:center;padding:8px 6px}
  .mobilenav .nv{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--mut);
    font-weight:700;padding:6px 8px;border-radius:15px;transition:color .15s,background .15s;letter-spacing:.01em;
    flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap}
  .mobilenav .nv.on{color:#fff;background:var(--ink)}
  .mobilenav .nv svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}
  .mobilenav .nv.on svg{stroke-width:2.2}

  .weeknav{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px;background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--sh-1)}
  .weeknav .arr{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--pine-deep);cursor:pointer;transition:background .14s}
  .weeknav .arr:active{background:var(--pine-ghost)}
  .weeknav .lbl{font-weight:600;font-size:13.5px;text-align:center}
  .weeknav .lbl .sm{display:block;font-size:10.5px;color:var(--mut);font-weight:500}

  .secthd{display:flex;align-items:center;gap:10px;margin:22px 4px 11px}
  .secthd .t{font-family:var(--serif);font-size:16.5px;font-weight:700;letter-spacing:-.01em}
  .secthd .ln{flex:1;height:1px;background:var(--line)}

  .filt,.pills{display:flex;gap:7px;overflow-x:auto;padding:1px 2px 12px;-webkit-overflow-scrolling:touch}
  .filt::-webkit-scrollbar,.pills::-webkit-scrollbar{display:none}
  .fchip,.pill{font-size:12.5px;padding:6px 13px;border-radius:30px;background:var(--card);border:1px solid var(--line);
    color:var(--ink2);white-space:nowrap;font-weight:500;cursor:pointer;transition:all .13s}
  .fchip.on,.pill.on{background:var(--pine);color:var(--ink);border-color:var(--pine)}
  .pill.addp{color:var(--pine-deep);border-style:dashed}

  .selbtn{position:sticky;bottom:calc(var(--navbar-h) + 8px);z-index:25;margin-top:6px}

  .overlay{position:fixed;inset:0;background:rgba(22,32,25,.46);z-index:50;display:flex;align-items:flex-end;
    justify-content:center;animation:fade .18s ease;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--paper);width:100%;max-width:540px;max-height:92vh;overflow-y:auto;
    border-radius:26px 26px 0 0;padding:8px 18px calc(120px + var(--safe-b));
    animation:up .28s cubic-bezier(.22,1,.36,1)}
  @keyframes up{from{transform:translateY(40px)}to{transform:translateY(0)}}
  .grab{width:38px;height:4px;background:#D5D9D3;border-radius:3px;margin:8px auto 14px}
  .shd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .shd .t{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.01em}
  .shd .x{font-size:25px;color:var(--mut);cursor:pointer;padding:4px;line-height:1}
  .btnrow{display:flex;gap:9px}

  .tchip{font-size:13px;padding:8px 14px;border-radius:30px;background:var(--card);border:1px solid var(--line);
    color:var(--ink2);font-weight:500;cursor:pointer;transition:all .13s;display:inline-flex;align-items:center;gap:6px}
  .tchip.on{background:var(--pine);color:var(--ink);border-color:var(--pine)}
  .tchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

  .ingrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
  .ingrow .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ingrow .nm{flex:1;font-weight:600;font-size:14.5px}
  .usel{font-size:15px;padding:11px 12px;width:100%} .ucustom{font-size:15px;padding:10px 12px;width:100%}
  .ingrow .ray{font-size:10.5px;color:var(--pine-deep);background:var(--pine-ghost);padding:3px 9px;border-radius:20px;
    font-weight:600;white-space:nowrap}
  .ingrow .rm{color:#C6CCC6;font-size:19px;cursor:pointer;padding:0 2px}
  .ingrow .bot{display:flex;gap:8px} .ingrow .bot input{padding:9px 11px}

  .ac{position:relative}
  .ac-list{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:60;background:var(--card);
    border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh-pop);max-height:min(210px,40vh);
    overflow-y:auto;padding:5px}
  .ac-item{padding:11px 12px;border-radius:9px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .ac-item:active{background:var(--pine-ghost)}
  .ac-item .nm{flex:1;font-size:15px} .ac-item .ray{font-size:11px;color:var(--mut)}
  .ac-new{padding:11px 12px;border-radius:9px;display:flex;align-items:center;gap:9px;cursor:pointer;
    color:var(--pine-deep);font-weight:600;border-top:1px solid var(--line2);margin-top:3px}
  .ac-new:active{background:var(--pine-ghost)}
  .ac-new svg{width:17px;height:17px}

  .empty{text-align:center;color:var(--mut);padding:40px 24px;font-size:14px;line-height:1.7}
  .empty .crest{width:36px;height:1px;background:var(--line);margin:0 auto 16px;display:block}
  .clk{cursor:pointer} .hide{display:none!important}

  /* étapes : édition */
  .stepedit{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;margin-bottom:7px}
  .stepedit .steptxt{flex:1;font-size:14px;line-height:1.45;padding-top:3px}
  .stepedit .stepacts{display:flex;gap:6px;align-items:center;flex-shrink:0}
  .stepedit .stepup,.stepedit .stepdn{color:var(--mut);font-size:16px;width:22px;height:22px;display:flex;
    align-items:center;justify-content:center;border-radius:6px}
  .stepedit .stepup:active,.stepedit .stepdn:active{background:var(--pine-ghost)}
  .stepnum{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--pine);color:#fff;
    font-family:var(--serif);font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  /* étapes : affichage détail */
  .steplist{display:flex;flex-direction:column;gap:2px}
  .steprow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
  .steprow:last-child{border-bottom:none}
  .steprow .stepnum{background:linear-gradient(135deg,var(--brass-2),var(--brass));
    box-shadow:0 1px 4px rgba(180,134,62,.45)}
  .stepbody{flex:1;font-size:14.5px;line-height:1.55;padding-top:3px}

  .dragh{display:none;color:#C6CCC6;font-size:17px;cursor:grab;padding:0 2px}
  .dropday.dragover{border-color:var(--pine);background:var(--pine-ghost);box-shadow:0 0 0 3px var(--pine-ghost)}
  .dropray.dragover{background:var(--pine-ghost);border-radius:9px;padding-left:6px;padding-right:6px;color:var(--pine-deep)}
  .inggrid{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:6px}
  .ingcard{padding:9px 12px}
  @media(min-width:680px){ .inggrid{grid-template-columns:1fr 1fr} }
  @media(min-width:1080px){ .inggrid{grid-template-columns:1fr 1fr 1fr} }
  .dragging{opacity:.45}
  @media(min-width:900px){ .dragh{display:inline} [data-dragrec]{cursor:grab} [data-draging]{cursor:grab} }

  .toast{position:fixed;bottom:calc(var(--navbar-h) + 18px);left:50%;transform:translateX(-50%);z-index:80;
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;padding:11px 18px;border-radius:30px;
    box-shadow:var(--sh-pop);max-width:90%;text-align:center;animation:tin .2s ease}
  .toast.err{background:var(--danger)}
  @keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

  /* Marcellus n'existe qu'en une graisse : jamais de faux gras, et un
     léger espacement positif — les titres respirent comme sur une carte. */
  .ph,.pagetitle,.shd .t,.secthd .t,.stepnum,.impstep .num{font-weight:400;letter-spacing:.02em}

  /* ============ BUREAU ============ */
  @media(min-width:900px){
    .sidebar{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);
      background:var(--side);border-right:1px solid var(--line);padding:24px 16px calc(16px + var(--safe-b));z-index:40}
    .mobilenav{display:none}
    .fab{display:none!important}
    .content{margin-left:var(--nav-w)}
    .topbar{padding:20px 36px;background:var(--paper)}
    .brand{display:none} .pagetitle{display:block}
    main{max-width:1120px;margin:0 auto;padding:30px 36px 60px}
    .ph{font-size:42px} .psub{font-size:14.5px;margin-bottom:24px}
    .card{padding:14px 16px;margin-bottom:9px} .epi-card{padding:11px 14px}
    .toast{bottom:32px} .selbtn{position:static}
    .panes{display:grid;grid-template-columns:minmax(330px,360px) 1fr;gap:32px;align-items:start}
    .pane-a{position:sticky;top:96px}
    .recgrid{grid-template-columns:1fr 1fr;gap:12px}
    .overlay{align-items:center} .grab{display:none}
    .sheet{border-radius:22px;max-width:560px;min-height:340px;max-height:90vh;padding-bottom:28px;
      animation:pop .22s cubic-bezier(.22,1,.36,1)}
    .sheet.tall{min-height:520px}
    @keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
    .sp-word{font-size:40px}
  }
  @media(min-width:1280px){ .recgrid{grid-template-columns:1fr 1fr 1fr} }
  @media(hover:hover){
    .card.tap:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--pine-line)}
    .side-item:hover{background:var(--side-2);color:var(--ink)}
    .side-new:hover{filter:brightness(1.07)}
    .btn:hover{filter:brightness(1.05)} .btn.sec:hover,.btn.danger:hover{background:var(--pine-ghost)}
    .fchip:hover,.pill:hover,.tchip:hover{border-color:var(--pine)}
    .xdel:hover{color:var(--danger)}
    .ac-item:hover,.ac-new:hover{background:var(--pine-ghost)}
    .weeknav .arr:hover{background:var(--pine-ghost)}
    .epi-qty:hover{border-color:var(--line);background:var(--paper)}
    .row:hover .chk:not(.on){border-color:var(--pine)}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="sp-word"><span>L</span><span>a</span><span>v</span><span>o</span><span>i</span><span>e</span> <span class="et">&amp;</span> <span>C</span><span>o</span></div>
  <svg class="sp-dessin" viewBox="0 0 170 56" aria-hidden="true">
    <path class="tige" pathLength="1" d="M4 44 C 48 40, 112 30, 166 12"/>
    <path class="f1" pathLength="1" d="M40 38 Q 32 24 44 18 Q 48 30 40 38"/>
    <path class="f2" pathLength="1" d="M66 34 Q 62 48 76 50 Q 76 38 66 34"/>
    <path class="f3" pathLength="1" d="M92 29 Q 86 15 98 10 Q 101 22 92 29"/>
    <path class="f4" pathLength="1" d="M118 24 Q 115 37 128 39 Q 127 28 118 24"/>
    <path class="f5" pathLength="1" d="M142 18 Q 138 6 148 3 Q 150 13 142 18"/>
  </svg>
  <div class="sp-tag">Cuisine &amp; planification familiales</div>
  <div class="sp-bar"><i></i></div>
  <div class="sp-ver">v4.8.4</div>
</div>

<aside class="sidebar">
  <div class="side-logo"><span class="wordmark" style="font-size:15px">Lavoie <span class="et">&amp;</span> Co</span></div>
  <div class="side-tag">Cuisine &amp; planification</div>
  <button class="side-new" id="sideNew"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Nouvelle recette</button>
  <nav class="side-nav" id="sideNav">
    <div class="side-item" data-tab="menu" role="button" tabindex="0"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 4v17"/></svg>Menu de la semaine</div>

var MOIS_L = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ---------- État ---------- */
var DATA = null, REV = 0, TAB = 'menu';
var curListe = null, weekOffset = 0;

// Attache le comportement accordéon : l'en-tête bascule le .fold voisin

function bindFolds(attr, prefixe){

/* ---------- Utils ---------- */
function $(id){ return document.getElementById(id); }
function qall(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
function isTrue(v){ return v === true || String(v).toUpperCase() === 'TRUE'; }
function cid(p){ return p + Date.now().toString(36) + Math.floor(Math.random() * 46656).toString(36); }
function num(v){ if (v === '' || v === null || v === undefined) return 0; if (typeof v === 'number') return v; var n = parseFloat(String(v).trim().replace(',', '.')); return isNaN(n) ? 0 : n; }

function norm(s){ return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim(); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function ymd(dt){ return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); }
function parseYmd(iso){ var p = String(iso).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
// La semaine commence le DIMANCHE (demande du 2026-08-26) — getDay()
// vaut 0 le dimanche, donc on recule simplement de getDay() jours.
function debutSemaine(date){ var d = new Date(date); d.setDate(d.getDate() - d.getDay()); d.setHours(0,0,0,0); return d; }
function weekDates(off){ var m = debutSemaine(new Date()); m.setDate(m.getDate() + off * 7); var a = []; for (var i = 0; i < 7; i++) { var d = new Date(m); d.setDate(m.getDate() + i); a.push(d); } return a; }
function plurUnite(qte, unite){
  var u = String(unite || '').trim(); if (!u) return '';
  var n = num(qte);
  if (n <= 1) return u;
  var key = u.toLowerCase();
  if (UNIT_NOPLUR[key]) return key === 'unité' ? 'unités' : u;
  if (/[sx]$/i.test(u)) return u;
  return u + 's';
}

/* ---------- Teintes de rayon (liste d'épicerie) ---------- */
// Chaque rayon a sa couleur : les items À ACHETER portent la teinte de
// leur rayon, un item coché redevient neutre et s'efface. Six tons
// [fond, bordure, point] ; le choix suit l'ordre des rayons du classeur.
var RAYON_TINTS = [
  ['#E3EFE0', '#CDE0C8', '#4E7A5C'], ['#F7E7D9', '#EBD3BF', '#B06A42'],
  ['#F5EDCF', '#E8DBAC', '#9A7F33'], ['#E1EAF2', '#CEDDEA', '#47698A'],
  ['#F0E2F0', '#DFCADF', '#7D557D'], ['#F0EADB', '#E1D6BE', '#8A7A57']
];
var _rayIdx = null;
function rayonTint(ray){
  if (!_rayIdx) {
    _rayIdx = {};
    rayonsSorted().forEach(function (r, i) { _rayIdx[String(r.Rayon).trim()] = i % RAYON_TINTS.length; });
  }
  var i = _rayIdx.hasOwnProperty(ray) ? _rayIdx[ray] : (String(ray).length % RAYON_TINTS.length);
  return RAYON_TINTS[i];
}

/* ---------- Accès aux données ---------- */
function recette(rid){ return (DATA.recettes || []).filter(function (x) { return String(x.RecetteID) === String(rid); })[0]; }
function recetteNom(rid){ var r = recette(rid); return r ? r.Nom : '(supprimée)'; }
function ingredientsOf(rid){ return (DATA.ingredients || []).filter(function (i) { return String(i.RecetteID) === String(rid); }); }
function rayonsSorted(){ return (DATA.rayons || []).slice().sort(function (a, b) { return a.Ordre - b.Ordre; }); }
function catalogue(){ return (DATA.catalogue || []).slice().sort(function (a, b) { return String(a.Ingredient).localeCompare(String(b.Ingredient)); }); }
function souperFor(iso, rep){ rep = rep || 'souper'; return (DATA.soupers || []).filter(function (s) { return s.Date === iso && repasOf(s.Repas) === rep; })[0]; }
function epiItem(id){ return (DATA.epicerie || []).filter(function (x) { return String(x.ListeID) === String(id); })[0]; }
function liste(id){ return (DATA.listes || []).filter(function (l) { return String(l.ListeID) === String(id); })[0]; }
function mealTracked(date, rep, rid){
  return (DATA.epicerieRepas || []).some(function (t) {
    return String(t.Date) === String(date) && repasOf(t.Repas) === rep && String(t.RecetteID) === String(rid);
  });
}
function lastCookedLabel(r){
  var lc = r.lastCooked; if (!lc) return '';
  var today = new Date(); today.setHours(0,0,0,0);
  var d = parseYmd(lc); d.setHours(0,0,0,0);
  var days = Math.round((today - d) / 86400000);
  if (days < 0) return 'prévu bientôt';
  if (days === 0) return 'aujourd\'hui';
  if (days === 1) return 'hier';
  if (days < 7) return 'il y a ' + days + ' jours';
  if (days < 14) return 'il y a 1 semaine';
  if (days < 31) return 'il y a ' + Math.floor(days / 7) + ' semaines';
  if (days < 60) return 'il y a 1 mois';
  return 'il y a ' + Math.floor(days / 30) + ' mois';
}

/* ---------- Persistance locale ---------- */
function normalizeData(d){
  if (!d) return d;
  _rayIdx = null; // l'ordre des rayons a pu changer côté serveur
  d.epicerieRepas = d.epicerieRepas || [];
  d.chasse = d.chasse || [];
  d.evenements = d.evenements || [];
  d.nous = d.nous || [];
  d.chasse.forEach(function (c) { c.Repas = repasOf(c.Repas); });
  (d.soupers || []).forEach(function (s) { s.Repas = repasOf(s.Repas); });
  d.epicerieRepas.forEach(function (t) { t.Repas = repasOf(t.Repas); });
  return d;
}
function saveLocal(){ try { localStorage.setItem(LKEY, JSON.stringify({ t: Date.now(), rev: REV, data: DATA })); } catch (e) {} }
function loadLocal(){
  try {
    var raw = localStorage.getItem(LKEY) || localStorage.getItem(LKEY_OLD);
    if (!raw) return null;
    var o = JSON.parse(raw);
    return o && o.data ? o : null;
  } catch (e) { return null; }
}

/* ---------- Transport ---------- */
function apiCall(fn, args){
  if (!HOSTED) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(google.script.run, args || []);
    });
  }
  // POST text/plain = « simple request » : pas de preflight CORS, aucune limite d'URL.
  return fetch(CONFIG.API_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], token: CONFIG.APP_TOKEN })
  }).then(function (r) {
    return r.text().then(function (txt) {
      var j;
      try { j = JSON.parse(txt); }
      catch (e) {
        var err = new Error('Réponse invalide du serveur (' + r.status + ')');
        err.soft = (r.status >= 200 && r.status < 500); // config probable, pas un problème réseau
        throw err;
      }
      if (!j || !j.ok) { var e2 = new Error((j && j.error) || 'Erreur serveur'); e2.server = true; throw e2; }
      return j.result;
    });
  });
}

/* ================================================================
   MOTEUR DE SYNC
   ================================================================ */
var syncQueue = [], flushing = false, inflight = 0, pulling = false, hbBusy = false;
var NEEDS_PULL = false;
var queueCallbacks = {};
var pendEpi = {}, epiT = null, pendLi = {}, liT = null;

function loadQueue(){
  try { syncQueue = JSON.parse(localStorage.getItem(QKEY) || '[]'); if (!Array.isArray(syncQueue)) syncQueue = []; } catch (e) { syncQueue = []; }
  // Migration : récupérer les modifs offline laissées par l'ancienne app
  try {
    var old = JSON.parse(localStorage.getItem(QKEY_OLD) || '[]');
    if (Array.isArray(old) && old.length) { syncQueue = old.concat(syncQueue); localStorage.removeItem(QKEY_OLD); }
  } catch (e) {}
  syncQueue.forEach(function (it) { if (typeof it.tries !== 'number') it.tries = 0; });
  saveQueue();
}
function saveQueue(){ try { localStorage.setItem(QKEY, JSON.stringify(syncQueue)); } catch (e) {} }
function pendingCount(){ return syncQueue.length + Object.keys(pendEpi).length + Object.keys(pendLi).length; }

function editingOpen(){ return !!($('ov') || $('ov2')); }
function typingNow(){ var a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
// On ne remplace les données locales par celles du serveur QUE si rien n'est en cours.
function canPull(){
  return !editingOpen() && !typingNow() &&
    !Object.keys(pendEpi).length && !Object.keys(pendLi).length &&
    !syncQueue.length && !flushing && !pulling;
}

function enqueue(fn, args, onDone){
  var qid = cid('q');
  syncQueue.push({ fn: fn, args: args || [], id: qid, ts: Date.now(), tries: 0 });
  if (onDone) queueCallbacks[qid] = onDone;
  saveQueue(); updateSync();
  flushQueue();
}

// Vide la file vers le serveur, dans l'ordre.
// Réseau coupé → on garde tout et on réessaie plus tard.
// Op refusée par le serveur → on la retire (la file ne bloque jamais) et on avertit.
function flushQueue(){
  if (flushing || !syncQueue.length) return;
  flushing = true; inflight++; updateSync();
  var item = syncQueue[0];
  apiCall(item.fn, item.args).then(function (res) {
    syncQueue.shift(); saveQueue(); isOffline = false;
    flushing = false; inflight = Math.max(0, inflight - 1);
    var cb = queueCallbacks[item.id];
    if (cb) { delete queueCallbacks[item.id]; try { cb(res); } catch (e) {} }
    if (syncQueue.length) { updateSync(); flushQueue(); }
    else { NEEDS_PULL = true; updateSync(); if (canPull()) pull(); }
  }).catch(function (err) {
    flushing = false; inflight = Math.max(0, inflight - 1);
    item.tries = (item.tries || 0) + 1;
    if (err && err.server) {
      // Refus logique du serveur : on ne bloque pas les modifications suivantes.
      syncQueue.shift(); saveQueue(); delete queueCallbacks[item.id];
      toast('Modification refusée : ' + err.message, 'err');
      updateSync();
      if (syncQueue.length) flushQueue(); else { NEEDS_PULL = true; if (canPull()) pull(); }
      return;
    }
    if (err && err.soft && item.tries >= 8) {
      // Réponse anormale répétée (ex. déploiement mal configuré) : on abandonne cet appel.
      syncQueue.shift(); saveQueue(); delete queueCallbacks[item.id];
      toast('Une modification n\'a pas pu être envoyée (' + err.message + ')', 'err');
      updateSync();
      if (syncQueue.length) flushQueue();
      return;
    }
    // Probablement hors ligne : on garde la file, le heartbeat réessaiera.
    isOffline = true; saveQueue(); updateSync();
  });
}

// Télécharge les données complètes du serveur (seulement quand c'est sûr).
function pull(){
  if (pulling) return Promise.resolve();
  pulling = true; updateSync();
  return apiCall('getAllData', []).then(function (d) {
    isOffline = false;
    DATA = normalizeData(d);
    REV = (typeof d.rev === 'number') ? d.rev : REV;
    NEEDS_PULL = false;
    saveLocal();
    if (!editingOpen() && !typingNow()) render();
  }).catch(function () { isOffline = true; })
    .finally(function () { pulling = false; updateSync(); });
}

// Battement de cœur (10 s, app visible) :
// 1) envoyer ce qui attend ; 2) vérifier la révision serveur (ultraléger) ;
// 3) tirer les données complètes seulement si elles ont changé.
function heartbeat(){
  if (document.visibilityState !== 'visible') return;
  if (Object.keys(pendEpi).length) { flushEpi(); return; }
  if (Object.keys(pendLi).length) { flushLi(); return; }
  if (syncQueue.length) { if (!flushing) flushQueue(); return; }
  if (hbBusy || pulling) return;
  hbBusy = true;
  apiCall('getRev', []).then(function (r) {
    isOffline = false;
    if (r && typeof r.rev === 'number' && r.rev !== REV) NEEDS_PULL = true;
  }).catch(function () { isOffline = true; })
    .finally(function () {
      hbBusy = false; updateSync();
      if (NEEDS_PULL && canPull()) pull();
    });
}

// Toute modification passe par ici : file persistante + copie locale.
function call(fn, args, onDone){
  enqueue(fn, args, onDone);
  if (DATA) saveLocal();
}

function updateSync(){
  var pend = pendingCount();
  var txt = 'Synchronisé', cls = '';
  if (isOffline) { txt = pend ? ('Hors ligne · ' + pend + ' en attente') : 'Hors ligne'; cls = 'off'; }
  else if (pend || flushing || inflight > 0) { txt = 'Sync · ' + Math.max(pend, 1); cls = 'busy'; }
  else if (pulling) { txt = 'Mise à jour…'; cls = 'busy'; }
  var t = $('syncTxt'); if (t) t.textContent = txt;
  var d = $('syncDot'); if (d) { d.classList.toggle('busy', cls === 'busy'); d.classList.toggle('off', cls === 'off'); }
  var f = $('sfoot'); if (f) f.textContent = txt;
  var sd = $('sdot'); if (sd) { sd.classList.toggle('busy', cls === 'busy'); sd.classList.toggle('off', cls === 'off'); }
}

/* ---------- Coches en lot (700 ms de regroupement) ---------- */
function flushEpi(){ var ks = Object.keys(pendEpi); if (!ks.length) return; var arr = ks.map(function (k) { return { id: k, coche: pendEpi[k] }; }); pendEpi = {}; call('setEpicerieCochesBatch', [arr]); }
function queueEpi(id, val){ pendEpi[id] = val; clearTimeout(epiT); epiT = setTimeout(flushEpi, 700); updateSync(); }
function flushLi(){ var ks = Object.keys(pendLi); if (!ks.length) return; var arr = ks.map(function (k) { return { id: k, coche: pendLi[k] }; }); pendLi = {}; call('setListeItemCochesBatch', [arr]); }
function queueLi(id, val){ pendLi[id] = val; clearTimeout(liT); liT = setTimeout(flushLi, 700); updateSync(); }

/* ---------- Fusion locale de l'épicerie (miroir du serveur) ---------- */
function srcAdd(cur, add){
  add = String(add || '').trim(); if (!add) return cur || 'manuel';
  var parts = String(cur || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  if (parts.some(function (p) { return /^\d+ recettes/.test(p); })) return cur; // déjà compressé
  var hasMan = parts.indexOf('manuel') >= 0 || / \+ manuel$/.test(String(cur || ''));
  parts = parts.filter(function (p) { return p !== 'manuel' && p !== '+ manuel'; })
    .map(function (p) { return p.replace(/ \+ manuel$/, ''); });
  if (add === 'manuel') hasMan = true;
  else if (parts.indexOf(add) < 0) parts.push(add);
  if (!parts.length) return 'manuel';
  var j = parts.join(', ');

function sortEpicerieLocal(){
  var ordre = {};
  rayonsSorted().forEach(function (r) { ordre[String(r.Rayon).trim()] = num(r.Ordre); });
  function rang(ray){ return ordre.hasOwnProperty(ray) ? ordre[ray] : 999; }
  (DATA.epicerie || []).sort(function (a, b) {
    var ra = rang(String(a.Rayon)), rb = rang(String(b.Rayon));
    return ra !== rb ? ra - rb : String(a.Ingredient).localeCompare(String(b.Ingredient));
  });
}
function localMergeEpicerie(items){
  var byKey = {};
  (DATA.epicerie || []).forEach(function (e) { byKey[norm(e.Ingredient) + '|' + norm(e.Unite)] = e; });
  (items || []).forEach(function (it) {

    var unite = String(it.unite || '').trim();
    var key = norm(nom) + '|' + norm(unite);

}

/* ---------- Toast ---------- */
function toast(msg, kind){
  var t = document.createElement('div');
  t.className = 'toast' + (kind === 'err' ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function () { t.remove(); }, 300); }, kind === 'err' ? 3400 : 2200);
}

function hideSplash(){ if (splashHidden) return; splashHidden = true; var s = $('splash'); if (s) { s.classList.add('gone'); setTimeout(function () { s.remove(); }, 550); } }

/* ---------- Chargement initial ---------- */
function load(){
  var t0 = Date.now();
  loadQueue();
  var cached = loadLocal();
  if (cached) { DATA = normalizeData(cached.data); REV = cached.rev || 0; render(); }
  // 4,5 s minimum : la dernière pièce (le numéro de version) finit de
  // monter à ~3,55 s — à 3,2 s elle se faisait couper en plein geste.
  // On laisse l'animation complète, puis une respiration.
  function finish(){ var wait = Math.max(0, 4500 - (Date.now() - t0)); setTimeout(hideSplash, wait); }
  if (syncQueue.length) { finish(); updateSync(); flushQueue(); return; }
  pull().then(function () {
    finish();
    if (!DATA) {
      $('view').innerHTML = '<div class="empty">' + CREST_MINI + 'Pas de connexion et aucune donnée enregistrée.<br>Connecte-toi à Internet une première fois pour charger tes données.<br><br><button class="btn sm" onclick="location.reload()" style="margin:0 auto;width:auto">Réessayer</button></div>';
    }
  });
}

function rayBlock(ray, items){

  var h = '<div class="rayhd' + (complet ? ' done' : '') + '" data-rayhd="' + esc(ray) + '" data-rayfold="' + esc(ray) + '"><span class="raydot" style="background:' + tint[2] + '"></span><span>' + esc(ray) + '</span><span class="rayprog"><i style="width:' + pct + '%"></i></span><span class="ct">' + (complet ? '✓' : done + '/' + items.length) + '</span><span class="foldchev' + (open ? ' open' : '') + '">›</span></div>';
  h += '<div class="fold' + (open ? '' : ' closed') + '"><div>';
  items.forEach(function (it) {
    var dn = isTrue(it.Coche);

  });

}

var DRAG = null; // {type:'rec'|'day'|'ing', id, rep?}
function untrackDateLocal(iso, rep){
  DATA.epicerieRepas = (DATA.epicerieRepas || []).filter(function (t) { return !(String(t.Date) === String(iso) && repasOf(t.Repas) === rep); });

function bindDragDrop(){
  qall('[data-dragrec]').forEach(function (el) {
    el.addEventListener('dragstart', function (e) { DRAG = { type: 'rec', id: el.getAttribute('data-dragrec') }; el.classList.add('dragging'); try { e.dataTransfer.effectAllowed = 'copy'; e.dataTransfer.setData('text/plain', DRAG.id); } catch (x) {} });
    el.addEventListener('dragend', function () { el.classList.remove('dragging'); DRAG = null; qall('.dropslot').forEach(function (d) { d.classList.remove('dragover'); }); });
  });
  qall('[data-dragday]').forEach(function (el) {
    el.addEventListener('dragstart', function (e) { DRAG = { type: 'day', id: el.getAttribute('data-dragday'), rep: el.getAttribute('data-dragrep') || 'souper' }; el.classList.add('dragging'); try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', DRAG.id); } catch (x) {} });
    el.addEventListener('dragend', function () { el.classList.remove('dragging'); DRAG = null; qall('.dropslot').forEach(function (d) { d.classList.remove('dragover'); }); });
  });
  qall('.dropslot').forEach(function (el) {
    el.addEventListener('dragover', function (e) { if (DRAG && (DRAG.type === 'rec' || DRAG.type === 'day')) { e.preventDefault(); el.classList.add('dragover'); } });
    el.addEventListener('dragleave', function () { el.classList.remove('dragover'); });
    el.addEventListener('drop', function (e) {
      e.preventDefault(); el.classList.remove('dragover'); if (!DRAG) return;
      var target = el.getAttribute('data-dropday'), targetRep = el.getAttribute('data-droprep') || 'souper';
      if (DRAG.type === 'rec') {
        var ex = souperFor(target, targetRep);
        if (ex) {
          if (String(ex.RecetteID) !== String(DRAG.id)) untrackDateLocal(target, targetRep);
          ex.RecetteID = DRAG.id;
        } else DATA.soupers.push({ Date: target, RecetteID: DRAG.id, Cuisinier: '', Repas: targetRep });
        call('setSouper', [target, DRAG.id, '', targetRep]); render();
      } else if (DRAG.type === 'day') {
        var from = DRAG.id, fromRep = DRAG.rep || 'souper';
        if (from === target && fromRep === targetRep) return;
        var sFrom = souperFor(from, fromRep), sTarget = souperFor(target, targetRep);
        if (!sFrom) return;
        if (sTarget) { // échange
          var tmpR = sFrom.RecetteID, tmpC = sFrom.Cuisinier;
          sFrom.RecetteID = sTarget.RecetteID; sFrom.Cuisinier = sTarget.Cuisinier;
          sTarget.RecetteID = tmpR; sTarget.Cuisinier = tmpC;
          untrackDateLocal(from, fromRep); untrackDateLocal(target, targetRep);
          call('setSoupersBatch', [[
            { date: from, recetteId: sFrom.RecetteID, cuisinier: sFrom.Cuisinier, repas: fromRep },
            { date: target, recetteId: sTarget.RecetteID, cuisinier: sTarget.Cuisinier, repas: targetRep }
          ]]);
        } else { // déplacer vers un créneau libre
          DATA.soupers.push({ Date: target, RecetteID: sFrom.RecetteID, Cuisinier: sFrom.Cuisinier, Repas: targetRep });
          DATA.soupers = DATA.soupers.filter(function (x) { return !(x.Date === from && repasOf(x.Repas) === fromRep); });
          untrackDateLocal(from, fromRep);
          call('setSouper', [target, sFrom.RecetteID, sFrom.Cuisinier, targetRep]);
          call('retirerSouper', [from, fromRep]);
        }
        render();
      }
    });
  });
  // ingrédients entre rayons
  qall('[data-draging]').forEach(function (el) {
    el.addEventListener('dragstart', function (e) { DRAG = { type: 'ing', id: el.getAttribute('data-draging') }; el.classList.add('dragging'); try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', DRAG.id); } catch (x) {} });

  });

    el.addEventListener('dragover', function (e) { if (DRAG && DRAG.type === 'ing') { e.preventDefault(); el.classList.add('dragover'); } });
    el.addEventListener('dragleave', function () { el.classList.remove('dragover'); });
    el.addEventListener('drop', function (e) { e.preventDefault(); el.classList.remove('dragover'); if (!DRAG || DRAG.type !== 'ing') return; changeIngredientRayon(DRAG.id, el.getAttribute('data-dropray')); });
  });
}

/* ============ Autocomplete (tap iOS fiable) ============ */
function acWidget(container, placeholder, onPick, allowCreate){
  container.innerHTML = '<div class="ac"><input class="ac-inp" placeholder="' + esc(placeholder) + '" autocomplete="off"><div class="ac-list hide"></div></div>';
  var inp = container.querySelector('.ac-inp'), list = container.querySelector('.ac-list');
  var picking = false;
  function sheetOf(){ return container.closest('.sheet'); }
  function pick(nm, ray){ close(); onPick(nm, ray); }
  function refresh(){
    var q = inp.value.trim(), nq = norm(q), cat = catalogue();
    var matches = nq ? cat.filter(function (c) { return norm(c.Ingredient).indexOf(nq) >= 0; }) : cat;
    var html = '';
    matches.slice(0, 40).forEach(function (c) { html += '<div class="ac-item" data-nm="' + esc(c.Ingredient) + '" data-ray="' + esc(c.Rayon) + '"><span class="nm">' + esc(c.Ingredient) + '</span><span class="ray">' + esc(c.Rayon) + '</span></div>'; });
    var exact = cat.some(function (c) { return norm(c.Ingredient) === nq; });
    if (allowCreate && q && !exact) html += '<div class="ac-new" data-create="' + esc(q) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Créer « ' + esc(q) + ' »</div>';
    if (!html) html = '<div class="ac-item muted">Aucun résultat</div>';
    list.innerHTML = html; list.classList.remove('hide');
    var sh = sheetOf(); if (sh) sh.classList.add('tall');
    function attach(el, act){
      el.addEventListener('mousedown', function (ev) { ev.preventDefault(); picking = true; act(); });
      var sx = 0, sy = 0, moved = false;
      el.addEventListener('touchstart', function (ev) { var t = ev.touches[0]; sx = t.clientX; sy = t.clientY; moved = false; }, { passive: true });
      el.addEventListener('touchmove', function (ev) { var t = ev.touches[0]; if (Math.abs(t.clientX - sx) > 8 || Math.abs(t.clientY - sy) > 8) moved = true; }, { passive: true });
      el.addEventListener('touchend', function (ev) { if (!moved) { ev.preventDefault(); picking = true; act(); } }, { passive: false });
    }
    list.querySelectorAll('[data-nm]').forEach(function (it) {
      attach(it, function () { pick(it.getAttribute('data-nm'), it.getAttribute('data-ray')); });
    });
    var cr = list.querySelector('[data-create]');
    if (cr) {
      attach(cr, function () { var val = cr.getAttribute('data-create'); close(); promptNewIngredient(val, function (nom, ray) { onPick(nom, ray); }); });
    }
  }
  function close(){ list.classList.add('hide'); var sh = sheetOf(); if (sh) sh.classList.remove('tall'); }
  inp.onfocus = refresh; inp.oninput = refresh;
  inp.onblur = function () { setTimeout(function () { if (!picking) close(); picking = false; }, 200); };
  return inp;
}

    });

  });
  call('ajouterRecette', [{ id: id, nom: nom, portions: portions, notes: REC_NOTES, types: types, etapes: REC_STEPS, ingredients: ings }]);

/* ---------- Sélecteur d'unité ---------- */
function uniteSelectHtml(idBase, current){
  current = String(current || '').trim();
  var inList = UNITES.some(function (u) { return u.toLowerCase() === current.toLowerCase(); });
  var opts = '<option value=""' + (current === '' ? ' selected' : '') + '>—</option>';
  UNITES.forEach(function (u) { opts += '<option' + ((current !== '' && current.toLowerCase() === u.toLowerCase()) ? ' selected' : '') + '>' + esc(u) + '</option>'; });
  opts += '<option value="__custom__"' + ((current !== '' && !inList) ? ' selected' : '') + '>Autre…</option>';
  var customStyle = (current !== '' && !inList) ? '' : 'display:none';
  return '<select class="usel" id="' + idBase + '-sel">' + opts + '</select>' +
    '<input class="ucustom" id="' + idBase + '-cust" placeholder="unité" value="' + (current !== '' && !inList ? esc(current) : '') + '" style="' + customStyle + ';margin-top:6px">';
}
function uniteSelectVal(idBase){
  var sel = $(idBase + '-sel'); if (!sel) return '';
  if (sel.value === '__custom__') { var c = $(idBase + '-cust'); return c ? c.value.trim() : ''; }
  return sel.value;
}
function bindUniteSelect(idBase){
  var sel = $(idBase + '-sel'), cust = $(idBase + '-cust');
  if (!sel || !cust) return;
  sel.onchange = function () { if (sel.value === '__custom__') { cust.style.display = ''; cust.focus(); } else { cust.style.display = 'none'; } };
}

/* ============ Import Instagram ============ */
// Flux : coller le lien → le serveur tente de lire la description
// publique du reel. Si Instagram bloque, on demande de coller le texte
// (le commentaire du reel). Dans les deux cas l'API Claude structure le
// texte en brouillon, qui s'ouvre dans l'éditeur de recette pour
// révision — rien n'est enregistré avant « Enregistrer la recette ».
function openImportIG(){
  function stepHtml(i, lbl, sub){
    return '<div class="impstep" data-step="' + i + '"><span class="num">' + i + '</span><div><div class="lbl">' + lbl + '</div><div class="sub">' + sub + '</div></div></div>';
  }
  showSheet('Importer une recette',
    '<div class="psub" style="margin-bottom:14px">Colle le lien du reel Instagram. Si la recette n\'est pas lisible depuis le lien, on te demandera de coller son texte.</div>' +
    '<div class="field"><label>Lien Instagram</label><input id="ig-url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://www.instagram.com/reel/…"></div>' +
    '<div class="field hide" id="ig-manual"><label>Texte de la recette (le commentaire du reel)</label><textarea id="ig-txt" rows="7" placeholder="Colle ici le texte complet de la recette…"></textarea></div>' +
    '<div class="field"><label>Ou des captures d\'écran de la recette</label>' +
      '<input type="file" id="ig-files" accept="image/*" multiple class="hide">' +
      '<button class="btn ghost" id="ig-pick" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.4"/><path d="M8.5 5l1.2-2h4.6l1.2 2"/></svg>Ajouter des captures d\'écran</button>' +
      '<div class="ig-thumbs" id="ig-thumbs"></div>' +
      '<div class="small muted">L\'IA lit le texte directement sur l\'image — pratique quand Instagram ne laisse pas copier le commentaire.</div></div>' +
    '<button class="btn" id="ig-go">Analyser</button>' +
    '<div class="impsteps" id="ig-steps">' +
      stepHtml(1, 'Lecture du lien', '') +
      stepHtml(2, 'Structuration par l\'IA', 'nom, ingrédients, quantités, étapes') +
      stepHtml(3, 'Révision', 'la recette s\'ouvre pour vérification avant d\'être enregistrée') +
    '</div>' +
    '<div class="small muted" id="ig-hint" style="margin-top:10px;text-align:center"></div>', true);
  function setStep(i, state, sub){
    var el = document.querySelector('#ig-steps .impstep[data-step="' + i + '"]'); if (!el) return;
    el.className = 'impstep' + (state ? ' ' + state : '');
    var n = el.querySelector('.num');
    if (state === 'ok') n.innerHTML = CHK;
    else if (state === 'err') n.textContent = '!';
    else n.textContent = String(i);
    if (sub !== undefined) el.querySelector('.sub').textContent = sub;
  }
  var busy = false;
  var igImages = []; // [{b64, thumb}] — compressées côté client
  function setBtn(label, disabled){ var b = $('ig-go'); if (b) { b.disabled = !!disabled; b.textContent = label; } }
  function reset(){ busy = false; setBtn('Analyser', false); }
  // Réduit une photo à 1568 px max, JPEG — Safari décode aussi le HEIC.
  function prepImage(file){
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          try {
            var MAX = 1568, k = Math.min(1, MAX / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(img.width * k));
            c.height = Math.max(1, Math.round(img.height * k));
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            var du = c.toDataURL('image/jpeg', 0.82);
            resolve({ b64: du.split(',')[1], thumb: du });
          } catch (e) { reject(new Error('Image illisible')); }
        };
        img.onerror = function () { reject(new Error('Image illisible')); };
        img.src = fr.result;
      };
      fr.onerror = function () { reject(new Error('Lecture du fichier impossible')); };
      fr.readAsDataURL(file);
    });
  }
  function renderThumbs(){
    var c = $('ig-thumbs'); if (!c) return;
    c.innerHTML = igImages.map(function (im, i) {
      return '<div class="ig-thumb"><img src="' + im.thumb + '" alt=""><span class="rmv clk" data-igrm="' + i + '">&times;</span></div>';
    }).join('');
    c.querySelectorAll('[data-igrm]').forEach(function (el) {
      el.onclick = function () { igImages.splice(+el.getAttribute('data-igrm'), 1); renderThumbs(); };
    });
  }
  function fail(stepIdx, err){
    reset();
    var msg = String(err && err.message || err);
    if (/failed to fetch|load failed|networkerror|network request failed/i.test(msg)) {
      msg = 'Impossible de joindre le serveur — vérifie ta connexion et réessaie.';
    } else { isOffline = false; updateSync(); } // le serveur a répondu : on n'est pas hors ligne
    setStep(stepIdx, 'err', msg);
    toast(msg, 'err');
  }
  function structurer(fn, args){
    setBtn('Analyse en cours…', true);
    setStep(2, 'on', 'l\'IA lit la recette… (10 à 30 s)');
    apiCall(fn, args).then(function (res) {
      isOffline = false; updateSync();
      if (res && res.recette) {
        var nIng = (res.recette.ingredients || []).length;
        setStep(2, 'ok', nIng + ' ingrédient' + (nIng > 1 ? 's' : '') + ', ' + (res.recette.etapes || []).length + ' étape' + ((res.recette.etapes || []).length > 1 ? 's' : ''));
        setStep(3, 'ok', 'ouverture de l\'éditeur…');
        setTimeout(function () { closeSheet(); openRecette(null, res.recette); }, 550);
        return;
      }
      fail(2, new Error('Réponse inattendue du serveur'));
    }).catch(function (err) { fail(2, err); });
  }
  $('ig-pick').onclick = function () { $('ig-files').click(); };
  $('ig-files').onchange = function () {
    var files = Array.prototype.slice.call(this.files || []);
    this.value = '';
    if (!files.length) return;
    if (igImages.length + files.length > 4) { toast('Maximum 4 captures d\'écran', 'err'); files = files.slice(0, 4 - igImages.length); }
    var reste = files.length;
    files.forEach(function (f) {
      prepImage(f).then(function (im) { igImages.push(im); })
        .catch(function () { toast('Une image n\'a pas pu être lue', 'err'); })
        .finally(function () { reste--; if (!reste) renderThumbs(); });
    });
  };
  $('ig-go').onclick = function () {
    if (busy) return;
    var url = $('ig-url').value.trim(), txt = $('ig-txt').value.trim();
    if (!url && !txt && !igImages.length) { toast('Colle un lien, du texte, ou ajoute des captures d\'écran', 'err'); return; }
    // On tente TOUJOURS l'appel : le drapeau « hors ligne » de l'app peut
    // être périmé. Si le réseau est vraiment mort, fail() l'explique.
    // Deux appels courts plutôt qu'un long : Safari iOS coupe les
    // requêtes qui dépassent ~60 s.
    busy = true;
    $('ig-steps').classList.add('show');
    $('ig-hint').textContent = '';
    setStep(2, '', 'nom, ingrédients, quantités, étapes');
    setStep(3, '', 'la recette s\'ouvre pour vérification avant d\'être enregistrée');
    if (igImages.length) {
      setStep(1, 'ok', igImages.length + ' capture' + (igImages.length > 1 ? 's' : '') + ' d\'écran fournie' + (igImages.length > 1 ? 's' : ''));
      structurer('structurerRecetteImage', [igImages.map(function (im) { return { data: im.b64, mediaType: 'image/jpeg' }; }), url, txt]);
      return;
    }
    if (txt) { setStep(1, 'ok', 'texte collé à la main'); structurer('structurerRecetteTexte', [txt, url]); return; }
    setBtn('Analyse en cours…', true);
    setStep(1, 'on', 'on demande la description publique du reel…');
    apiCall('lireLienIG', [url]).then(function (res) {
      isOffline = false; updateSync();
      if (res && res.texte) { setStep(1, 'ok', 'description du reel récupérée'); structurer('structurerRecetteTexte', [res.texte, url]); return; }
      reset();
      setStep(1, 'err', 'Instagram bloque la lecture de ce lien');
      $('ig-manual').classList.remove('hide');
      $('ig-hint').textContent = 'Pas grave : prends des captures d\'écran de la recette (le commentaire, ou la recette dans la vidéo) et ajoute-les ci-dessus — ou colle son texte si tu l\'as.';
      setTimeout(function () { var t = $('ig-txt'); if (t) t.focus(); }, 60);
    }).catch(function (err) { fail(1, err); });
  };
}

  if (cont) {
    var h = '';
    if (!items.length) h += '<div class="muted small" style="margin-bottom:8px">Aucun item. Ajoute-en ci-dessous.</div>';
    items.forEach(function (it) { h += '<div class="ingrow"><div class="top"><span class="nm">' + esc(it.Ingredient) + '</span><span class="ray">' + esc(it.Rayon) + '</span><span class="small muted" style="margin-left:auto">' + esc(fmtNum(it.Quantite)) + ' ' + esc(it.Unite) + '</span><span class="rm clk" data-qrrm="' + esc(it.ItemID) + '" style="margin-left:8px">&times;</span></div></div>'; });
    cont.innerHTML = h;
  }
  var qty = $('qre-qty'); if (qty) { qty.classList.add('hide'); $('qre-q').value = ''; $('qre-u').value = ''; }
  var acInp = document.querySelector('#qre-ac .ac-inp'); if (acInp) acInp.value = '';
  var rl = $('qre-rl'); if (rl) rl.textContent = '';
  qall('[data-qrrm]').forEach(function (el) {
    el.onclick = function () {
      var iid = el.getAttribute('data-qrrm');
      DATA.listesRapidesItems = DATA.listesRapidesItems.filter(function (x) { return String(x.ItemID) !== iid; });
      call('retirerItemRapide', [iid]); refreshEditRapide(rid);
    };
  });
  render();
}

/* ============ Modal ============ */
function showSheet(title, inner, stacked){
  var id = stacked ? 'ov2' : 'ov';
  var old = $(id); if (old) old.remove();
  var o = document.createElement('div');
  o.className = 'overlay'; o.id = id;
  if (stacked) o.style.zIndex = '70';
  o.innerHTML = '<div class="sheet"><div class="grab"></div><div class="shd"><span class="t">' + esc(title) + '</span><span class="x clk">&times;</span></div>' + inner + '</div>';
  o.onclick = function (e) { if (e.target === o) o.remove(); };
  document.body.appendChild(o);
  o.querySelector('.x').onclick = function () { o.remove(); };
}
function closeSheet(){
  var o2 = $('ov2'); if (o2) { o2.remove(); return; }
  var o = $('ov'); if (o) o.remove();
}

/* ============ Init ============ */
qall('.side-item,.mobilenav .nv').forEach(function (n) { n.onclick = function () { setTab(n.getAttribute('data-tab')); }; });
$('fab').onclick = function () { if (TAB === 'recettes') openRecette(); };
$('sideNew').onclick = function () { setTab('recettes'); openRecette(); };
$('goNous').onclick = function () { setTab('nous'); };
qall('.side-item,.mobilenav .nv').forEach(function (n) { n.classList.toggle('on', n.getAttribute('data-tab') === TAB); });
setTimeout(hideSplash, 6000);

// Voile de la barre du haut : son filet n'apparaît qu'au défilement
window.addEventListener('scroll', function () {
  document.body.classList.toggle('scrolled', window.scrollY > 8);
}, { passive: true });

// Clavier mobile : garder le champ actif visible
document.addEventListener('focusin', function (e) {
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) {
    setTimeout(function () { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) { try { t.scrollIntoView(); } catch (y) {} } }, 300);
  }
});

// Avant de masquer/fermer : envoyer les coches en attente
window.addEventListener('pagehide', function () { flushEpi(); flushLi(); if (syncQueue.length) flushQueue(); });
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') { flushEpi(); flushLi(); }
  else { heartbeat(); }
});
window.addEventListener('online', function () { isOffline = false; updateSync(); flushQueue(); heartbeat(); });
window.addEventListener('offline', function () { isOffline = true; updateSync(); });

// ❤️ Battement de cœur (10 s, app visible) : envoie la file en attente,
// vérifie la révision serveur, et tire les données seulement si nécessaire.
setInterval(heartbeat, 10000);

// Service Worker (offline + mises à jour auto) — seulement en mode hébergé (GitHub Pages)
if (HOSTED && 'serviceWorker' in navigator) {
  var swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swRefreshed) return; swRefreshed = true; location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg && reg.update) { setInterval(function () { reg.update(); }, 60000); }
    }).catch(function () {});
  });
}

console.log('Lavoie & Co v' + CONFIG.VERSION + (HOSTED ? ' (hébergé)' : ' (iframe Apps Script)'));
load();
</script>
