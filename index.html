function openNousEdit(qui){
  var p = NOUS_PERS.filter(function (x) { return x.id === qui; })[0]; if (!p) return;
  var r = nousRow(qui) || {};
  var cur = String(r.Etat || '');
  var chips = nousEtats(p.f).map(function (e2) {
    return '<span class="tchip' + (cur === e2.id ? ' on' : '') + ' clk" data-netat="' + e2.id + '" style="display:block;text-align:left;margin-bottom:8px">' + esc(e2.txt) + '</span>';
  }).join('');
  showSheet(p.nom, '<label style="margin-bottom:8px">Comment tu te sens ? (touche pour choisir, retouche pour effacer)</label><div id="netats">' + chips + '</div>' +
    '<div class="field" style="margin-top:14px"><label>Un mot pour l\'autre (optionnel)</label><textarea id="nnote" rows="3" placeholder="Ce que tu voudrais dire…">' + esc(r.Note || '') + '</textarea></div>' +
    '<button class="btn" id="nsave">Afficher</button>', true);
  var sel = cur;
  qall('#netats [data-netat]').forEach(function (el) {
    el.onclick = function () {
      var id = el.getAttribute('data-netat');
      sel = (sel === id) ? '' : id;
      qall('#netats [data-netat]').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-netat') === sel); });
    };
  });
  $('nsave').onclick = function () {
    var note = $('nnote').value.trim();
    var row = nousRow(qui);
    if (row) { row.Etat = sel; row.Note = note; row.MisAJour = new Date().toISOString(); }
    else DATA.nous.push({ Qui: qui, Etat: sel, Note: note, MisAJour: new Date().toISOString() });
    call('setNous', [qui, sel, note]);
    marquerNousVu(); // on a évidemment vu son propre message
    closeSheet(); render(); toast('C\'est affiché ❤️');
  };
}

/* ============ Drag & drop (bureau) ============ */
var DRAG = null; // {type:'rec'|'day'|'ing', id, rep?}
function untrackDateLocal(iso, rep){
  DATA.epicerieRepas = (DATA.epicerieRepas || []).filter(function (t) { return !(String(t.Date) === String(iso) && repasOf(t.Repas) === rep); });
}
function bindDragDrop(){
  qall('[data-dragrec]').forEach(function (el) {
    el.addEventListener('dragstart', function (e) { DRAG = { type: 'rec', id: el.getAttribute('data-dragrec') }; el.classList.add('dragging'); try { e.dataTransfer.effectAllowed = 'copy'; e.dataTransfer.setData('text/plain', DRAG.id); } catch (x) {} });
    el.addEventListener('dragend', function () { el.classList.remove('dragging'); DRAG = null; qall('.dropslot').forEach(function (d) { d.classList.remove('dragover'); }); });
  });
  qall('[data-dragday]').forEach(function (el) {
    el.addEventListener('dragstart', function (e) { DRAG = { type: 'day', id: el.getAttribute('data-dragday'), rep: el.getAttribute('data-dragrep') || 'souper' }; el.classList.add('dragging'); try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', DRAG.id); } catch (x) {} });
    el.addEventListener('dragend', function () { el.classList.remove('dragging'); DRAG = null; qall('.dropslot').forEach(function (d) { d.classList.remove('dragover'); }); });
  });
  qall('.dropslot').forEach(function (el) {
    el.addEventListener('dragover', function (e) { if (DRAG && (DRAG.type === 'rec' || DRAG.type === 'day')) { e.preventDefault(); el.classList.add('dragover'); } });
    el.addEventListener('dragleave', function () { el.classList.remove('dragover'); });
    el.addEventListener('drop', function (e) {
      e.preventDefault(); el.classList.remove('dragover'); if (!DRAG) return;
      var target = el.getAttribute('data-dropday'), targetRep = el.getAttribute('data-droprep') || 'souper';
      if (DRAG.type === 'rec') {
        var ex = souperFor(target, targetRep);
        if (ex) {
          if (String(ex.RecetteID) !== String(DRAG.id)) untrackDateLocal(target, targetRep);
          ex.RecetteID = DRAG.id;
        } else DATA.soupers.push({ Date: target, RecetteID: DRAG.id, Cuisinier: '', Repas: targetRep });
        call('setSouper', [target, DRAG.id, '', targetRep]); render();
      } else if (DRAG.type === 'day') {
        var from = DRAG.id, fromRep = DRAG.rep || 'souper';
        if (from === target && fromRep === targetRep) return;
        var sFrom = souperFor(from, fromRep), sTarget = souperFor(target, targetRep);
        if (!sFrom) return;
        if (sTarget) { // échange
          var tmpR = sFrom.RecetteID, tmpC = sFrom.Cuisinier;
          sFrom.RecetteID = sTarget.RecetteID; sFrom.Cuisinier = sTarget.Cuisinier;
          sTarget.RecetteID = tmpR; sTarget.Cuisinier = tmpC;
          untrackDateLocal(from, fromRep); untrackDateLocal(target, targetRep);
          call('setSoupersBatch', [[
            { date: from, recetteId: sFrom.RecetteID, cuisinier: sFrom.Cuisinier, repas: fromRep },
            { date: target, recetteId: sTarget.RecetteID, cuisinier: sTarget.Cuisinier, repas: targetRep }
          ]]);
        } else { // déplacer vers un créneau libre
          DATA.soupers.push({ Date: target, RecetteID: sFrom.RecetteID, Cuisinier: sFrom.Cuisinier, Repas: targetRep });
          DATA.soupers = DATA.soupers.filter(function (x) { return !(x.Date === from && repasOf(x.Repas) === fromRep); });
          untrackDateLocal(from, fromRep);
          call('setSouper', [target, sFrom.RecetteID, sFrom.Cuisinier, targetRep]);
          call('retirerSouper', [from, fromRep]);
        }
        render();
      }
    });
  });
  // ingrédients entre rayons
  qall('[data-draging]').forEach(function (el) {
    el.addEventListener('dragstart', function (e) { DRAG = { type: 'ing', id: el.getAttribute('data-draging') }; el.classList.add('dragging'); try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', DRAG.id); } catch (x) {} });
    el.addEventListener('dragend', function () { el.classList.remove('dragging'); DRAG = null; qall('.dropray').forEach(function (d) { d.classList.remove('dragover'); }); });
  });
  qall('.dropray').forEach(function (el) {
    el.addEventListener('dragover', function (e) { if (DRAG && DRAG.type === 'ing') { e.preventDefault(); el.classList.add('dragover'); } });
    el.addEventListener('dragleave', function () { el.classList.remove('dragover'); });
    el.addEventListener('drop', function (e) { e.preventDefault(); el.classList.remove('dragover'); if (!DRAG || DRAG.type !== 'ing') return; changeIngredientRayon(DRAG.id, el.getAttribute('data-dropray')); });
  });
}

    var ids = Object.keys(MENU_SEL).filter(function (k) { return MENU_SEL[k] && k.indexOf('EPI|') !== 0 && k.indexOf('QR_') !== 0; });
    if (!ids.length) return;
    // Cette semaine : on ne remplit que les jours à venir. Avant v5.3 les
    // recettes tombaient sur les jours DÉJÀ PASSÉS (dimanche, lundi…) —
    // invisibles pour la suite et absentes de l'épicerie.
    var auj = ymd(new Date());

    var overflow = ids.length - empties.length;
    assigns.forEach(function (a) { DATA.soupers.push({ Date: a.date, RecetteID: a.recetteId, Cuisinier: '', Repas: rep }); });
    if (assigns.length) call('setSoupersBatch', [assigns]);

    // cochés dans l'Épicerie ni les listes rapides).
    ids.forEach(function (k) { delete MENU_SEL[k]; });

/* ============ Autocomplete (tap iOS fiable) ============ */
function acWidget(container, placeholder, onPick, allowCreate){
  container.innerHTML = '<div class="ac"><input class="ac-inp" placeholder="' + esc(placeholder) + '" autocomplete="off"><div class="ac-list hide"></div></div>';
  var inp = container.querySelector('.ac-inp'), list = container.querySelector('.ac-list');
  var picking = false;
  function sheetOf(){ return container.closest('.sheet'); }
  function pick(nm, ray){ close(); onPick(nm, ray); }
  function refresh(){
    var q = inp.value.trim(), nq = norm(q), cat = catalogue();
    var matches = nq ? cat.filter(function (c) { return norm(c.Ingredient).indexOf(nq) >= 0; }) : cat;
    var html = '';
    matches.slice(0, 40).forEach(function (c) { html += '<div class="ac-item" data-nm="' + esc(c.Ingredient) + '" data-ray="' + esc(c.Rayon) + '"><span class="nm">' + esc(c.Ingredient) + '</span><span class="ray">' + esc(c.Rayon) + '</span></div>'; });
    var exact = cat.some(function (c) { return norm(c.Ingredient) === nq; });
    if (allowCreate && q && !exact) html += '<div class="ac-new" data-create="' + esc(q) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Créer « ' + esc(q) + ' »</div>';
    if (!html) html = '<div class="ac-item muted">Aucun résultat</div>';
    list.innerHTML = html; list.classList.remove('hide');
    var sh = sheetOf(); if (sh) sh.classList.add('tall');
    function attach(el, act){
      el.addEventListener('mousedown', function (ev) { ev.preventDefault(); picking = true; act(); });
      var sx = 0, sy = 0, moved = false;
      el.addEventListener('touchstart', function (ev) { var t = ev.touches[0]; sx = t.clientX; sy = t.clientY; moved = false; }, { passive: true });
      el.addEventListener('touchmove', function (ev) { var t = ev.touches[0]; if (Math.abs(t.clientX - sx) > 8 || Math.abs(t.clientY - sy) > 8) moved = true; }, { passive: true });
      el.addEventListener('touchend', function (ev) { if (!moved) { ev.preventDefault(); picking = true; act(); } }, { passive: false });
    }
    list.querySelectorAll('[data-nm]').forEach(function (it) {
      attach(it, function () { pick(it.getAttribute('data-nm'), it.getAttribute('data-ray')); });
    });
    var cr = list.querySelector('[data-create]');
    if (cr) {
      attach(cr, function () { var val = cr.getAttribute('data-create'); close(); promptNewIngredient(val, function (nom, ray) { onPick(nom, ray); }); });
    }
  }
  function close(){ list.classList.add('hide'); var sh = sheetOf(); if (sh) sh.classList.remove('tall'); }
  inp.onfocus = refresh; inp.oninput = refresh;
  inp.onblur = function () { setTimeout(function () { if (!picking) close(); picking = false; }, 200); };
  return inp;
}

  call('ajouterRecette', [{ id: id, nom: nom, portions: portions, notes: REC_NOTES, types: types, etapes: REC_STEPS, ingredients: ings }]);

}

function uniteSelectHtml(idBase, current){
  current = String(current || '').trim();
  var inList = UNITES.some(function (u) { return u.toLowerCase() === current.toLowerCase(); });
  var opts = '<option value=""' + (current === '' ? ' selected' : '') + '>—</option>';

}
function uniteSelectVal(idBase){

function bindUniteSelect(idBase){

/* ============ Import d'Internet ============ */
// Flux : coller N'IMPORTE QUEL lien → le serveur tente de lire la
// recette sur la page (lireLienWeb ; les reels Instagram passent par
// lireLienIG). Si le site bloque, on demande de coller le texte ou des
// captures d'écran. Dans tous les cas l'API Claude structure le texte
// en brouillon, qui s'ouvre dans l'éditeur de recette pour révision —
// rien n'est enregistré avant « Enregistrer la recette ».
// Le navigateur ne peut PAS lire les autres sites lui-même (CORS) :
// la lecture du lien vit forcément côté Apps Script.
function openImportIG(){
  function stepHtml(i, lbl, sub){
    return '<div class="impstep" data-step="' + i + '"><span class="num">' + i + '</span><div><div class="lbl">' + lbl + '</div><div class="sub">' + sub + '</div></div></div>';
  }
  showSheet('Importer une recette',
    '<div class="psub" style="margin-bottom:14px">Colle n\'importe quel lien de recette — site web, blogue, reel Instagram. Si la recette n\'est pas lisible depuis le lien, on te demandera de coller son texte.</div>' +
    '<div class="field"><label>Lien de la recette</label><input id="ig-url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://…"></div>' +
    '<div class="field hide" id="ig-manual"><label>Texte de la recette (le commentaire du reel)</label><textarea id="ig-txt" rows="7" placeholder="Colle ici le texte complet de la recette…"></textarea></div>' +
    '<div class="field"><label>Ou des captures d\'écran de la recette</label>' +
      '<input type="file" id="ig-files" accept="image/*" multiple class="hide">' +
      '<button class="btn ghost" id="ig-pick" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.4"/><path d="M8.5 5l1.2-2h4.6l1.2 2"/></svg>Ajouter des captures d\'écran</button>' +
      '<div class="ig-thumbs" id="ig-thumbs"></div>' +
      '<div class="small muted">L\'IA lit le texte directement sur l\'image — pratique quand le site ne laisse pas copier la recette.</div></div>' +
    '<button class="btn" id="ig-go">Analyser</button>' +
    '<div class="impsteps" id="ig-steps">' +
      stepHtml(1, 'Lecture du lien', '') +
      stepHtml(2, 'Structuration par l\'IA', 'nom, ingrédients, quantités, étapes') +
      stepHtml(3, 'Révision', 'la recette s\'ouvre pour vérification avant d\'être enregistrée') +
    '</div>' +
    '<div class="small muted" id="ig-hint" style="margin-top:10px;text-align:center"></div>', true);
  function setStep(i, state, sub){
    var el = document.querySelector('#ig-steps .impstep[data-step="' + i + '"]'); if (!el) return;
    el.className = 'impstep' + (state ? ' ' + state : '');
    var n = el.querySelector('.num');
    if (state === 'ok') n.innerHTML = CHK;
    else if (state === 'err') n.textContent = '!';
    else n.textContent = String(i);
    if (sub !== undefined) el.querySelector('.sub').textContent = sub;
  }
  var busy = false;
  var igImages = []; // [{b64, thumb}] — compressées côté client
  function setBtn(label, disabled){ var b = $('ig-go'); if (b) { b.disabled = !!disabled; b.textContent = label; } }
  function reset(){ busy = false; setBtn('Analyser', false); }
  // Réduit une photo à 1568 px max, JPEG — Safari décode aussi le HEIC.
  function prepImage(file){
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          try {
            var MAX = 1568, k = Math.min(1, MAX / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(img.width * k));
            c.height = Math.max(1, Math.round(img.height * k));
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            var du = c.toDataURL('image/jpeg', 0.82);
            resolve({ b64: du.split(',')[1], thumb: du });
          } catch (e) { reject(new Error('Image illisible')); }
        };
        img.onerror = function () { reject(new Error('Image illisible')); };
        img.src = fr.result;
      };
      fr.onerror = function () { reject(new Error('Lecture du fichier impossible')); };
      fr.readAsDataURL(file);
    });
  }
  function renderThumbs(){
    var c = $('ig-thumbs'); if (!c) return;
    c.innerHTML = igImages.map(function (im, i) {
      return '<div class="ig-thumb"><img src="' + im.thumb + '" alt=""><span class="rmv clk" data-igrm="' + i + '">&times;</span></div>';
    }).join('');
    c.querySelectorAll('[data-igrm]').forEach(function (el) {
      el.onclick = function () { igImages.splice(+el.getAttribute('data-igrm'), 1); renderThumbs(); };
    });
  }
  function fail(stepIdx, err){
    reset();
    var msg = String(err && err.message || err);
    if (/failed to fetch|load failed|networkerror|network request failed/i.test(msg)) {
      msg = 'Impossible de joindre le serveur — vérifie ta connexion et réessaie.';
    } else { isOffline = false; updateSync(); } // le serveur a répondu : on n'est pas hors ligne
    setStep(stepIdx, 'err', msg);
    toast(msg, 'err');
  }
  function structurer(fn, args){
    setBtn('Analyse en cours…', true);
    setStep(2, 'on', 'l\'IA lit la recette… (10 à 30 s)');
    apiCall(fn, args).then(function (res) {
      isOffline = false; updateSync();
      if (res && res.recette) {
        var nIng = (res.recette.ingredients || []).length;
        setStep(2, 'ok', nIng + ' ingrédient' + (nIng > 1 ? 's' : '') + ', ' + (res.recette.etapes || []).length + ' étape' + ((res.recette.etapes || []).length > 1 ? 's' : ''));
        setStep(3, 'ok', 'ouverture de l\'éditeur…');
        setTimeout(function () { closeSheet(); openRecette(null, res.recette); }, 550);
        return;
      }
      fail(2, new Error('Réponse inattendue du serveur'));
    }).catch(function (err) { fail(2, err); });
  }
  $('ig-pick').onclick = function () { $('ig-files').click(); };
  $('ig-files').onchange = function () {
    var files = Array.prototype.slice.call(this.files || []);
    this.value = '';
    if (!files.length) return;
    if (igImages.length + files.length > 4) { toast('Maximum 4 captures d\'écran', 'err'); files = files.slice(0, 4 - igImages.length); }
    var reste = files.length;
    files.forEach(function (f) {
      prepImage(f).then(function (im) { igImages.push(im); })
        .catch(function () { toast('Une image n\'a pas pu être lue', 'err'); })
        .finally(function () { reste--; if (!reste) renderThumbs(); });
    });
  };
  $('ig-go').onclick = function () {
    if (busy) return;
    var url = $('ig-url').value.trim(), txt = $('ig-txt').value.trim();
    if (!url && !txt && !igImages.length) { toast('Colle un lien, du texte, ou ajoute des captures d\'écran', 'err'); return; }
    // On tente TOUJOURS l'appel : le drapeau « hors ligne » de l'app peut
    // être périmé. Si le réseau est vraiment mort, fail() l'explique.
    // Deux appels courts plutôt qu'un long : Safari iOS coupe les
    // requêtes qui dépassent ~60 s.
    busy = true;
    $('ig-steps').classList.add('show');
    $('ig-hint').textContent = '';
    setStep(2, '', 'nom, ingrédients, quantités, étapes');
    setStep(3, '', 'la recette s\'ouvre pour vérification avant d\'être enregistrée');
    if (igImages.length) {
      setStep(1, 'ok', igImages.length + ' capture' + (igImages.length > 1 ? 's' : '') + ' d\'écran fournie' + (igImages.length > 1 ? 's' : ''));
      structurer('structurerRecetteImage', [igImages.map(function (im) { return { data: im.b64, mediaType: 'image/jpeg' }; }), url, txt]);
      return;
    }
    if (txt) { setStep(1, 'ok', 'texte collé à la main'); structurer('structurerRecetteTexte', [txt, url]); return; }
    setBtn('Analyse en cours…', true);
    var estIG = /instagram\.com/i.test(url);
    setStep(1, 'on', estIG ? 'on demande la description publique du reel…' : 'on va lire la page…');
    function lectureRatee(){
      reset();
      setStep(1, 'err', 'Ce lien ne se laisse pas lire automatiquement');
      $('ig-manual').classList.remove('hide');
      $('ig-hint').textContent = 'Pas grave : prends des captures d\'écran de la recette et ajoute-les ci-dessus — ou colle son texte si tu l\'as.';
      setTimeout(function () { var t = $('ig-txt'); if (t) t.focus(); }, 60);
    }
    // Cascade : lireLienWeb (page web générique) puis lireLienIG en
    // secours. « Fonction inconnue » = serveur pas encore à jour : on
    // passe à la suivante au lieu d'afficher une erreur.
    function tenterLecture(fns){
      var fn = fns.shift();
      apiCall(fn, [url]).then(function (res) {
        isOffline = false; updateSync();
        if (res && res.texte) { setStep(1, 'ok', 'recette récupérée du lien'); structurer('structurerRecetteTexte', [res.texte, url]); return; }
        if (fns.length) { tenterLecture(fns); return; }
        lectureRatee();
      }).catch(function (err) {
        if (err && err.server && fns.length) { tenterLecture(fns); return; }
        fail(1, err);
      });
    }
    tenterLecture(estIG ? ['lireLienIG'] : ['lireLienWeb', 'lireLienIG']);
  };
}

/* ============ Exporter la liste d'épicerie ============ */
// Trois sorties : un PDF « liste de kitting » (comme en usine : n° de
// kit, zones, codes, cases à cocher, signatures), le texte à partager
// (texto, courriel, Notes) ou à copier.
function epicerieParRayon(avecCoches){
  var e = (DATA.epicerie || []).filter(function (i) { return avecCoches || !isTrue(i.Coche); });
  var ordre = rayonsSorted().map(function (r) { return String(r.Rayon); }), byR = {}, vus = {}, out = [];
  e.forEach(function (it) { var r = String(it.Rayon || '').trim() || 'Autres'; (byR[r] = byR[r] || []).push(it); });
  ordre.forEach(function (r) { if (byR[r]) { vus[r] = 1; out.push({ ray: r, items: byR[r] }); } });
  Object.keys(byR).forEach(function (r) { if (!vus[r]) out.push({ ray: r, items: byR[r] }); });
  return out;
}
function qteTexte(it){
  var n = num(it.Quantite), u = plurUnite(it.Quantite, it.Unite);
  return (n ? fmtNum(it.Quantite) : '') + (u ? (n ? ' ' : '') + u : '');
}
function dateLongue(d){ return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS_L[d.getMonth()] + ' ' + d.getFullYear(); }
function listeTexte(avecCoches){
  var grp = epicerieParRayon(avecCoches), n = 0;
  grp.forEach(function (g) { n += g.items.length; });
  var L = ['Épicerie — ' + dateLongue(new Date()), n + ' article' + (n > 1 ? 's' : ''), ''];
  grp.forEach(function (g) {
    L.push(g.ray.toUpperCase());
    g.items.forEach(function (it) { var q = qteTexte(it); L.push((isTrue(it.Coche) ? '☑ ' : '☐ ') + it.Ingredient + (q ? ' — ' + q : '')); });
    L.push('');
  });
  return L.join('\n').trim();
}
// Code de zone : initiales du rayon (Fruits et légumes → FL, Viandes → VI).
function codeZone(ray){
  var mots = norm(ray).replace(/[^a-z0-9 ]/g, ' ').split(' ').filter(function (m) { return m && ['et', 'de', 'des', 'du', 'la', 'le', 'les', 'l', 'd', 'a'].indexOf(m) < 0; });
  if (!mots.length) return 'ZZ';
  return (mots.length > 1 ? mots[0].charAt(0) + mots[1].charAt(0) : mots[0].slice(0, 2)).toUpperCase();
}
function copierTexte(txt, repli){
  function secours(){
    if (!repli) { toast('Copie impossible ici', 'err'); return; }
    var r = document.createRange(); r.selectNodeContents(repli);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    toast(ok ? 'Liste copiée' : 'Texte sélectionné : copie-le', ok ? '' : 'err');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('Liste copiée'); }, secours);
  else secours();
}
function openExport(){
  var e = DATA.epicerie || [];

  var avec = !reste; // tout est coché : on exporte quand même la liste complète

function exporterPdf(avec){
  var d = new Date();
  var octets = kittingPdf(avec, d);
  var nom = 'Lavoie-Co_Kitting_' + ymd(d) + '.pdf';
  var blob = new Blob([octets], { type: 'application/pdf' });
  var fichier = null; try { fichier = new File([blob], nom, { type: 'application/pdf' }); } catch (e) {}
  // Téléphone : la feuille de partage (Enregistrer dans Fichiers, Imprimer,
  // Courriel, Messages…). Ordinateur : téléchargement direct.
  var tactile = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  if (tactile && fichier && navigator.canShare && navigator.canShare({ files: [fichier] })) {
    navigator.share({ files: [fichier], title: 'Liste de kitting — épicerie' }).catch(function (err) { if (!err || err.name !== 'AbortError') telechargerBlob(blob, nom); });
    return;
  }
  telechargerBlob(blob, nom);
}
function telechargerBlob(blob, nom){
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nom; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 8000);
  toast('PDF prêt : ' + nom);
}

// l'écran de chargement (les courbes Q deviennent des C).
PdfDoc.prototype.branche = function (ox, oy, s, coul) {

    'M92 29 Q86 15 98 10 Q101 22 92 29', 'M118 24 Q115 37 128 39 Q127 28 118 24', 'M142 18 Q138 6 148 3 Q150 13 142 18'];
  var X = function (x) { return (ox + x * s).toFixed(2); }, Y = function (y) { return (oy - y * s).toFixed(2); };
  var o = 'q ' + pdfRgb(coul) + ' RG ' + (1.4 * s).toFixed(2) + ' w 1 J 1 j ';
  chemins.forEach(function (d) {
    var t = d.match(/[MCQ]|-?\d+(?:\.\d+)?/g), i = 0, cx = 0, cy = 0, cmd = '';

      if (cmd === 'M') { cx = +t[i++]; cy = +t[i++]; o += X(cx) + ' ' + Y(cy) + ' m '; }
      else if (cmd === 'C') { var a = t.slice(i, i + 6).map(Number); i += 6; o += X(a[0]) + ' ' + Y(a[1]) + ' ' + X(a[2]) + ' ' + Y(a[3]) + ' ' + X(a[4]) + ' ' + Y(a[5]) + ' c '; cx = a[4]; cy = a[5]; }

// La liste de kitting : en-tête avec logo et fiche du kit, signatures,
// tableau par zone (une zone = un rayon, dans l'ordre du magasin), codes
// d'article, cases « prélevé », contrôle final et pied de page numéroté.
function kittingPdf(avec, d){
  var INK = '#141414', GRIS = '#8D8B86', GRIS2 = '#4A4A48', FILET = '#E2DED7', SABLE = '#B39570', NOIR = '#1C1C1C', ZEBRE = '#FAF9F6';
  var M = 40, D = 572, BAS = 64;
  var grp = epicerieParRayon(avec), nbL = 0, nbC = 0;
  grp.forEach(function (g) { nbL += g.items.length; g.items.forEach(function (it) { if (isTrue(it.Coche)) nbC++; }); });
  var noKit = 'KIT-' + ymd(d).slice(2).replace(/-/g, '') + '-' + pad(d.getHours()) + pad(d.getMinutes());
  var doc = new PdfDoc(), y = 0;
  var COL = { box: M + 5, no: M + 22, code: M + 44, art: M + 92, qte: M + 358, un: M + 366, src: M + 420 };

  function logo(x, yb, grand){
    var t = grand ? 17 : 11, cs = grand ? 4.2 : 2.6;
    var w1 = doc.texte(x, yb, 'LAVOIE', 'T', t, INK, { cs: cs });
    var w2 = doc.texte(x + w1 + cs * 2.2, yb, '&', 'TI', t * 1.08, SABLE);
    doc.texte(x + w1 + cs * 2.2 + w2 + cs * 2.2, yb, 'CO', 'T', t, INK, { cs: cs });
  }
  function enteteTableau(){
    doc.rect(M, y - 18, D - M, 18, NOIR);
    var o = { cs: .9 }, yt = y - 12;
    doc.texte(COL.box - 1, yt, 'OK', 'HB', 6.5, '#FFFFFF', o);
    doc.texte(COL.no, yt, 'N°', 'HB', 6.5, '#FFFFFF', o);
    doc.texte(COL.code, yt, 'CODE', 'HB', 6.5, '#FFFFFF', o);
    doc.texte(COL.art, yt, 'ARTICLE', 'HB', 6.5, '#FFFFFF', o);
    doc.texte(COL.qte, yt, 'QTÉ', 'HB', 6.5, '#FFFFFF', { cs: .9, align: 'droite' });
    doc.texte(COL.un, yt, 'UNITÉ', 'HB', 6.5, '#FFFFFF', o);
    doc.texte(COL.src, yt, 'PROVENANCE', 'HB', 6.5, '#FFFFFF', o);
    y -= 18;
  }
  function nouvellePage(suite){
    doc.page();
    y = 752;
    if (!suite) return;
    logo(M, y - 10, false);
    doc.texte(D, y - 10, 'LISTE DE KITTING · ' + noKit + ' (suite)', 'HB', 8, GRIS2, { cs: .8, align: 'droite' });
    doc.ligne(M, y - 20, D, y - 20, INK, 1);
    y -= 34;
    enteteTableau();
  }
  function place(h){ if (y - h < BAS) nouvellePage(true); }

  // ---- Page 1 : en-tête ----
  nouvellePage(false);
  logo(M, 730, true);
  doc.branche(M + 2, 722, .62, SABLE);
  doc.texte(M, 676, 'CUISINE & PLANIFICATION FAMILIALES', 'H', 6.5, GRIS, { cs: 1.3 });
  doc.texte(D, 731, 'LISTE DE KITTING', 'HB', 18, INK, { cs: 1.4, align: 'droite' });
  doc.texte(D, 716, 'Épicerie · approvisionnement du foyer', 'H', 9, GRIS, { align: 'droite' });
  // Fiche du kit : 2 × 2 cases
  var fx = D - 250, fw = 125, fh = 24, fy = 700;
  [['N° DE KIT', noKit], ['DATE', d.getDate() + ' ' + MOIS_L[d.getMonth()] + ' ' + d.getFullYear()],
   ['LIGNES', nbL + (nbC ? ' (' + nbC + ' déjà prélevée' + (nbC > 1 ? 's' : '') + ')' : '')], ['ZONES', String(grp.length)]].forEach(function (c, i) {
    var cx = fx + (i % 2) * fw, cy = fy - Math.floor(i / 2) * fh;
    doc.rect(cx, cy - fh, fw, fh, null, FILET, .6);
    doc.texte(cx + 7, cy - 9, c[0], 'HB', 5.8, GRIS, { cs: .9 });
    doc.texte(cx + 7, cy - 19.5, pdfCouper(c[1], 'HB', 8.6, fw - 12), 'HB', 8.6, INK);
  });
  doc.ligne(M, 640, D, 640, INK, 1.4);
  doc.ligne(M, 637.2, D, 637.2, SABLE, .6);
  // Signatures
  var sw = (D - M) / 4;
  ['PRÉPARÉ PAR', 'VÉRIFIÉ PAR', 'DÉBUT', 'FIN'].forEach(function (lbl, i) {
    var sx = M + i * sw;
    doc.texte(sx, 620, lbl, 'HB', 6, GRIS, { cs: .9 });
    doc.ligne(sx + pdfLargeur(lbl, 'HB', 6, .9) + 6, 619, sx + sw - 14, 619, '#BDB8AF', .6);
  });
  y = 600;
  enteteTableau();

  // ---- Tableau par zone ----
  var ligneNo = 0;
  if (!grp.length) {
    doc.texte((M + D) / 2, y - 40, 'Aucun article à préparer.', 'TI', 13, GRIS, { align: 'centre' });
    y -= 60;
  }
  grp.forEach(function (g, zi) {
    place(20 + 17);
    var tint = rayonTint(g.ray), code = codeZone(g.ray);
    doc.rect(M, y - 20, D - M, 20, tint[0]);
    doc.rond(M + 9, y - 10, 3.2, tint[2]);
    doc.texte(M + 18, y - 13.2, 'ZONE ' + (zi + 1) + ' · ' + g.ray.toUpperCase(), 'HB', 7.8, INK, { cs: .9 });
    doc.texte(D - 8, y - 13.2, code + ' · ' + g.items.length + ' ligne' + (g.items.length > 1 ? 's' : ''), 'H', 7.4, GRIS2, { align: 'droite' });
    y -= 20;
    g.items.forEach(function (it, ii) {
      place(17);
      ligneNo++;
      var fait = isTrue(it.Coche), h = 17, yb = y - 11.6;
      if (ii % 2) doc.rect(M, y - h, D - M, h, ZEBRE);
      doc.rect(COL.box, y - 12.8, 8.6, 8.6, null, fait ? SABLE : GRIS2, .8);
      if (fait) doc.ops.push('q ' + pdfRgb(SABLE) + ' RG 1.2 w 1 J 1 j ' + (COL.box + 1.8).toFixed(2) + ' ' + (y - 8.6).toFixed(2) + ' m ' + (COL.box + 3.7).toFixed(2) + ' ' + (y - 10.9).toFixed(2) + ' l ' + (COL.box + 7.2).toFixed(2) + ' ' + (y - 5.6).toFixed(2) + ' l S Q');
      var tc = fait ? GRIS : INK;
      doc.texte(COL.no, yb, pad(ligneNo), 'C', 7.8, GRIS);
      doc.texte(COL.code, yb, code + '-' + pad(ii + 1), 'C', 7.8, fait ? GRIS : GRIS2);
      doc.texte(COL.art, yb, pdfCouper(it.Ingredient, 'H', 9.2, COL.qte - COL.art - 34), 'H', 9.2, tc);
      var n = num(it.Quantite);
      if (n) doc.texte(COL.qte, yb, fmtNum(it.Quantite), 'HB', 9.2, tc, { align: 'droite' });
      doc.texte(COL.un, yb, pdfCouper(plurUnite(it.Quantite, it.Unite), 'H', 8, COL.src - COL.un - 6), 'H', 8, fait ? GRIS : GRIS2);
      var src = String(it.Source || '').trim(), srcTxt = !src || src.toLowerCase() === 'manuel' ? 'Ajout manuel' : src;
      doc.texte(COL.src, yb, pdfCouper(srcTxt, 'H', 7.2, D - COL.src - 4), 'H', 7.2, GRIS);
      doc.ligne(M, y - h, D, y - h, FILET, .5);
      y -= h;
    });
    y -= 6;
  });

  // ---- Contrôle final ----
  place(84);
  y -= 10;
  doc.rect(M, y - 66, D - M, 66, null, INK, .8);
  doc.texte(M + 12, y - 16, 'CONTRÔLE DU KIT', 'HB', 7.5, INK, { cs: 1 });
  doc.texte(D - 12, y - 16, 'Total : ' + nbL + ' ligne' + (nbL > 1 ? 's' : '') + ' · ' + grp.length + ' zone' + (grp.length > 1 ? 's' : ''), 'H', 8, GRIS2, { align: 'droite' });
  var cw = (D - M - 24) / 3;
  ['Prélevées', 'Manquantes', 'Signature'].forEach(function (lbl, i) {
    var cx = M + 12 + i * cw;
    doc.texte(cx, y - 44, lbl, 'H', 8, GRIS2);
    doc.ligne(cx + pdfLargeur(lbl, 'H', 8) + 6, y - 45, cx + cw - 12, y - 45, '#BDB8AF', .6);
  });
  doc.texte(M + 12, y - 58, 'Cocher chaque ligne au prélèvement. Toute rupture : noter la ligne et la remplacer au besoin.', 'TI', 7.6, GRIS);
  y -= 66;

  // ---- Pieds de page (numérotés une fois le total connu) ----
  var total = doc.pages.length, quand = pad(d.getHours()) + ' h ' + pad(d.getMinutes());
  doc.pages.forEach(function (ops, i) {
    doc.ops = ops;
    doc.ligne(M, 44, D, 44, FILET, .6);
    doc.texte(M, 32, 'Lavoie & Co · Liste de kitting ' + noKit, 'H', 7, GRIS);
    doc.texte((M + D) / 2, 32, 'Généré le ' + dateLongue(d) + ' à ' + quand, 'H', 7, GRIS, { align: 'centre' });
    doc.texte(D, 32, 'Page ' + (i + 1) + ' / ' + total, 'HB', 7, GRIS2, { align: 'droite' });
  });
  // (Le titre du fichier est en PDFDocEncoding : pas de tiret long.)
  return doc.octets('Liste de kitting ' + noKit + ' - Lavoie & Co');
}

  var mInp = acWidget($('mAc'), 'Chercher ou créer un ingrédient…', function (nom, ray) {
    picked.nom = nom; picked.ray = ray;
    $('mNom').textContent = nom; $('mRay').textContent = 'Rayon : ' + ray;
    $('mPicked').classList.remove('hide');
    bindUniteSelect('mu');
    setTimeout(function () { var f = $('mQty'); if (f) f.focus(); }, 60);
  }, true);
  $('mSave').onclick = function () {
    if (!picked.nom) { toast('Choisis d\'abord un ingrédient', 'err'); return; }
    var q = $('mQty').value.replace(',', '.') || 1, u = uniteSelectVal('mu'); // vide = 1
    // Le MÊME id à l'écran et au serveur (avant v5.3, la ligne locale
    // prenait un autre id : cochée avant la réponse, la coche se perdait).
    var id = cid('E');
    localMergeEpicerie([{ ingredient: picked.nom, quantite: num(q), unite: u, rayon: picked.ray, source: 'manuel', prefId: id }]);
    call('ajouterItemEpicerie', [id, picked.nom, q, u, picked.ray]);
    closeSheet(); render(); toast('« ' + picked.nom + ' » ajouté à la liste');
  };
  $('mQty').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); $('mSave').click(); } };
  // Le clavier s'ouvre tout de suite (focus dans le même geste que le
  // tap, qu'iOS accepte) : on tape le nom, on choisit, c'est ajouté.
  mInp.focus();
}

/* ============ Listes rapides : créer / modifier ============ */
function openAddRapide(){
  showSheet('Nouvelle liste rapide', '<div class="field"><label>Nom de la liste</label><input id="qr-nom" placeholder="Ex. Déjeuner, Collations, Produits ménagers…"></div><button class="btn" id="qr-save">Créer la liste</button>', true);
  $('qr-save').onclick = function () {
    var n = $('qr-nom').value.trim(); if (!n) { toast('Donne un nom à la liste', 'err'); $('qr-nom').focus(); return; }
    var id = cid('QR');
    DATA.listesRapides.push({ RapideID: id, Nom: n });
    call('creerListeRapide', [id, n]);
    closeSheet(); render();
    setTimeout(function () { openEditRapide(id); }, 120);
  };
}
function openEditRapide(rid){
  function body(){
    var l = (DATA.listesRapides || []).filter(function (x) { return String(x.RapideID) === String(rid); })[0];
    var items = (DATA.listesRapidesItems || []).filter(function (i) { return String(i.RapideID) === String(rid); });
    var h = '<div class="field"><label>Nom de la liste</label><input id="qre-nom" value="' + esc(l ? l.Nom : '') + '"></div>';
    h += '<label>Items de la liste</label><div id="qre-items">';
    if (!items.length) h += '<div class="muted small" style="margin-bottom:8px">Aucun item. Ajoute-en ci-dessous.</div>';
    items.forEach(function (it) { h += '<div class="ingrow"><div class="top"><span class="nm">' + esc(it.Ingredient) + '</span><span class="ray">' + esc(it.Rayon) + '</span><span class="small muted" style="margin-left:auto">' + esc(fmtNum(it.Quantite)) + ' ' + esc(it.Unite) + '</span><span class="rm clk" data-qrrm="' + esc(it.ItemID) + '" style="margin-left:8px">&times;</span></div></div>'; });
    h += '</div><label style="margin-top:6px">Ajouter un item</label><div id="qre-ac"></div><div id="qre-rl" class="small muted" style="margin-top:6px"></div><div id="qre-qty" class="hide" style="display:flex;gap:8px;margin-top:8px;align-items:center"><input id="qre-q" inputmode="decimal" placeholder="Qté" style="flex:.7"><select id="qre-u" style="flex:1.3">' + (['<option value="">—</option>'].concat(UNITES.map(function (u) { return '<option>' + esc(u) + '</option>'; })).join('')) + '</select><button class="btn sm" id="qre-add" style="white-space:nowrap">Ajouter</button></div>';
    h += '<button class="btn danger" id="qre-del" style="margin-top:16px">Supprimer cette liste</button>';
    return h;
  }
  showSheet('Modifier la liste rapide', body(), true);
  rebindEditRapide(rid);
}
function rebindEditRapide(rid){
  var nomInp = $('qre-nom');
  if (nomInp) nomInp.onchange = function () {
    var n = nomInp.value.trim(); if (!n) return;
    var l = (DATA.listesRapides || []).filter(function (x) { return String(x.RapideID) === String(rid); })[0];
    if (l) l.Nom = n;
    call('renommerListeRapide', [rid, n]);
  };
  qall('[data-qrrm]').forEach(function (el) {
    el.onclick = function () {
      var iid = el.getAttribute('data-qrrm');
      DATA.listesRapidesItems = DATA.listesRapidesItems.filter(function (x) { return String(x.ItemID) !== iid; });
      call('retirerItemRapide', [iid]); refreshEditRapide(rid);
    };
  });
  var picked = { nom: '', ray: '' };
  acWidget($('qre-ac'), 'Chercher ou créer un ingrédient…', function (nom, ray) {
    picked.nom = nom; picked.ray = ray;
    var inp = document.querySelector('#qre-ac .ac-inp'); if (inp) inp.value = nom;
    $('qre-qty').classList.remove('hide');
    var rl = $('qre-rl'); if (rl) rl.textContent = 'Rayon : ' + ray;
    setTimeout(function () { var f = $('qre-q'); if (f) f.focus(); }, 50);
  }, true);
  var addB = $('qre-add');
  if (addB) addB.onclick = function () {
    if (!picked.nom) { toast('Choisis un ingrédient'); return; }
    var q = $('qre-q').value.replace(',', '.') || 1, u = $('qre-u').value;
    var iid = cid('QI');
    DATA.listesRapidesItems.push({ ItemID: iid, RapideID: rid, Ingredient: picked.nom, Quantite: fmtNum(q), Unite: u, Rayon: picked.ray });
    call('ajouterItemRapide', [iid, rid, picked.nom, q, u, picked.ray]);
    picked.nom = '';
    refreshEditRapide(rid);
  };
  var delB = $('qre-del');
  if (delB) delB.onclick = function () {
    if (!confirm('Supprimer cette liste rapide ?')) return;
    DATA.listesRapides = DATA.listesRapides.filter(function (x) { return String(x.RapideID) !== String(rid); });
    DATA.listesRapidesItems = DATA.listesRapidesItems.filter(function (x) { return String(x.RapideID) !== String(rid); });
    call('supprimerListeRapide', [rid]);
    closeSheet(); render();
  };
}
function refreshEditRapide(rid){
  var items = (DATA.listesRapidesItems || []).filter(function (i) { return String(i.RapideID) === String(rid); });
  var cont = $('qre-items');
  if (cont) {
    var h = '';
    if (!items.length) h += '<div class="muted small" style="margin-bottom:8px">Aucun item. Ajoute-en ci-dessous.</div>';
    items.forEach(function (it) { h += '<div class="ingrow"><div class="top"><span class="nm">' + esc(it.Ingredient) + '</span><span class="ray">' + esc(it.Rayon) + '</span><span class="small muted" style="margin-left:auto">' + esc(fmtNum(it.Quantite)) + ' ' + esc(it.Unite) + '</span><span class="rm clk" data-qrrm="' + esc(it.ItemID) + '" style="margin-left:8px">&times;</span></div></div>'; });
    cont.innerHTML = h;
  }
  var qty = $('qre-qty'); if (qty) { qty.classList.add('hide'); $('qre-q').value = ''; $('qre-u').value = ''; }
  var acInp = document.querySelector('#qre-ac .ac-inp'); if (acInp) acInp.value = '';
  var rl = $('qre-rl'); if (rl) rl.textContent = '';
  qall('[data-qrrm]').forEach(function (el) {
    el.onclick = function () {
      var iid = el.getAttribute('data-qrrm');
      DATA.listesRapidesItems = DATA.listesRapidesItems.filter(function (x) { return String(x.ItemID) !== iid; });
      call('retirerItemRapide', [iid]); refreshEditRapide(rid);
    };
  });
  render();
}

/* ============ Modal ============ */
// stacked : false = 1er niveau, true = par-dessus, 3 = par-dessus une
// feuille déjà empilée (créer un ingrédient depuis « Ajouter à
// l'épicerie » remplaçait cette feuille et plantait — avant v5.6).
function showSheet(title, inner, stacked){
  var id = stacked === 3 ? 'ov3' : stacked ? 'ov2' : 'ov';
  var old = $(id); if (old) old.remove();
  var o = document.createElement('div');
  o.className = 'overlay'; o.id = id;
  if (stacked) o.style.zIndex = stacked === 3 ? '75' : '70';
  o.innerHTML = '<div class="sheet"><div class="grab"></div><div class="shd"><span class="t">' + esc(title) + '</span><span class="x clk">&times;</span></div>' + inner + '</div>';
  // Dès qu'un geste a modifié le contenu, fermer — par un clic à côté
  // OU par le X — demande confirmation. Une recette tapée au complet
  // s'est déjà perdue sur un clic échappé à côté de la fenêtre.
  // PAS de confirm() natif : iOS le bloque en mode app installée et
  // répond « non » tout seul — la feuille devenait infermable (v4.9.0).
  var touche = false;
  // Chercher une recette n'est pas « du travail à protéger ».
  function marque(e){ if (!(e.target && (e.target.type === 'search' || e.target.hasAttribute('data-libre')))) touche = true; }
  o.addEventListener('input', marque, true);
  o.addEventListener('change', marque, true);
  function fermer(){
    // data-garde : armé par les feuilles qui arrivent déjà remplies
    // (recette importée d'Instagram) — là aussi, du travail à protéger.
    if (!(touche || o.hasAttribute('data-garde'))) { o.remove(); return; }
    var deja = o.querySelector('.garde-bar');
    if (deja) { deja.classList.remove('pulse'); void deja.offsetWidth; deja.classList.add('pulse'); return; }
    var bar = document.createElement('div');
    bar.className = 'garde-bar pulse';
    bar.innerHTML = '<span>Fermer sans enregistrer&nbsp;? Ce qui est tapé sera perdu.</span>' +
      '<button class="btn sm garde-non" type="button">Continuer</button>' +
      '<button class="btn sm danger garde-oui" type="button">Fermer</button>';
    var shd = o.querySelector('.shd');
    shd.parentNode.insertBefore(bar, shd.nextSibling);
    bar.querySelector('.garde-oui').onclick = function () { o.remove(); };
    bar.querySelector('.garde-non').onclick = function () { bar.remove(); };
  }
  o.onclick = function (e) { if (e.target === o) fermer(); };
  document.body.appendChild(o);
  o.querySelector('.x').onclick = fermer;
}
function closeSheet(){
  var o3 = $('ov3'); if (o3) { o3.remove(); return; }
  var o2 = $('ov2'); if (o2) { o2.remove(); return; }
  var o = $('ov'); if (o) o.remove();
}

qall('.side-item,.mobilenav .nv').forEach(function (n) { n.classList.toggle('on', n.getAttribute('data-tab') === TAB); });

// Voile de la barre du haut : son filet n'apparaît qu'au défilement
window.addEventListener('scroll', function () {
  document.body.classList.toggle('scrolled', window.scrollY > 8);
}, { passive: true });

// Clavier mobile : garder le champ actif visible
document.addEventListener('focusin', function (e) {
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) {
    setTimeout(function () { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) { try { t.scrollIntoView(); } catch (y) {} } }, 300);
  }
});

// Avant de masquer/fermer l'app : TOUT part maintenant, en keepalive —
// l'envoi survit à la fermeture. Avant v5.7, ce qu'on venait d'ajouter
// restait sur le téléphone jusqu'à sa réouverture : l'autre ne voyait rien.
var dernierAdieu = 0;
function envoyerAvantFermeture(){
  flushEpi(); flushLi(); // (ce qui lance aussi l'envoi normal)
  if (!syncQueue.length || !HOSTED) return;
  if (Date.now() - dernierAdieu < 1500) return; // pagehide + visibilitychange : une fois suffit
  dernierAdieu = Date.now();
  // Copie « keepalive » de toute la file, dans l'ordre : elle part même si
  // le téléphone met l'app en veille. Si l'envoi normal passe aussi, le
  // serveur reconnaît les opId : rien n'est fait deux fois. La réponse
  // est ignorée — au retour, la file repart et le serveur confirme.
  if (LOT_OK !== false) {
    var lot = syncQueue.slice(0, LOT_MAX).map(function (it) { return { fn: it.fn, args: it.args, opId: it.id }; });
    apiRaw('lot', [lot, {}], { keepalive: true }).catch(function () {});
  } else {
    var it = syncQueue[0];
    apiRaw(it.fn, it.args, { opId: it.id, keepalive: true }).catch(function () {});
  }
}
window.addEventListener('pagehide', envoyerAvantFermeture);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') envoyerAvantFermeture();
  else heartbeat(); // de retour dans l'app : le nouveau, tout de suite
});
window.addEventListener('pageshow', function (e) { if (e.persisted) heartbeat(); });
window.addEventListener('focus', function () { heartbeat(); });
window.addEventListener('online', function () { isOffline = false; updateSync(); flushQueue(); heartbeat(); });
window.addEventListener('offline', function () { isOffline = true; updateSync(); });
// Fin de saisie ou feuille fermée (peu importe comment) : les données
// arrivées entre-temps s'affichent tout de suite.
document.addEventListener('focusout', function () { setTimeout(appliquerAttente, 60); });
if (window.MutationObserver) {
  new MutationObserver(function (ms) {
    for (var i = 0; i < ms.length; i++) {
      for (var k = 0; k < ms[i].removedNodes.length; k++) {
        if (/^ov[23]?$/.test(ms[i].removedNodes[k].id || '')) { setTimeout(appliquerAttente, 60); return; }
      }
    }
  }).observe(document.body, { childList: true });
}
$('syncPill').onclick = forcerSync;

// ❤️ Battement de cœur (4 s, app visible) : envoie la file en attente,
// et demande « du nouveau ? » — le nouveau vient dans la même réponse.
setInterval(function () { if (Date.now() >= prochainBattement) heartbeat(); }, 1000);

// Service Worker (offline + mises à jour auto) — seulement en mode hébergé (GitHub Pages)
if (HOSTED && 'serviceWorker' in navigator) {
  var swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swRefreshed) return; swRefreshed = true; location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg && reg.update) { setInterval(function () { reg.update(); }, 60000); }
    }).catch(function () {});
  });
}

console.log('Lavoie & Co v' + CONFIG.VERSION + (HOSTED ? ' (hébergé)' : ' (iframe Apps Script)'));
load();
</script>
