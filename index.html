<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lavoie &amp; Co</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6F5F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&display=swap" rel="stylesheet">
<!-- iOS : installation plein écran + icône d'accueil -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lavoie & Co">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* ================================================================
     LAVOIE & CO — v5.7.2 « Porcelaine »
     Direction : sobre et épuré. Porcelaine chaude, noir profond,
     une seule touche de sable. Titres en Bodoni Moda, interface en
     Inter, mot-symbole en Marcellus.
     Toute la palette tient dans le bloc :root ci-dessous — changer
     une couleur là la change partout (ombres et teintes comprises,
     via color-mix). Les anciens noms de variables restent en alias.
     ================================================================ */
  :root{
    /* Palette — tout le reste de la feuille en découle */
    --bg:#F6F5F2; --bg-2:#EDEBE6; --card:#FFFFFF;
    --ink:#141414; --ink2:#4A4A48; --mut:#8D8B86;
    --line:#E6E3DD; --line2:#F0EEE9; --line-strong:#D5D1C9; --faint:#C3BFB7;
    --pri:#1C1C1C; --pri-2:#333333; --pri-deep:#000000; --on-pri:#FFFFFF; --pri-ghost:#F0EFEC; --pri-line:#D6D3CD;
    --dark:#1C1C1C; --dark-2:#2E2E2E; --on-dark:#F6F4EF;
    --acc:#B39570; --acc-soft:#D8C6A8; --acc-ink:#86694A; --acc-ghost:#F7F3EC; --acc-line:#E6DCCC;
    --danger:#B23A2B; --danger-ghost:#FBEAE6;
    /* Alias (noms utilisés ailleurs dans le code) */
    --paper:var(--bg); --paper-2:var(--bg-2);
    --wine:var(--pri); --wine-2:var(--pri-2); --wine-deep:var(--pri-deep); --wine-ghost:var(--pri-ghost); --wine-line:var(--pri-line);
    --night:var(--dark); --night-2:var(--dark-2); --night-3:var(--dark-2);
    --champ:var(--acc); --champ-soft:var(--acc-soft); --champ-ink:var(--acc-ink); --champ-ghost:var(--acc-ghost); --champ-line:var(--acc-line);
    --forest:var(--pri); --forest-2:var(--pri-2); --forest-deep:var(--dark);
    --gold:var(--acc); --gold-soft:var(--acc-soft); --gold-ink:var(--acc-ink); --gold-ghost:var(--acc-ghost); --gold-line:var(--acc-line);
    --pine:var(--pri); --pine-deep:var(--pri); --pine-ghost:var(--pri-ghost); --pine-line:var(--pri-line);
    --brass:var(--acc-ink); --brass-2:var(--acc-soft); --brass-ghost:var(--acc-ghost);
    --side-text:color-mix(in srgb,var(--on-dark) 66%,transparent); --side-mut:color-mix(in srgb,var(--on-dark) 42%,transparent); --side-on:var(--on-dark);
    --serif:'Bodoni Moda','Didot','Bodoni 72',ui-serif,Georgia,'Times New Roman',serif;
    --mark:'Marcellus',ui-serif,Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --r-lg:24px; --r:18px; --r-sm:12px;
    --sh-1:0 1px 1px color-mix(in srgb,var(--dark) 3%,transparent),0 6px 18px color-mix(in srgb,var(--dark) 5%,transparent);
    --sh-2:0 2px 4px color-mix(in srgb,var(--dark) 4%,transparent),0 18px 40px color-mix(in srgb,var(--dark) 10%,transparent);
    --sh-pop:0 28px 70px color-mix(in srgb,var(--dark) 28%,transparent);
    --ease:cubic-bezier(.22,1,.36,1);
    --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
    --nav-w:268px;
    --navbar-h:calc(84px + var(--safe-b));
    --maxw:1240px;
  }

  .wordmark{font-family:var(--mark);font-weight:400;letter-spacing:.32em;text-transform:uppercase;
    color:var(--ink);white-space:nowrap}
  .wordmark .et{color:var(--acc);font-family:var(--serif);font-style:italic;letter-spacing:0;margin:0 .12em 0 -.1em}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.45;letter-spacing:-.006em;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
    font-feature-settings:'cv11','ss01';font-variant-numeric:lining-nums}
  ::selection{background:var(--champ-ghost)}
  :focus-visible{outline:2px solid var(--champ);outline-offset:2px;border-radius:6px}
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}

  /* ---------- SPLASH : nuit, champagne ---------- */
  #splash{position:fixed;inset:0;z-index:200;
    background:radial-gradient(110% 70% at 50% 35%,var(--dark-2) 0%,var(--dark) 62%,color-mix(in srgb,var(--dark) 70%,#000) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    transition:opacity .55s ease,visibility .55s}
  #splash.gone{opacity:0;visibility:hidden}
  .sp-word{font-family:var(--mark);font-size:28px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--on-dark);padding-left:.34em}
  .sp-word .et{color:var(--champ);font-family:var(--serif);font-style:italic;letter-spacing:0}
  .sp-word span{display:inline-block;animation:spLetter .7s var(--ease) both}
  @keyframes spLetter{from{opacity:0;transform:translateY(16px);filter:blur(6px)}}
  .sp-word span:nth-child(1){animation-delay:.05s}
  .sp-word span:nth-child(2){animation-delay:.11s}
  .sp-word span:nth-child(3){animation-delay:.17s}
  .sp-word span:nth-child(4){animation-delay:.23s}
  .sp-word span:nth-child(5){animation-delay:.29s}
  .sp-word span:nth-child(6){animation-delay:.35s}
  .sp-word span:nth-child(7){animation-delay:.44s}
  .sp-word span:nth-child(8){animation-delay:.53s}
  .sp-word span:nth-child(9){animation-delay:.59s}
  .sp-dessin{width:170px;height:56px;overflow:visible;margin:-4px 0}
  .sp-dessin path{fill:none;stroke:var(--champ);stroke-width:1.4;stroke-linecap:round;
    stroke-dasharray:1;stroke-dashoffset:0}
  .sp-dessin .tige{animation:spTrace 1.1s .85s cubic-bezier(.45,0,.2,1) both}
  .sp-dessin .f1{animation:spTrace .5s 1.55s ease-out both}
  .sp-dessin .f2{animation:spTrace .5s 1.72s ease-out both}
  .sp-dessin .f3{animation:spTrace .5s 1.89s ease-out both}
  .sp-dessin .f4{animation:spTrace .5s 2.06s ease-out both}
  .sp-dessin .f5{animation:spTrace .5s 2.23s ease-out both}
  @keyframes spTrace{from{stroke-dashoffset:1}}
  /* Un mot sur la famille : les mots se posent un à un, puis on laisse lire */
  #splash{cursor:pointer}
  .sp-poeme{margin:6px 0 0;max-width:min(460px,86vw);padding:0 6px;text-align:center}
  .sp-poeme blockquote{margin:0;font-family:var(--serif);font-style:italic;font-weight:400;
    font-size:clamp(17px,4.7vw,21px);line-height:1.55;letter-spacing:-.005em;
    color:color-mix(in srgb,var(--on-dark) 90%,transparent);text-wrap:balance}
  .sp-poeme .w{display:inline-block;opacity:0;animation:spMot .95s var(--ease) forwards}
  @keyframes spMot{from{opacity:0;transform:translateY(9px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  .sp-poeme figcaption{margin-top:16px;font-size:9.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
    color:var(--champ);opacity:0;transition:opacity .9s ease}
  .sp-poeme figcaption.on{opacity:.85}
  .sp-skip{font-size:10.5px;letter-spacing:.08em;color:color-mix(in srgb,var(--on-dark) 38%,transparent);
    opacity:0;transition:opacity .8s ease;margin-top:-8px}
  .sp-skip.on{opacity:1}
  .sp-bar.prog i{animation:none;width:0;transition-property:width;transition-timing-function:linear}
  @media(prefers-reduced-motion:reduce){ .sp-poeme .w{opacity:1} }
  .sp-tag{font-family:var(--serif);font-style:italic;font-size:16px;color:color-mix(in srgb,var(--on-dark) 70%,transparent);
    animation:spRise .9s 2.35s var(--ease) both}
  .sp-bar{width:120px;height:1px;background:rgba(255,255,255,.12);overflow:hidden;animation:spRise .9s 2.5s both}
  .sp-bar i{display:block;height:100%;width:40%;background:var(--champ);animation:spLoad 1.4s ease-in-out infinite}
  .sp-ver{font-size:10px;color:color-mix(in srgb,var(--on-dark) 40%,transparent);letter-spacing:.2em;animation:spRise .9s 2.65s both}
  @keyframes spRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spLoad{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}

  /* ---------- Barre latérale (bureau) : bleu nuit ---------- */
  .sidebar{display:none}
  .side-logo{padding:8px 6px 2px}
  .side-logo .wordmark{color:var(--on-dark)}
  .side-logo .wordmark .et{color:var(--champ)}
  .side-tag{font-size:9.5px;color:var(--champ);text-transform:uppercase;letter-spacing:.26em;padding:8px 7px 28px;font-weight:600;opacity:.75}
  .side-new{margin:0 0 24px;width:100%;
    background:var(--on-dark);color:var(--dark);border-radius:12px;padding:12px;
    font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 10px 24px rgba(0,0,0,.3);
    transition:filter .15s,transform .1s}
  .side-new:active{transform:scale(.98)}
  .side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .side-item{position:relative;display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:11px;color:var(--side-text);
    font-weight:500;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
  .side-item svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;flex-shrink:0;opacity:.85}
  .side-item.on{background:rgba(255,255,255,.06);color:var(--side-on)}
  .side-item.on svg{stroke:var(--champ);opacity:1}
  .side-item.on::after{content:'';position:absolute;right:14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--champ)}
  .side-foot{display:flex;align-items:center;gap:8px;padding:14px 8px 4px;border-top:1px solid rgba(255,255,255,.08);
    font-size:12px;color:var(--side-mut);font-weight:500}
  .side-foot .sver{margin-left:auto;font-size:10.5px;letter-spacing:.06em;opacity:.8}

  /* ---------- Pastille de sync ---------- */
  .sync{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:30px;padding:5px 11px 5px 9px;font-size:11px;font-weight:600;color:var(--ink2);
    letter-spacing:.01em;white-space:nowrap}
  .sdot{width:7px;height:7px;border-radius:50%;background:#5E9A76;transition:background .2s;flex-shrink:0;
    box-shadow:0 0 0 3px rgba(94,154,118,.16)}
  .sdot.busy{background:var(--champ);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent);animation:pulse 1s infinite}
  .sdot.off{background:#C9803F;box-shadow:0 0 0 3px rgba(201,128,63,.16);animation:none}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- Contenu ---------- */
  .content{min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);
    backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);
    padding:calc(12px + var(--safe-t)) 18px 11px;border-bottom:1px solid transparent;
    transition:border-color .25s,box-shadow .25s;
    display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:9px}
  .pagetitle{display:none}
  #goNous{display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;border-radius:50%}
  #goNous svg{display:block;transform-origin:center}
  #goNous svg path{stroke:var(--wine)}
  #goNous.new svg path{fill:var(--wine)}
  #goNous.new svg{animation:coeurbat 2.2s ease-in-out infinite}
  @keyframes coeurbat{0%,100%{transform:scale(1)}8%{transform:scale(1.16)}16%{transform:scale(1)}}

  main{padding:10px 16px 0;max-width:620px;margin:0 auto;padding-bottom:calc(var(--navbar-h) + 28px)}
  /* Titre de page en Bodoni, précédé d'un losange champagne */
  .ph{font-family:var(--serif);font-size:42px;font-weight:500;letter-spacing:-.025em;margin:0 0 6px;line-height:1.02;color:var(--ink)}
  .ph::before{content:'';display:block;width:7px;height:7px;background:var(--champ);transform:rotate(45deg);margin:10px 0 18px 2px}
  .psub{color:var(--mut);font-size:13.5px;margin:0 0 22px;line-height:1.5}

  .panes{display:block}
  .recgrid{display:grid;grid-template-columns:1fr;gap:10px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;
    margin-bottom:10px;box-shadow:var(--sh-1)}
  .card.tap{transition:transform .16s var(--ease),box-shadow .22s,border-color .22s,background .22s}
  .card.tap:active{transform:scale(.985)}
  .card.tracked{background:var(--acc-ghost);border-color:var(--champ-line)}
  .card.sel{border-color:var(--wine);background:color-mix(in srgb,var(--pri) 4%,var(--card));box-shadow:0 0 0 1px var(--wine),0 10px 24px color-mix(in srgb,var(--pri) 10%,transparent)}
  .row{display:flex;align-items:center;gap:12px} .grow{flex:1;min-width:0}
  .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .muted{color:var(--mut)} .small{font-size:12.5px}

  .datechip{display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;min-height:46px;flex-shrink:0}
  .datechip .d{font-family:var(--serif);font-size:30px;font-weight:500;color:var(--ink);line-height:.95;letter-spacing:-.02em}
  .datechip.empty{padding:0;font-size:inherit;line-height:inherit}
  .datechip.empty .d{color:var(--faint)}
  .datechip .m{font-size:8.5px;color:var(--champ-ink);text-transform:uppercase;letter-spacing:.22em;margin-top:5px;font-weight:650;padding-left:.22em}
  .datechip.empty .m{color:var(--faint)}
  .mealname{font-size:15px;font-weight:600;letter-spacing:-.012em;color:var(--ink)}
  .cook{font-size:12px;color:var(--mut);margin-top:2px}

  /* Monogramme : médaillon rond, initiale Bodoni italique */
  .mono{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-style:italic;font-size:22px;font-weight:500;line-height:1;
    background:var(--bg-2);color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--line);transition:background .2s,color .2s,box-shadow .2s}
  .mono svg{width:17px;height:17px}
  .mono.on{background:var(--wine);color:var(--on-pri);box-shadow:0 8px 18px color-mix(in srgb,var(--pri) 28%,transparent)}
  .mono.on svg path{stroke-dasharray:1;stroke-dashoffset:0;animation:chkdraw .35s .04s cubic-bezier(.4,0,.2,1) both}
  /* monogrammes neutres : une seule teinte, sobre */

  /* étapes visuelles de l'import de recette (Internet) */
  .impsteps{margin:18px 2px 6px;display:none}
  .impsteps.show{display:block}
  .impstep{display:flex;align-items:flex-start;gap:12px;position:relative;padding-bottom:20px}
  .impstep:last-child{padding-bottom:0}
  .impstep::before{content:'';position:absolute;left:13px;top:32px;bottom:4px;width:2px;background:var(--line);border-radius:2px}
  .impstep:last-child::before{display:none}
  .impstep.ok::before{background:linear-gradient(180deg,var(--champ-soft),var(--champ))}
  .impstep .num{position:relative;width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--line);
    color:var(--mut);font-family:var(--serif);font-size:14px;font-weight:600;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;transition:background .25s,border-color .25s,color .25s}
  .impstep .num svg{width:14px;height:14px}
  .impstep .lbl{font-size:14px;font-weight:600;color:var(--mut);padding-top:3px;transition:color .25s}
  .impstep .sub{font-size:11.5px;color:var(--mut);margin-top:1px;font-weight:400;line-height:1.45}
  .impstep.on .num{border-color:var(--wine);color:var(--wine);background:var(--wine-ghost)}
  .impstep.on .num::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid transparent;
    border-top-color:var(--champ);animation:impspin .9s linear infinite}
  .impstep.on .lbl{color:var(--ink)}
  .impstep.ok .num{background:linear-gradient(135deg,var(--champ-soft),var(--champ));border-color:transparent;color:#fff;
    box-shadow:0 2px 6px color-mix(in srgb,var(--acc) 35%,transparent)}
  .impstep.ok .lbl{color:var(--ink)}
  .impstep.err .num{background:var(--danger-ghost);border-color:var(--danger);color:var(--danger)}
  .impstep.err .lbl{color:var(--danger)}
  .impstep.err .sub{color:var(--danger)}
  @keyframes impspin{to{transform:rotate(360deg)}}
  .ig-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .ig-thumb{position:relative;width:58px;height:58px;border-radius:12px;overflow:hidden;
    border:1px solid var(--line);box-shadow:var(--sh-1);flex-shrink:0}
  .ig-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ig-thumb .rmv{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
    background:color-mix(in srgb,var(--dark) 75%,transparent);color:#fff;font-size:13px;line-height:18px;text-align:center;cursor:pointer}

  /* ---------- La semaine : un carnet unique, un jour par ligne ---------- */
  .week{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);
    padding:6px;margin-bottom:12px}
  .day{padding:6px 12px 6px 6px;border-radius:18px;position:relative}
  .day + .day::before{content:'';position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--line)}
  .day.today + .day::before,.day + .day.today::before{display:none}
  .card.day{padding:6px 12px 6px 8px}
  .slotrow{display:flex;align-items:center;gap:10px;padding:7px 0;min-height:40px}
  .slotrow + .slotrow{border-top:1px dashed var(--line2)}
  .slotlbl{font-size:9px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
    width:50px;flex-shrink:0}
  .slotempty{color:var(--faint);font-family:var(--serif);font-style:italic;font-size:15px;font-weight:400;letter-spacing:0}
  .slotrow.dragover{background:var(--wine-ghost);box-shadow:0 0 0 3px var(--wine-ghost);border-radius:10px}
  .slotrow .mealname{font-size:14.5px}

  /* Aujourd'hui : la ligne passe au bleu nuit, date champagne */
  .today{background:linear-gradient(160deg,var(--dark-2) 0%,var(--dark) 100%);color:var(--on-dark);
    box-shadow:0 14px 30px color-mix(in srgb,var(--dark) 28%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--acc) 18%,transparent)}
  .card.today{border-color:transparent}
  .today .datechip .d{color:var(--champ-soft)}
  .today .datechip .m{color:var(--dark);background:var(--acc-soft);border-radius:20px;padding:2px 6px 2px 8px;letter-spacing:.18em;margin-top:6px}
  .today .slotlbl{color:color-mix(in srgb,var(--acc-soft) 80%,transparent)}
  .today .slotempty{color:color-mix(in srgb,var(--on-dark) 42%,transparent)}
  .today .mealname{color:var(--on-dark)}
  .today .cook{color:color-mix(in srgb,var(--on-dark) 55%,transparent)}
  .today .slotrow + .slotrow{border-top-color:rgba(255,255,255,.12)}
  .today .chev,.today .xdel,.today .dragh{color:color-mix(in srgb,var(--on-dark) 40%,transparent)}
  .today .xdel:active{color:#FF9C84}
  .today .slotrow.dragover{background:rgba(255,255,255,.1);box-shadow:none}

  /* Accès au Menu Chasse : billet champagne */
  .card.chasse-cta{display:block;padding:13px 16px;background:var(--champ-ghost);border-color:var(--champ-line);box-shadow:none}
  .chasse-cta .eyebrow{font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--champ-ink)}
  .chasse-cta .mealname{font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:-.01em;line-height:1.2;margin-top:2px}
  .chasse-cta .ctchip{background:var(--card);color:var(--champ-ink);border:1px solid var(--champ-line)}
  .chasse-cta .chev{color:var(--champ-ink)}

  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .anim .pane-a > *{animation:cardIn .5s var(--ease) both}
  .anim .pane-a > *:nth-child(2){animation-delay:.035s}
  .anim .pane-a > *:nth-child(3){animation-delay:.07s}
  .anim .pane-a > *:nth-child(4){animation-delay:.105s}
  .anim .pane-a > *:nth-child(5){animation-delay:.14s}
  .anim .pane-a > *:nth-child(6){animation-delay:.175s}
  .anim .pane-a > *:nth-child(7){animation-delay:.21s}
  .anim .pane-a > *:nth-child(8){animation-delay:.245s}
  .anim .pane-a > *:nth-child(n+9){animation-delay:.28s}
  .anim .week > .day{animation:cardIn .5s var(--ease) both}
  .anim .week > .day:nth-child(2){animation-delay:.05s}
  .anim .week > .day:nth-child(3){animation-delay:.1s}
  .anim .week > .day:nth-child(4){animation-delay:.15s}
  .anim .week > .day:nth-child(5){animation-delay:.2s}
  .anim .week > .day:nth-child(6){animation-delay:.25s}
  .anim .week > .day:nth-child(n+7){animation-delay:.3s}
  .anim .recgrid > .card,.anim .inggrid > .card{animation:cardIn .45s var(--ease) both}

  /* Épicerie */
  .epi-card.done{background:var(--card)!important;border-color:var(--line)!important;box-shadow:none;opacity:.7}
  .epi-card .chk{background:rgba(255,255,255,.9)}
  .raydot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .rayhd.done > span:nth-child(2){color:var(--mut);text-decoration:line-through;
    text-decoration-thickness:1px;text-decoration-color:var(--champ)}
  .rayhd.done .ct{color:var(--champ-ink);font-weight:700}

  /* ---------- Accordéons ---------- */
  .fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .34s var(--ease)}
  .fold.closed{grid-template-rows:0fr}
  .fold > div{overflow:hidden;min-width:0}
  .foldchev{color:var(--faint);font-size:17px;display:inline-block;padding:0 2px;
    transform:rotate(0);transition:transform .25s var(--ease)}
  .foldchev.open{transform:rotate(90deg)}
  .ctchip{font-size:10.5px;font-weight:650;color:var(--ink2);background:var(--paper-2);
    border-radius:20px;padding:3px 9px;letter-spacing:.02em;white-space:nowrap;font-variant-numeric:tabular-nums}

  /* Sélecteur segmenté : soulignement, façon onglets de magazine */
  .seg{display:flex;gap:6px;background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:0;margin:0 0 20px}
  .seg .sg{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px 13px;position:relative;
    font-weight:600;font-size:13.5px;color:var(--mut);cursor:pointer;transition:color .2s}
  .seg .sg::after{content:'';position:absolute;left:18%;right:18%;bottom:-1px;height:2px;border-radius:2px;background:var(--wine);
    transform:scaleX(0);transition:transform .3s var(--ease)}
  .seg .sg.on{color:var(--ink)}
  .seg .sg.on::after{transform:scaleX(1)}
  .seg .sg.on .ctchip{background:var(--wine);color:var(--on-pri)}
  .shopsum{display:flex;flex-direction:column;gap:16px;padding:18px 20px;
    background:linear-gradient(150deg,var(--pri-2) 0%,var(--pri-deep) 60%,var(--pri-deep) 100%)!important;border-color:transparent!important;color:var(--on-pri);
    box-shadow:0 4px 10px color-mix(in srgb,var(--pri) 16%,transparent)!important;margin-bottom:20px}
  .shopsum .n{font-family:var(--serif);font-size:48px;font-weight:500;line-height:.9;color:var(--champ-soft)}
  .shopsum .muted{color:color-mix(in srgb,var(--on-pri) 65%,transparent)}
  .shopsum .rayprog{background:rgba(255,255,255,.18)}
  .shopsum .rayprog i{background:var(--champ-soft)}
  .shopsum .top{display:flex;align-items:center;gap:16px}
  /* Ajouter un article : LE geste de la liste — sable sur noir, pleine largeur */
  .shopadd{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px 16px;
    border-radius:999px;background:var(--acc-soft);color:var(--dark);font-weight:650;font-size:15px;letter-spacing:-.005em;
    box-shadow:0 1px 0 rgba(255,255,255,.35) inset;transition:transform .1s,filter .15s}
  .shopadd:active{transform:scale(.985)}
  .shopadd svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  @media(hover:hover){ .shopadd:hover{filter:brightness(1.05)} }
  .shopacts{display:flex;gap:10px;align-items:stretch}
  .shopacts .shopadd{flex:1;width:auto}
  /* Exporter : le rond « partage » à côté de l'ajout */
  .shopexp{flex:0 0 50px;border-radius:999px;border:1px solid color-mix(in srgb,var(--acc-soft) 60%,transparent);
    color:var(--acc-soft);background:transparent;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .shopexp:active{background:rgba(255,255,255,.08)}
  .shopexp svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .exp-opt{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0;margin:0 0 14px;cursor:pointer}
  .exp-opt input{width:20px;height:20px;margin:0;accent-color:var(--pri);flex-shrink:0}
  .exp-resume{font-size:12.5px;color:var(--mut);margin:-4px 0 14px}
  .exp-apercu{white-space:pre-wrap;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;line-height:1.5;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-height:190px;overflow:auto;margin:0 0 16px;color:var(--ink2)}
  .exp-acts{display:flex;flex-direction:column;gap:9px}
  .exp-acts .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  /* Bande d'humeurs */
  .humband{display:flex;justify-content:space-between;gap:4px;background:var(--paper);
    border-radius:999px;padding:6px 8px;margin-bottom:12px;border:1px solid var(--line2)}
  .hum{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--mut);transition:background .18s,color .18s,transform .12s}
  .hum:active{transform:scale(.9)}
  .hum.on{background:var(--wine);color:var(--on-pri)}
  @media(max-width:899px){
    .mode-shop .pane-a{display:none}
    .mode-prep .pane-b{display:none}
  }
  @media(min-width:900px){ .seg-epi{display:none} }

  /* ---------- Calendrier ---------- */
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;box-shadow:var(--sh-1)}
  .calhd7{font-size:9.5px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;color:var(--champ-ink);
    text-align:center;padding:4px 0 6px}
  .calc{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:50%;font-family:var(--serif);font-size:17px;font-weight:500;color:var(--ink);background:transparent;
    border:1px solid transparent;cursor:pointer;position:relative;gap:1px;transition:background .15s,transform .12s}
  .calc:active{transform:scale(.94)}
  .calc.vide{cursor:default}
  .calc.auj{background:var(--night);color:var(--champ-soft);box-shadow:0 8px 18px color-mix(in srgb,var(--dark) 25%,transparent)}
  .calc .evdot{display:flex;gap:3px;height:4px}
  .calc .evdot i{width:4px;height:4px;border-radius:50%;background:var(--wine)}
  .calc.auj .evdot i{background:var(--on-pri)}
  .calc .mdot{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--champ)}

  /* ---------- Le menu de chasse imprimable ---------- */
  #chassePrint{position:fixed;inset:0;z-index:90;background:var(--paper);overflow-y:auto;
    -webkit-overflow-scrolling:touch}
  .chm{max-width:560px;margin:0 auto;padding:26px 22px 44px;text-align:center;
    font-family:'Cormorant Garamond',Georgia,serif}
  .chm .chm-titre{font-family:var(--mark);font-size:30px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--night);margin:8px 0 2px;padding-left:.16em}
  .chm .chm-sous{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
    color:var(--wine);padding-left:.3em;margin-bottom:4px}
  .chm .chm-filet{width:110px;height:1px;background:var(--champ);margin:14px auto}
  .chm-2col{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;align-items:start}
  .chm-sec{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
    color:var(--wine);margin:8px 0 5px;padding-left:.26em}
  .chm-item{font-size:17px;font-style:italic;font-weight:500;color:var(--ink2);line-height:1.5}
  .chm .chm-jour{margin:13px 0 1px;display:flex;align-items:center;gap:10px}
  .chm .chm-jour .ln{flex:1;height:1px;background:var(--champ-line)}
  .chm .chm-jour .t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--night)}
  .chm .chm-plat{font-size:17px;font-weight:500;font-style:italic;color:var(--ink);margin:4px 0 0;line-height:1.3}
  .chm .chm-plat .quoi{font-size:8px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    color:var(--champ-ink);display:block;margin-bottom:0;font-family:var(--sans);font-style:normal}
  .chm .chm-libre{color:var(--faint);font-size:15px}
  .chm-bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;
    padding:14px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  @media print{
    body > *{display:none!important}
    body > #chassePrint{display:block!important;position:static;overflow:visible;background:#fff}
    .chm-bar{display:none!important}
    .chm{max-width:none;padding:8px 10px}
  }

  .rayhd{position:sticky;top:calc(52px + var(--safe-t));z-index:5;background:var(--paper);
    cursor:pointer;padding:8px 5px;margin:12px 0 4px}

  .mobilenav .nv{position:relative}
  .navbadge{position:absolute;top:1px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;
    background:var(--wine);color:var(--on-pri);font-size:9.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px var(--night)}
  .side-item .navbadge{position:static;margin-left:auto;margin-right:12px;box-shadow:none;background:var(--acc-soft);color:var(--dark)}

  body.scrolled .topbar{border-bottom-color:var(--line);box-shadow:0 10px 30px color-mix(in srgb,var(--dark) 5%,transparent)}

  ::-webkit-scrollbar{width:11px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:3px solid var(--paper)}
  ::-webkit-scrollbar-track{background:transparent}
  .lastcook{color:var(--acc-ink);font-weight:600}
  .tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .ttag{font-size:11px;padding:2px 9px;border-radius:20px;background:transparent;border:1px solid var(--line);color:var(--ink2);
    font-weight:550}
  .tagrow .ttag{font-size:9.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
  .trackchip{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--champ-ink);background:var(--champ-ghost);border:1px solid var(--champ-line);
    border-radius:20px;padding:3px 9px;white-space:nowrap}
  .trackchip svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:3}
  .xlist{padding:4px 14px}
  .xrow{display:flex;align-items:center;gap:12px;padding:10px 0}
  .xrow + .xrow{border-top:1px solid var(--line2)}
  .xico{width:32px;height:32px;border-radius:50%;background:var(--acc-ghost);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .xico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .xdel{color:var(--faint);font-size:20px;padding:2px 6px;line-height:1;cursor:pointer;transition:color .15s}
  .xdel:active{color:var(--danger)}
  .chev{color:var(--faint);font-size:19px}

  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:15px}
  .btn{background:var(--wine);color:var(--on-pri);border-radius:999px;padding:13px 20px;font-weight:600;width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;letter-spacing:.005em;
    box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 8px 18px color-mix(in srgb,var(--pri) 22%,transparent);
    transition:filter .15s,transform .1s,background .15s,box-shadow .15s}
  .btn:active{transform:scale(.985);background:var(--wine-deep)}
  .btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-1)}
  .btn.ghost{background:var(--paper-2);color:var(--ink);box-shadow:none}
  .btn.danger{background:var(--card);color:var(--danger);border:1px solid var(--line);box-shadow:none}
  .btn.sm{padding:8px 15px;font-size:13px;width:auto;border-radius:999px}
  .garde-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0 2px;
    padding:11px 13px;background:var(--danger-ghost);border:1px solid var(--danger);
    border-radius:var(--r-sm);font-size:13.5px;line-height:1.35}
  .garde-bar span{flex:1;min-width:150px}
  .garde-bar .btn.sm{margin:0}
  .garde-bar .btn.sm.danger{border-color:var(--danger)}
  .garde-bar.pulse{animation:gardePulse .35s ease-out}
  @keyframes gardePulse{0%{transform:scale(1)}35%{transform:scale(1.025)}100%{transform:scale(1)}}
  .btn[disabled]{opacity:.5;pointer-events:none;box-shadow:none}

  .fab{position:fixed;bottom:calc(var(--navbar-h) + 16px);right:18px;z-index:40;width:58px;height:58px;
    border-radius:50%;background:var(--wine);color:var(--on-pri);font-size:30px;font-weight:300;
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px color-mix(in srgb,var(--bg) 90%,transparent),0 14px 30px color-mix(in srgb,var(--pri) 35%,transparent);
    transition:transform .12s}
  .fab:active{transform:scale(.93)}
  /* Le bouton flottant ne doit jamais cacher le × du dernier article */
  body.has-fab main{padding-bottom:calc(var(--navbar-h) + 100px)}

  label{font-size:10.5px;font-weight:650;color:var(--champ-ink);display:block;margin:0 0 6px;
    text-transform:uppercase;letter-spacing:.14em}
  input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 14px;border:1px solid var(--line);
    border-radius:13px;background:var(--card);color:var(--ink);transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--wine);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 9%,transparent)}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  .field{margin-bottom:14px}

  .chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-strong);flex-shrink:0;display:flex;
    align-items:center;justify-content:center;background:var(--card);color:var(--on-pri);
    transition:border-color .18s,background .18s,box-shadow .18s}
  .chk.on{background:var(--wine);border-color:var(--wine);animation:chkpop .22s ease}
  .chk svg{width:12px;height:12px}
  .chk.on svg path{stroke-dasharray:1;stroke-dashoffset:0;animation:chkdraw .35s .04s cubic-bezier(.4,0,.2,1) both}
  @keyframes chkdraw{from{stroke-dashoffset:1}}
  @keyframes chkpop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  .done .mealname,.done .itxt{text-decoration:line-through;color:var(--mut);text-decoration-color:var(--line-strong)}

  .rayhd{display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:700;color:var(--ink);
    text-transform:uppercase;letter-spacing:.14em;margin:22px 5px 8px}
  .rayhd:first-child{margin-top:4px}
  .rayprog{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
  .rayprog i{display:block;height:100%;background:var(--champ);border-radius:2px;transition:width .35s var(--ease)}
  .rayhd .ct{color:var(--mut);font-weight:600;letter-spacing:0;font-size:11px}

  .grphd{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:20px;font-weight:500;font-style:italic;color:var(--ink);
    letter-spacing:-.01em;margin:28px 4px 12px}
  .grphd:first-child{margin-top:4px}
  .grphd .btn{font-family:var(--sans);font-style:normal;letter-spacing:0}
  .grphd .ln{flex:1;height:1px;background:var(--line)}
  .grphd .ct{font-family:var(--sans);font-style:normal;font-size:11px;color:var(--champ-ink);font-weight:650}

  .epi-card{padding:9px 12px;box-shadow:none;background:var(--card);border-color:var(--line)}
  /* La bulle pâle du rayon (le coché, lui, redevient neutre : voir .epi-card.done) */
  .epi-card.tinted{background:var(--tint,var(--card));border-color:var(--tint-b,var(--line))}
  .epi-main{display:flex;align-items:center;gap:11px;flex:1;min-width:0;cursor:pointer}
  .epi-qty{font-size:13.5px;color:var(--ink2);font-weight:650;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums;
    padding:4px 8px;border-radius:9px;border:1px solid transparent;transition:border-color .15s,background .15s}
  .epi-qty .u{font-weight:500;color:var(--mut);margin-left:2px}
  .epi-qty .qtyin{width:56px;padding:4px 6px;font-size:14px;font-weight:700;text-align:right;
    border:1px solid var(--wine);border-radius:8px}
  .itxt{font-weight:500}
  .src{font-size:10.5px;color:var(--mut);margin-top:1px}

  /* ---------- Nav mobile : îlot ivoire, pastille nuit ---------- */
  .mobilenav{position:fixed;bottom:calc(10px + var(--safe-b));left:12px;right:12px;z-index:30;
    background:rgba(255,255,255,.82);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);
    border:1px solid color-mix(in srgb,var(--line) 90%,transparent);border-radius:28px;
    box-shadow:0 20px 44px color-mix(in srgb,var(--dark) 16%,transparent),0 2px 6px color-mix(in srgb,var(--dark) 6%,transparent);
    display:flex;justify-content:space-around;align-items:center;padding:6px}
  .mobilenav .nv{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--mut);
    font-weight:600;padding:8px 6px 7px;border-radius:22px;transition:color .2s,background .2s;letter-spacing:.02em;
    flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap}
  .mobilenav .nv.on{color:var(--on-dark);background:var(--night);box-shadow:0 8px 18px color-mix(in srgb,var(--dark) 25%,transparent)}
  .mobilenav .nv svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7}
  .mobilenav .nv.on svg{stroke:var(--champ-soft)}
  .mobilenav .navbadge{box-shadow:0 0 0 2px #fff}

  .weeknav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;background:transparent;
    border:none;padding:0 0 4px}
  .weeknav .arr{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:21px;color:var(--ink);cursor:pointer;transition:background .14s;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-1)}
  .weeknav .arr:active{background:var(--paper-2)}
  .weeknav .lbl{font-family:var(--serif);font-weight:500;font-size:19px;text-align:center;letter-spacing:-.01em;line-height:1.15}
  .weeknav .lbl .sm{display:block;font-family:var(--sans);font-size:9.5px;color:var(--wine);font-weight:650;
    text-transform:uppercase;letter-spacing:.18em;margin-top:3px}

  .secthd{display:flex;align-items:center;gap:10px;margin:24px 2px 12px}
  .secthd .t{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.015em}
  .secthd .ln{flex:1;height:1px;background:var(--line)}

  .filt,.pills{display:flex;gap:7px;overflow-x:auto;padding:1px 2px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filt::-webkit-scrollbar,.pills::-webkit-scrollbar{display:none}
  .fchip,.pill{font-size:12.5px;padding:7px 14px;border-radius:30px;background:var(--card);border:1px solid var(--line);

function weekDates(off){ var m = debutSemaine(new Date()); m.setDate(m.getDate() + off * 7); var a = []; for (var i = 0; i < 7; i++) { var d = new Date(m); d.setDate(m.getDate() + i); a.push(d); } return a; }

/* ---------- Teintes de rayon (liste d'épicerie) ---------- */
// Chaque rayon a sa bulle pâle : les items À ACHETER portent la teinte
// de leur rayon, un item coché redevient neutre et s'efface.
// v5.4 : palette Porcelaine — des tons de marché sourds et chauds
// (sauge, blé, argile, ardoise, crème, givre) qui tiennent à côté du
// noir et du sable. Le rayon est reconnu par son nom ; un rayon inconnu
// prend une teinte de réserve selon son rang. [fond, bordure, point]
var TEINTES = {
  sauge:   ['#EEF2E9', '#DCE4D3', '#6D8663'],   // fruits et légumes
  ble:     ['#F7F0E4', '#E9DCC5', '#A8875A'],   // pain
  argile:  ['#F7ECE7', '#ECD8CF', '#A86D5C'],   // viandes
  ardoise: ['#EDF0F3', '#DAE0E6', '#5F7386'],   // rangée
  creme:   ['#F8F4E2', '#EAE1C0', '#A38E48'],   // produits laitiers
  givre:   ['#EAF2F3', '#D4E3E5', '#5A878D'],   // congélateur
  lavande: ['#F2EEF5', '#E0D8E8', '#7B6B8E'],
  peche:   ['#F9EEE6', '#EDD9C8', '#B07A52']
};
var TEINTES_MOTS = [
  [/fruit|legume/, 'sauge'], [/pain|boulang/, 'ble'], [/viande|poisson|boucher|charcut/, 'argile'],
  [/laitier|fromage|oeuf/, 'creme'], [/congel|surgel/, 'givre'], [/rangee|sec|conserve/, 'ardoise']
];
var TEINTES_RESERVE = ['lavande', 'peche', 'sauge', 'ble', 'argile', 'ardoise', 'creme', 'givre'];
var _rayIdx = null;
function rayonTint(ray){
  var n = norm(ray);
  for (var k = 0; k < TEINTES_MOTS.length; k++) if (TEINTES_MOTS[k][0].test(n)) return TEINTES[TEINTES_MOTS[k][1]];
  if (!_rayIdx) {
    _rayIdx = {};
    rayonsSorted().forEach(function (r, i) { _rayIdx[String(r.Rayon).trim()] = i; });
  }
  var i = _rayIdx.hasOwnProperty(ray) ? _rayIdx[ray] : String(ray).length;
  return TEINTES[TEINTES_RESERVE[i % TEINTES_RESERVE.length]];
}

function lastCookedLabel(r){
  var lc = r.lastCooked; if (!lc) return '';
  var today = new Date(); today.setHours(0,0,0,0);
  var d = parseYmd(lc); d.setHours(0,0,0,0);
  var days = Math.round((today - d) / 86400000);
  if (days < 0) return 'prévu bientôt';
  if (days === 0) return 'aujourd\'hui';
  if (days === 1) return 'hier';

function filtrerListe(root, q){
  if (typeof root === 'string') root = document.querySelector(root);
  if (!root) return;
  var mots = norm(q).split(' ').filter(Boolean), vus = 0;
  qallIn(root, '[data-q]').forEach(function (el) {
    var hay = el.getAttribute('data-q'), ok = mots.every(function (m) { return hay.indexOf(m) >= 0; });
    el.classList.toggle('hide', !ok); if (ok) vus++;
  });
  // Un groupe (ou rayon) sans résultat disparaît le temps de la recherche.
  qallIn(root, '[data-grp]').forEach(function (g) {
    var grille = g.nextElementSibling;
    var nb = grille ? grille.querySelectorAll('[data-q]:not(.hide)').length : 0;
    var garde = !mots.length || nb > 0;
    g.classList.toggle('hide', !garde); if (grille) grille.classList.toggle('hide', !garde);
    // Le compteur du groupe suit la recherche, puis retrouve son total.
    var ct = g.querySelector('.ct');
    if (ct) {
      if (!ct.hasAttribute('data-tot')) ct.setAttribute('data-tot', ct.textContent);
      ct.textContent = mots.length ? nb : ct.getAttribute('data-tot');
    }
  });
  var vide = root.querySelector('.srch-vide');
  if (vide) { vide.classList.toggle('hide', !(mots.length && !vus)); var sp = vide.querySelector('span'); if (sp) sp.textContent = String(q).trim(); }
}
function qallIn(root, sel){ return Array.prototype.slice.call(root.querySelectorAll(sel)); }
function bindSearch(id, scope, onChange){
  var inp = $(id); if (!inp) return;

  function go(){ if (onChange) onChange(inp.value); box.classList.toggle('has', !!inp.value); filtrerListe(scope, inp.value); }
  inp.oninput = go;
  inp.onkeydown = function (e) {
    if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }          // ferme le clavier, garde le filtre
    else if (e.key === 'Escape') { inp.value = ''; go(); }
  };
  var sx = box.querySelector('.sx');

}

/* ---------- Transport ---------- */
// Délai max d'un appel de sync. Sur une barre de réseau, fetch() peut
// PENDRE des minutes : la file restait figée sur « Sync · 3 » et plus
// rien ne passait. Après ce délai l'appel compte comme raté et il est
// rejoué — sans danger, le serveur reconnaît l'opId.
var API_TIMEOUT = 45000;
// Erreurs où le serveur n'a rien écrit et où il suffit de réessayer.
var TRANSITOIRE = /occup|verrou|timed out|trop longtemps|too many|simultan|Service .*(indisponible|unavailable|error|erreur)|Address unavailable|réessayer|try again|internal error|erreur interne|exceeded maximum execution/i;

  var e = new Error(msg || 'Erreur serveur');
  if (retry || TRANSITOIRE.test(e.message)) e.transient = true; else e.server = true;
  return e;
}
// Rend l'enveloppe complète { ok, result, rev } : la révision sert à
// refuser les instantanés plus vieux que nos propres écritures.
// Diagnostic (v5.7.2) : durée des derniers appels et dernier problème,
// montrés quand on touche la pastille de sync.
var DIAG = { appels: [], erreur: null };
function apiRaw(fn, args, opts){
  var t0 = Date.now();
  function noter(err){
    DIAG.appels.push({ fn: fn, ms: Date.now() - t0, ok: !err });
    if (DIAG.appels.length > 30) DIAG.appels.shift();
    if (err) DIAG.erreur = { fn: fn, msg: String(err && err.message || err), t: Date.now(), ms: Date.now() - t0 };
  }
  return apiRawBrut(fn, args, opts).then(function (j) { noter(null); return j; }, function (e) { noter(e); throw e; });
}
function apiRawBrut(fn, args, opts){

    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (res) { resolve({ ok: true, result: res }); })
        .withFailureHandler(function (err) {
          var msg = String(err && err.message || err);
          // Coupure réseau dans l'iframe : on garde l'op en file (pas un refus).
          reject(/NetworkError|HTTP 0|network/i.test(msg) ? new Error(msg) : erreurServeur(msg));
        })[fn].apply(google.script.run, args || []);
    });
  }
  var body = { fn: fn, args: args || [], token: CONFIG.APP_TOKEN, appareil: appareil() };
  if (opts.opId) body.opId = opts.opId;
  var txt = JSON.stringify(body);
  var ctl = (typeof AbortController === 'function') ? new AbortController() : null, minuteur = null;
  // POST text/plain = « simple request » : pas de preflight CORS, aucune limite d'URL.
  // keepalive (v5.7) : l'envoi continue même si on ferme l'app ou qu'on
  // change d'app pendant qu'il part (limite du navigateur : 64 Ko).
  var req = fetch(CONFIG.API_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: txt,
    keepalive: !!opts.keepalive && txt.length < 60000,
    signal: ctl ? ctl.signal : undefined
  }).then(function (r) {
    return r.text().then(function (txt) {
      var j;
      try { j = JSON.parse(txt); }
      catch (e) {
        // Page d'erreur de Google au lieu de notre JSON (404 « impossible
        // d'ouvrir le fichier », 5xx…) : Google débordé. On réessaie plus
        // tard, sans jamais jeter la modification. Le début de la page est
        // gardé pour le diagnostic de la pastille.
        var titre = String(txt || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 90);
        var err = new Error('Google a répondu ' + r.status + (titre ? ' « ' + titre + ' »' : ''));

    });

    minuteur = setTimeout(function () { if (ctl) { try { ctl.abort(); } catch (e) {} } reject(new Error('Délai dépassé')); }, opts.timeout);
  });
  return Promise.race([req, delai]).then(
    function (j) { clearTimeout(minuteur); return j; },
    function (e) { clearTimeout(minuteur); throw e; });
}
function apiCall(fn, args){ return apiRaw(fn, args).then(function (j) { return j.result; }); }
// Le serveur a répondu (même par un refus) : on n'est pas hors ligne.

/* ================================================================

   ================================================================ */
// v5.7 — sync « en direct » :
//  - chaque geste part TOUT DE SUITE ; ce qui s'accumule pendant un envoi
//    part d'un bloc au suivant (lot : un seul aller-retour, dans l'ordre) ;
//  - la réponse d'un lot apporte les ajouts de l'autre téléphone ;
//  - app ouverte, on vérifie toutes les 4 s s'il y a du nouveau (et le
//    nouveau vient dans la même réponse) ;
//  - un instantané du serveur n'efface plus jamais un geste pas encore
//    confirmé : on le rejoue par-dessus (REJEU). Avant, l'instantané
//    était jeté — on ne voyait rien de l'autre tant qu'on touchait l'écran.
var syncQueue = [], flushing = false, inflight = 0, pulling = false, hbBusy = false;
var NEEDS_PULL = false;
var queueCallbacks = {};
var pendEpi = {}, epiT = null, pendLi = {}, liT = null;

var retryT = null;     // nouvel essai différé (erreur passagère)
var pullT = null, pullRejets = 0;

// on le bombarde. « Du nouveau ? » toutes les 5 s quand ça bouge (un geste
// ici ou un changement de l'autre dans les 2 dernières minutes), toutes
// les 15 s sinon, et on ralentit (jusqu'à 60 s) quand Google hoquette.
var HB_MS = 5000, HB_CALME = 15000;
var hbErreurs = 0, dernierMouvement = Date.now(), prochainBattement = 0;
function delaiBattement(){
  if (hbErreurs) return Math.min(60000, HB_MS * Math.pow(2, hbErreurs - 1));
  return (Date.now() - dernierMouvement < 120000) ? HB_MS : HB_CALME;
}
var LOT_MAX = 25;      // gestes par envoi groupé
var LOT_OK = HOSTED ? null : false; // null = inconnu (on essaie) · false = vieux serveur, une op à la fois
var SNAP_ATTENTE = null; // données reçues pendant qu'on tape / qu'une feuille est ouverte
var SNAP_VOL = null;     // données reçues pendant qu'un envoi pend
var flushDebut = 0;      // début de l'envoi en cours
var CORB = {};         // copies locales des lots effacés (bouton « Annuler »)

// Nom de l'appareil, noté au Journal du serveur : « JP · iPhone ».
function appareil(){
  var ua = navigator.userAgent || '', t = /iPad/.test(ua) ? 'iPad' : /iPhone|iPod/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'PC' : 'Web';
  var moi = ''; try { moi = localStorage.getItem('LCO_MOI') || ''; } catch (e) {}

function loadQueue(){
  try { syncQueue = JSON.parse(localStorage.getItem(QKEY) || '[]'); if (!Array.isArray(syncQueue)) syncQueue = []; } catch (e) { syncQueue = []; }
  // Migration : récupérer les modifs offline laissées par l'ancienne app
  try {
    var old = JSON.parse(localStorage.getItem(QKEY_OLD) || '[]');
    if (Array.isArray(old) && old.length) { syncQueue = old.concat(syncQueue); localStorage.removeItem(QKEY_OLD); }
  } catch (e) {}

  // file (app fermée avant l'envoi) vidait, à la réouverture, tout ce que

// Télécharge les données complètes (premier chargement, vieux serveur,

// Toute modification passe par ici : file persistante + copie locale.

  if (isOffline) { txt = pend ? (etiq + ' · ' + pend + ' en attente') : etiq; cls = 'off'; }
  else if (pend || flushing || inflight > 0) { txt = 'Sync · ' + Math.max(pend, 1); cls = 'busy'; }
  else if (pulling) { txt = 'Mise à jour…'; cls = 'busy'; }
  var t = $('syncTxt'); if (t) t.textContent = txt;
  var d = $('syncDot'); if (d) { d.classList.toggle('busy', cls === 'busy'); d.classList.toggle('off', cls === 'off'); }
  var f = $('sfoot'); if (f) f.textContent = txt;

function flushLi(){ var ks = Object.keys(pendLi); if (!ks.length) return; var arr = ks.map(function (k) { return { id: k, coche: pendLi[k] }; }); pendLi = {}; call('setListeItemCochesBatch', [arr]); }

/* ---------- Fusion locale de l'épicerie (miroir du serveur) ---------- */
function srcAdd(cur, add){
  add = String(add || '').trim(); if (!add) return cur || 'manuel';
  var parts = String(cur || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  if (parts.some(function (p) { return /^\d+ recettes/.test(p); })) return cur; // déjà compressé
  var hasMan = parts.indexOf('manuel') >= 0 || / \+ manuel$/.test(String(cur || ''));
  parts = parts.filter(function (p) { return p !== 'manuel' && p !== '+ manuel'; })
    .map(function (p) { return p.replace(/ \+ manuel$/, ''); });
  if (add === 'manuel') hasMan = true;
  else if (parts.indexOf(add) < 0) parts.push(add);
  if (!parts.length) return 'manuel';
  var j = parts.join(', ');
  if (parts.length > 2 || j.length > 48) j = parts.length + ' recettes';
  return hasMan ? j + ' + manuel' : j;
}
function sortEpicerieLocal(){
  var ordre = {};
  rayonsSorted().forEach(function (r) { ordre[String(r.Rayon).trim()] = num(r.Ordre); });
  function rang(ray){ return ordre.hasOwnProperty(ray) ? ordre[ray] : 999; }
  (DATA.epicerie || []).sort(function (a, b) {
    var ra = rang(String(a.Rayon)), rb = rang(String(b.Rayon));
    return ra !== rb ? ra - rb : String(a.Ingredient).localeCompare(String(b.Ingredient));
  });
}
// Retourne { 'ingredient|unite' : ID } des lignes CRÉÉES — envoyé au
// serveur (prefIds) pour qu'il garde les mêmes ID que l'écran.
// rejeu (v5.7) : appelé par REJEU sur des données fraîches — pas d'envoi
// de coches ; prefIds : les ID déjà donnés à ces lignes à l'écran.
function localMergeEpicerie(items, rejeu, prefIds){
  if (!rejeu) flushEpi(); // les coches en attente partent avant cet ajout (même ordre qu'au serveur)
  prefIds = prefIds || {};
  var byKey = {}, nouveaux = {};
  (DATA.epicerie || []).forEach(function (e) { byKey[norm(e.Ingredient) + '|' + norm(e.Unite)] = e; });
  (items || []).forEach(function (it) {
    var nom = String(it.ingredient || '').trim(); if (!nom) return;
    var unite = String(it.unite || '').trim();
    var key = norm(nom) + '|' + norm(unite);
    var src = String(it.source || 'manuel').trim();
    var ex = byKey[key];
    if (ex && isTrue(ex.Coche)) {
      // Déjà dans le panier : nouveau besoin, nouvelle quantité, décoché
      // (même règle que le serveur v5.3).
      ex.Quantite = fmtNum(num(it.quantite));
      ex.Coche = false;
      ex.Source = src || 'manuel';
      if (it.rayon) ex.Rayon = String(it.rayon).trim();
    } else if (ex) {
      ex.Quantite = fmtNum(num(ex.Quantite) + num(it.quantite));
      ex.Source = srcAdd(ex.Source, src);
      if (!ex.Rayon && it.rayon) ex.Rayon = String(it.rayon).trim();
    } else {
      var voulu = it.prefId || prefIds[key];
      var row = { ListeID: (voulu && !epiItem(voulu)) ? voulu : cid('E'), Ingredient: nom, Quantite: fmtNum(num(it.quantite)),
        Unite: unite, Rayon: String(it.rayon || '').trim(), Source: src, Coche: false };
      DATA.epicerie.push(row); byKey[key] = row; nouveaux[key] = row.ListeID;
    }
  });
  sortEpicerieLocal();
  return nouveaux;
}

/* ---------- Rejeu des gestes en attente (v5.7) ----------
   Quand des données arrivent du serveur alors que des gestes ne sont
   pas encore confirmés, chaque geste est refait par-dessus, avec la même
   règle que le serveur. Ainsi on voit les ajouts de l'autre SANS perdre
   les siens. `this` = l'élément de la file (this.ts = heure du geste).
   Un geste absent d'ici (recettes, catalogue…) ne se rejoue pas : les
   données attendent alors qu'il soit confirmé (quelques secondes). */
function pourIds(ids){ var s = {}; (ids || []).forEach(function (i) { s[String(i)] = 1; }); return s; }
function cleSuivi(date, rep, rid){ return String(date) + '|' + repasOf(rep) + '|' + String(rid); }
var REJEU = {
  // Épicerie
  setEpicerieCochesBatch: function (arr) { (arr || []).forEach(function (u) { var x = epiItem(u.id); if (x) x.Coche = u.coche === true; }); },
  setEpicerieCoche: function (id, c) { var x = epiItem(id); if (x) x.Coche = c === true; },
  setEpicerieQuantite: function (id, q) { var x = epiItem(id); if (x) x.Quantite = fmtNum(Math.round(num(q) * 1000) / 1000); },
  retirerEpicerieItem: function (id) { DATA.epicerie = DATA.epicerie.filter(function (x) { return String(x.ListeID) !== String(id); }); },
  ajouterItemEpicerie: function (id, nom, q, u, ray) {
    if (id && epiItem(id)) return; // déjà passé (même règle que le serveur)
    localMergeEpicerie([{ ingredient: nom, quantite: num(q), unite: u, rayon: ray, source: 'manuel', prefId: id }], true);
  },
  ajouterItemsEpicerie: function (items) {
    localMergeEpicerie((items || []).map(function (p) {
      return { ingredient: p.ingredient, quantite: num(p.quantite), unite: p.unite, rayon: p.rayon, source: 'manuel', prefId: p.prefId };
    }), true);
  },
  ajouterRepasEpicerie: function (repas, prefIds) {
    var items = [];
    (repas || []).forEach(function (m) {
      var rep = repasOf(m.repas);
      if (mealTracked(m.date, rep, m.recetteId)) return; // l'autre l'a déjà ajouté : le serveur l'ignorera
      DATA.epicerieRepas.push({ Date: m.date, RecetteID: m.recetteId, Repas: rep });
      ingredientsOf(m.recetteId).forEach(function (ing) {
        items.push({ ingredient: ing.Ingredient, quantite: num(ing.Quantite), unite: ing.Unite, rayon: ing.Rayon, source: recetteNom(m.recetteId) });
      });
    });
    localMergeEpicerie(items, true, prefIds);
  },
  effacerEpicerieIds: function (ids, suivis, lot, seulCoches) {
    var s = pourIds(ids), avant = DATA.epicerie.length;
    DATA.epicerie = DATA.epicerie.filter(function (x) { return !(s[String(x.ListeID)] && (!seulCoches || isTrue(x.Coche))); });
    if (suivis && suivis.length) {
      var t = {}; suivis.forEach(function (m) { t[cleSuivi(m.date, m.repas, m.recetteId)] = 1; });
      DATA.epicerieRepas = DATA.epicerieRepas.filter(function (x) { return !t[cleSuivi(x.Date, x.Repas, x.RecetteID)]; });
    }
    // La carte « Restaurer » vise CE lot tout de suite. Avant, elle
    // montrait l'effacement d'avant jusqu'à la réponse du serveur (un
    // article restauré au lieu de 79).
    var n = avant - DATA.epicerie.length;
    if (lot && n > 0 && !(DATA.corbeille || []).some(function (x) { return x.lot === lot; })) {
      DATA.corbeille = [{ lot: lot, quand: new Date(this.ts || Date.now()).toISOString(), appareil: appareil(), epicerie: n, suivis: (suivis || []).length, liste: 0 }]
        .concat(DATA.corbeille || []);
    }
  },
  restaurerLot: function (lot, lignes, suivis, items) {
    var cles = {};
    DATA.epicerie.forEach(function (e) { cles[norm(e.Ingredient) + '|' + norm(e.Unite)] = 1; });
    (lignes || []).forEach(function (r) {
      var k = norm(r.Ingredient) + '|' + norm(r.Unite);
      if (epiItem(r.ListeID) || cles[k]) return;
      cles[k] = 1; DATA.epicerie.push(JSON.parse(JSON.stringify(r)));
    });
    (suivis || []).forEach(function (m) {
      if (!mealTracked(m.date, repasOf(m.repas), m.recetteId)) DATA.epicerieRepas.push({ Date: m.date, RecetteID: m.recetteId, Repas: repasOf(m.repas) });
    });
    (items || []).forEach(function (it) { if (!liItem(it.ItemID)) DATA.listeItems.push(JSON.parse(JSON.stringify(it))); });
    DATA.corbeille = (DATA.corbeille || []).filter(function (x) { return x.lot !== lot; });
    sortEpicerieLocal();
  },
  viderEpicerie: function () { DATA.epicerie = []; DATA.epicerieRepas = []; },
  nettoyerEpicerieCochee: function () { DATA.epicerie = DATA.epicerie.filter(function (x) { return !isTrue(x.Coche); }); },
  // Listes
  ajouterListeItem: function (id, listeId, texte) { if (!liItem(id)) DATA.listeItems.push({ ItemID: id, ListeID: listeId, Texte: texte, Coche: false }); },
  setListeItemCochesBatch: function (arr) { (arr || []).forEach(function (u) { var x = liItem(u.id); if (x) x.Coche = u.coche === true; }); },
  retirerListeItem: function (id) { DATA.listeItems = DATA.listeItems.filter(function (x) { return String(x.ItemID) !== String(id); }); },
  nettoyerListeIds: function (ids) { var s = pourIds(ids); DATA.listeItems = DATA.listeItems.filter(function (x) { return !(s[String(x.ItemID)] && isTrue(x.Coche)); }); },
  nettoyerListeCochee: function (lid) { DATA.listeItems = DATA.listeItems.filter(function (x) { return !(String(x.ListeID) === String(lid) && isTrue(x.Coche)); }); },
  // Menu (un créneau qui change de recette n'est plus « dans la liste »)
  setSouper: function (date, rid, cook, rep) { REJEU.setSoupersBatch([{ date: date, recetteId: rid, cuisinier: cook, repas: rep }]); },
  setSoupersBatch: function (arr) {
    (arr || []).forEach(function (a) {
      var rep = repasOf(a.repas), s = souperFor(a.date, rep);
      if (s) {
        if (String(s.RecetteID) !== String(a.recetteId)) untrackDateLocal(a.date, rep);
        s.RecetteID = a.recetteId; s.Cuisinier = a.cuisinier || '';
      } else DATA.soupers.push({ Date: a.date, RecetteID: a.recetteId, Cuisinier: a.cuisinier || '', Repas: rep });
    });
  },
  retirerSouper: function (date, rep) {
    rep = repasOf(rep);
    DATA.soupers = DATA.soupers.filter(function (s) { return !(s.Date === date && repasOf(s.Repas) === rep); });
    untrackDateLocal(date, rep);
  },
  setChasse: function (j, rep, rid) {
    rep = repasOf(rep);
    var ex = chasseFor(j, rep);
    if (ex) { if (String(ex.RecetteID) !== String(rid)) untrackDateLocal('CHASSE-J' + j, rep); ex.RecetteID = rid; }
    else DATA.chasse.push({ Jour: j, Repas: rep, RecetteID: rid });
  },
  retirerChasse: function (j, rep) {
    rep = repasOf(rep);
    DATA.chasse = DATA.chasse.filter(function (c) { return !(String(c.Jour) === String(j) && repasOf(c.Repas) === rep); });
    untrackDateLocal('CHASSE-J' + j, rep);
  },
  // Calendrier, Julie & JP
  ajouterEvenement: function (id, date, titre) {
    if (!DATA.evenements.some(function (x) { return String(x.EvenementID) === String(id); })) DATA.evenements.push({ EvenementID: id, Date: date, Titre: String(titre || '').trim() });
  },
  retirerEvenement: function (id) { DATA.evenements = DATA.evenements.filter(function (x) { return String(x.EvenementID) !== String(id); }); },
  setNous: function (qui, etat, note, humeur) {
    var q = String(qui || '').toLowerCase().trim(), r = nousRow(q);
    if (!r) { r = { Qui: q, Etat: '', Note: '', Humeur: '' }; DATA.nous.push(r); }
    r.Etat = String(etat || ''); r.Note = String(note || ''); r.MisAJour = new Date(this.ts || Date.now()).toISOString();
    if (!(humeur === null || typeof humeur === 'undefined')) r.Humeur = String(humeur);

  // Recettes (articles « à côté » du Menu Chasse, carnet)
  ajouterRecette: function (p) {

      types: (p.types || []).slice(), etapes: (p.etapes || []).slice(), lastCooked: '' });
    ingredientsRejeu(p);
  },
  modifierRecette: function (p) {
    var r = recette(p.id); if (!r) return;
    r.Nom = p.nom; r.Portions = num(p.portions) || 4; r.types = (p.types || []).slice(); r.Types = r.types.join(', '); r.etapes = (p.etapes || []).slice();
    DATA.ingredients = DATA.ingredients.filter(function (i) { return String(i.RecetteID) !== String(p.id); });
    ingredientsRejeu(p);
  },
  supprimerRecette: function (rid) {
    DATA.recettes = DATA.recettes.filter(function (x) { return String(x.RecetteID) !== String(rid); });
    DATA.ingredients = DATA.ingredients.filter(function (x) { return String(x.RecetteID) !== String(rid); });
  }

// Efface des lignes d'épicerie PAR ID (et oublie des repas du suivi),
// avec « Annuler » : le lot part à la corbeille du serveur.
function effacerEpicerie(lignes, suivis, seulCoches, msg){
  var lot = cid('LOT'), ids = lignes.map(function (x) { return String(x.ListeID); });
  CORB[lot] = { lignes: JSON.parse(JSON.stringify(lignes)), suivis: suivis, items: [] };
  REJEU.effacerEpicerieIds(ids, suivis, lot, seulCoches);
  call('effacerEpicerieIds', [ids, suivis, lot, seulCoches]);
  render();
  toastAction(msg, 'Annuler', function () { restaurerLotUi(lot, 'Remis dans la liste'); });
}
// Remet un lot : tout de suite à l'écran si on en a la copie (effacé
// d'ici), sinon à la réponse du serveur (effacé par l'autre téléphone).
function restaurerLotUi(lot, msg){
  var c = CORB[lot] || { lignes: [], suivis: [], items: [] };
  REJEU.restaurerLot(lot, c.lignes, c.suivis, c.items);
  DATA.corbeille = (DATA.corbeille || []).filter(function (x) { return x.lot !== lot; });
  call('restaurerLot', [lot, c.lignes, c.suivis, c.items]);
  delete CORB[lot];
  render(); toast(msg);
}
function ingredientsRejeu(p){
  (p.ingredients || []).forEach(function (ing) {
    DATA.ingredients.push({ RecetteID: p.id, Ingredient: ing.ingredient, Quantite: fmtNum(num(ing.quantite)), Unite: ing.unite, Rayon: ing.rayon });
    if (!DATA.catalogue.some(function (c) { return norm(c.Ingredient) === norm(ing.ingredient); })) DATA.catalogue.push({ Ingredient: ing.ingredient, Rayon: ing.rayon });
  });
}

/* ---------- Toast ---------- */
// Avec un bouton (« Annuler ») : reste plus longtemps, un seul à la fois.
function toastAction(msg, lbl, fn){
  qall('.toast.act').forEach(function (x) { x.remove(); });
  var t = document.createElement('div');
  t.className = 'toast act';
  t.innerHTML = '<span>' + esc(msg) + '</span><button type="button">' + esc(lbl) + '</button>';
  document.body.appendChild(t);
  var fini = false;
  function fermer(){ if (fini) return; fini = true; t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function () { t.remove(); }, 300); }
  t.querySelector('button').onclick = function () { fermer(); fn(); };
  setTimeout(fermer, 6500);
}
function toast(msg, kind){
  var t = document.createElement('div');
  t.className = 'toast' + (kind === 'err' ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function () { t.remove(); }, 300); }, kind === 'err' ? 3400 : 2200);
}

function hideSplash(){ if (splashHidden) return; splashHidden = true; var s = $('splash'); if (s) { s.classList.add('gone'); setTimeout(function () { s.remove(); }, 550); } }

var SPLASH = { t0: Date.now(), finPoeme: 6000, poemeFini: false, pret: false };
function montrerPoeme(){
  var box = $('spTexte'); if (!box) return;
  var n = MOTS_FAMILLE.length, i = Math.floor(Math.random() * n), der = -1;
  try { der = parseInt(localStorage.getItem('LCO_POEME'), 10); } catch (e) {}
  if (n > 1 && i === der) i = (i + 1 + Math.floor(Math.random() * (n - 1))) % n;
  try { localStorage.setItem('LCO_POEME', String(i)); } catch (e) {}
  var q = MOTS_FAMILLE[i];
  // Rythme : le texte commence pendant que la branche se dessine ; un
  // mot toutes les 70 à 150 ms. Temps de lecture : ~70 ms par lettre
  // depuis le premier mot, au moins 2,5 s après le dernier mot posé.
  var DEBUT = 1100, nbMots = q.t.split(/\s+/).length;
  var pas = Math.max(70, Math.min(150, 4200 / nbMots)), k = 0;
  box.innerHTML = q.t.split('\n').map(function (ligne) {
    return ligne.split(' ').map(function (m) {
      return '<span class="w" style="animation-delay:' + Math.round(DEBUT + (k++) * pas) + 'ms">' + esc(m) + '</span>';
    }).join(' ');
  }).join('<br>');
  $('spAuteur').textContent = q.a;
  var finMots = DEBUT + nbMots * pas + 900;
  var finLecture = Math.max(finMots + 2500, DEBUT + q.t.length * 70, 5500);
  SPLASH.finPoeme = finLecture;
  setTimeout(function () { var a = $('spAuteur'); if (a) a.classList.add('on'); var sk = $('spSkip'); if (sk) sk.classList.add('on'); }, finMots - 300);
  // La barre de chargement suit la lecture : pleine quand le texte est lu.
  var bar = $('spBar');
  if (bar) {
    bar.classList.add('prog');
    var bi = bar.querySelector('i'); bi.style.transitionDuration = finLecture + 'ms';
    requestAnimationFrame(function () { requestAnimationFrame(function () { bi.style.width = '100%'; }); });
  }
  setTimeout(function () { SPLASH.poemeFini = true; tenterFinSplash(); }, finLecture);
  // Filet de sécurité : sans réseau au tout premier lancement, on ne
  // garde pas l'écran plus de 4 s après la lecture.
  setTimeout(hideSplash, finLecture + 4000);
}
// L'écran s'efface quand le texte est lu ET que les données sont là.
function tenterFinSplash(){ if (SPLASH.poemeFini && SPLASH.pret) hideSplash(); }
// Toucher l'écran de chargement le passe, à tout moment.
(function () { var sp = $('splash'); if (sp) sp.addEventListener('click', hideSplash); })();
montrerPoeme();

/* ---------- Chargement initial ---------- */
function load(){
  loadQueue();
  var cached = loadLocal();
  if (cached) { DATA = normalizeData(cached.data); REV = cached.rev || 0; render(); }
  // L'écran de chargement attend la fin de la lecture du mot sur la
  // famille (montrerPoeme) : ici on signale seulement que les données
  // sont prêtes. Avec une copie locale, elles le sont tout de suite.
  function finish(){ SPLASH.pret = true; tenterFinSplash(); }
  if (cached) finish();
  // Des gestes attendent : leur envoi rapporte aussi le nouveau.
  if (syncQueue.length) { updateSync(); flushQueue(); }
  // Copie locale : on ne télécharge tout que si quelque chose a changé.
  if (cached) { if (!syncQueue.length) heartbeat(true); return; }
  pull().then(function () {
    finish();
    if (!DATA) {
      $('view').innerHTML = '<div class="empty">' + CREST_MINI + 'Pas de connexion et aucune donnée enregistrée.<br>Connecte-toi à Internet une première fois pour charger tes données.<br><br><button class="btn sm" onclick="location.reload()" style="margin:0 auto;width:auto">Réessayer</button></div>';
    }
  });
}

// « Restaurer » : le dernier lot effacé (par n'importe quel téléphone),

  if (!l) return '';

    '<button class="btn ghost sm" data-restaure="' + esc(l.lot) + '" type="button" style="margin:0 auto">Restaurer ces articles</button></div>';

function rayBlock(ray, items){

  h += '<div class="fold' + (open ? '' : ' closed') + '"><div>';

  });

function refreshRayonCount(ray){

function editQty(id, el){
  var it = epiItem(id); if (!it) return;
  var unit = it.Unite;

  var inp = el.querySelector('.qtyin'); inp.focus(); inp.select();

    var v = inp.value.replace(',', '.');
    var nq = parseFloat(v); if (isNaN(nq)) nq = 0;
    it.Quantite = fmtNum(Math.round(nq * 1000) / 1000);

  };
}

/* ============ MENU CHASSE ============ */
function chasseFor(j, rep){ return (DATA.chasse || []).filter(function (c) { return String(c.Jour) === String(j) && repasOf(c.Repas) === rep; })[0]; }
// « À côté du menu » : des lignes Chasse dont le Jour n'est pas 1 à 8
// mais un code de 2 caractères (x7, k2…). Hors de la grille, donc hors
// du menu imprimé ; mais suivies comme les autres (CHASSE-Jx7 tient dans
// les 10 caractères de date du suivi serveur) et versées à l'épicerie.
function estExtraChasse(c){ return !/^\d+$/.test(String(c.Jour)); }
function codeExtraChasse(){
  var pris = {}; (DATA.chasse || []).forEach(function (c) { pris[String(c.Jour)] = 1; });
  var L = 'xyzwvutsrqpnmkhgfdcba', C = '0123456789abcdefghijklmnopqrstuvwxyz';
  for (var k = 0; k < 3000; k++) {
    var code = L.charAt(Math.floor(Math.random() * L.length)) + C.charAt(Math.floor(Math.random() * C.length));

  (DATA && DATA.nous || []).forEach(function (r) {
    var t = new Date(r.MisAJour || 0).getTime();
    if (!isNaN(t) && t > mx) mx = t;
  });
  return mx;
}
function nousNonVu(){
  var vu = 0;
  try { vu = new Date(localStorage.getItem(NOUS_VU_KEY) || 0).getTime() || 0; } catch (e) {}
  return nousDernier() > vu;
}
function marquerNousVu(){
  try { localStorage.setItem(NOUS_VU_KEY, new Date().toISOString()); } catch (e) {}
  majCoeur();
}
function majCoeur(){ var g = $('goNous'); if (g) g.classList.toggle('new', nousNonVu()); }
function timeAgo(v){
  if (!v) return '';
  var d = new Date(v); if (isNaN(d.getTime())) return '';
  var mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 2) return 'à l\'instant';
  if (mins < 60) return 'il y a ' + mins + ' min';
  var h2 = Math.round(mins / 60);
  if (h2 < 24) return 'il y a ' + h2 + ' h';
  var j2 = Math.round(h2 / 24);
  return j2 === 1 ? 'hier' : 'il y a ' + j2 + ' jours';
}
var COEUR = '<svg viewBox="0 0 24 24" style="width:26px;height:26px;stroke:var(--pri)" fill="none" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 20 C 3.5 14.5, 2.8 7.5, 7.2 5.8 C 10 4.8, 12 7, 12 9 C 12 7, 14 4.8, 16.8 5.8 C 21.2 7.5, 20.5 14.5, 12 20"/></svg>';
function viewNous(){
  var h = '<div class="ph">Julie <span style="color:var(--acc);font-style:italic">&amp;</span> JP</div><div class="psub">Pour se dire les vraies affaires, même quand les mots sortent pas encore</div><div style="max-width:600px" class="pane-a">';
  if (nousNonVu()) {
    h += '<button class="btn ghost sm" id="nousVuBtn" style="margin-bottom:14px">Vu — merci de me l\'avoir dit ❤️</button>';
  }
  NOUS_PERS.forEach(function (p, i) {
    var r = nousRow(p.id) || {};
    var etat = (nousEtats(p.f).filter(function (e2) { return e2.id === String(r.Etat); })[0] || null);
    var quand = timeAgo(r.MisAJour);
    var aContenu = !!(etat || r.Note);
    h += '<div class="card" style="padding:16px 18px"><div class="row" style="margin-bottom:10px"><span style="font-family:var(--serif);font-size:26px;font-weight:600" class="grow">' + p.nom + '</span>' + (quand ? '<span class="small muted">' + esc(quand) + '</span>' : '') + '</div>';
    // La bande d'humeurs : touche un visage pour dire comment tu te
    // sens — retouche-le pour l'effacer. Direct, sans passer par la feuille.
    h += '<div class="humband">' + HUMEURS.map(function (hm) {
      var on = String(r.Humeur || '') === hm.id;
      return '<span class="hum clk' + (on ? ' on' : '') + '" data-hum="' + hm.id + '" data-quih="' + p.id + '" title="' + hm.lbl + '">' + humeurSvg(hm, 22) + '</span>';
    }).join('') + '</div>';
    if (etat) h += '<div class="ttag" style="font-size:13px;padding:8px 14px;display:inline-block;margin-bottom:10px">' + esc(etat.txt) + '</div>';
    if (r.Note) h += '<div style="font-family:var(--serif);font-size:16px;font-style:italic;line-height:1.6;color:var(--ink2);margin-bottom:12px">« ' + esc(r.Note) + ' »</div>';
    if (!aContenu) h += '<div class="small muted" style="margin-bottom:10px">Rien d\'affiché pour l\'instant.</div>';
    h += '<div class="row"><button class="btn ghost sm" data-nousedit="' + p.id + '">C\'est moi — modifier</button>' + (aContenu ? '<span class="small clk" data-nousclear="' + p.id + '" style="color:var(--danger);font-weight:600;margin-left:6px">Effacer</span>' : '') + '</div></div>';
    if (i === 0) h += '<div style="display:flex;justify-content:center;margin:2px 0 10px">' + COEUR + '</div>';
  });
  h += '<div class="small muted" style="text-align:center;margin-top:14px;line-height:1.7">L\'état et le mot restent affichés jusqu\'à ce que la personne les change.<br>Pas de notification, pas de pression — juste une porte ouverte.</div>';
  h += '</div>';
